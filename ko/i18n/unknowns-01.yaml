      죽은 참가자의 사망(유일하게 일관된 해석)
    B: >-
      부활시키는 사람의 사망
  resolution_paths:
  - >-
    Healing 페이지의 표현이 A를 뒷받침합니다.
U-0012:
  question: >-
    Kick 라이브 상태는 어떻게 감지되며, 지연은 얼마입니까?
  why_it_matters: >-
    스트림이 끊기면 전투 도중 10% 보정이 뒤바뀔 수 있습니다.
  resolution_paths:
  - >-
    주최자의 발언, 전투 중 스트림 재접속이 담긴 VOD.
U-0013:
  question: >-
    events/safe-zone/ 에셋은 규칙이 다른 이전 판에 속합니까?
  why_it_matters: >-
    재사용된 콘텐츠와 새 콘텐츠를 구분할 수 있게 됩니다.
  resolution_paths:
  - >-
    RE-0002, corpus/diffs/
  resolution: >-
    그렇습니다. 2026년 10월 Austin 판입니다(RE-0002, RE-0005). 규칙 모델과는 무관합니다. 2026-11-11 스냅샷만이 규칙의 출처입니다(프로젝트 소유자 결정, 2026-11-11).
U-0014:
  question: >-
    시청자 공격의 Cx-Bucks 가격은 얼마입니까?
  why_it_matters: >-
    가격이 없으면 8.10절은 공격을 Cx-Buck당 피해가 아니라 피해만으로 순위를 매길 수 있고, 왕관 처치 보너스(가격의 20%)는 값을 갖지 못합니다.
  resolution_paths:
  - >-
    SCOPE.md P3(api 경로 'purchasables', 호출하지 않음).
  - >-
    시청자 상점의 VOD.
  - >-
    상점 페이지, 현재는 범위 밖입니다.
U-0015:
  question: >-
    상자 규칙(종류, 획득 범위, 생성 빈도, 내용물)은 무엇입니까? 상자 페이지는 삭제되었습니다(RE-0004).
  why_it_matters: >-
    Piety, Greed, Trolling, Ingenuity의 메커니즘은 모두 상자에 작용하므로, 그 가치는 상자 빈도에 달려 있습니다.
  resolution_paths:
  - >-
