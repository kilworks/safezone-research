id: U-0004
question: Can Eddie's potion 30% loss kill, and do armor, fortress or Kick status apply to it?
why_it_matters: Decides whether the potion is a last resort or a suicide at low HP.
readings:
  A: Loss can kill, no protection applies.
  B: Loss can kill, pipeline applies (armor absorbs, Kick reduces).
  C: Loss cannot take HP below 1.
resolution_paths:
- 'VOD: a contestant at HP <= 30% of max drinking it.'
- The damage table lists 'Eddie's Potion backfire' as stoppable by Shield, Safety bubble, Sleeping Bag and Body armor, which supports B for blocking (to be formalized).
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. Reading A (no protection applies) is refuted: the damage table has a row "Eddie''s Potion backfire" with Shield, Safety bubble and Sleeping Bag as blockers and "Body armor (absorbs)" (wiki-damage-030), and "Body Armor works on every kind of damage" (wiki-damage-071). Still open: whether the loss can kill or stops at 1 HP (readings B and C), and whether the Kick-live reduction and a fortress apply, which is the part of U-0002 that is left.'
