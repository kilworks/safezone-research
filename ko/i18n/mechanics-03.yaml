"M-0170":
  "name": >-
    독 틱: 1min 30s마다 1 HP
  "quotes":
  - >-
    독은 1min 30s마다 1 HP의 피해를 줍니다.
  "readings":
    "A": >-
      중독 상태 동안: t_p = 90, 180, ...에서 HP 1 감소
    "B": >-
      첫 감소는 t_p = 0에서 발생
  "domain": >-
    중독 이후 경과한 초 t_p
  "parameters":
    "tick_hp": >-
      1
    "interval_s": >-
      90
  "notes": >-
    30 min당 20 HP에 해당하며, Poison Dart가 30min 동안 20 HP만큼 중독시킨다는 다른 페이지와 일치합니다(이후의 유도 대상이며 여기서는 단정하지 않습니다). 1 HP에서는 Kick 감소가 의미가 없습니다(독이 타격일 때만 최소 1, U-0002).
"M-0171":
  "name": >-
    다시 중독되면 타이머가 초기화되며 중첩되지 않음
  "quotes":
  - >-
    다시 중독되면 타이머가 초기화되며, 중첩되지 않습니다.
  "readings":
    "A": >-
      다시 중독: countdown := 90 s; damage_remaining은 변하지 않음
    "B": >-
      countdown := 90 s 및 damage_remaining := total
  "parameters":
    "total_hp": >-
      UNKNOWN, U-0116 참조
"M-0172":
  "name": >-
    독은 모든 피해를 입히거나 치료되면 끝남
  "quotes":
  - >-
    독은 모든 피해를 입혔거나 치료된 경우에만 끝납니다.
  "readings":
    "A": >-
      damage_dealt = total 또는 치료 이벤트일 때, 그리고 그때에만 poisoned := false
  "parameters":
    "total_hp": >-
      UNKNOWN, U-0116 참조
  "notes": >-
    차단된 틱이 입힌 피해로 계산되는지는 U-0117에서 다룹니다.
"M-0173":
  "name": >-
    독의 원천: Poison dart와 Fake gravestone
  "quotes":
  - >-
    Poison dart 또는 Fake gravestone에 의해 중독될 수 있습니다.
  "readings":
    "A": >-
      독 이벤트는 정확히 두 원천에서 발생: Poison dart, Fake gravestone
  "notes": >-
    다른 페이지에는 효과 존이나 다른 아이템이 중독시킬 수 있다고 되어 있지만, 이 페이지는 이 둘만 나열합니다('can be poisoned by').
"M-0174":
  "name": >-
    독의 치료: Anti poison, Healing 회복, God's Fruit
  "quotes":
  - >-
    독은 다음으로 치료할 수 있습니다: Anti poison, Healing 회복(Healing healing), 또는 God's Fruit
  "readings":
    "A": >-
      치료 이벤트: Anti poison, Healing 참가자의 회복, God's Fruit
  "notes": >-
    귀속은 원문에 적힌 그대로 유지했습니다: 'Healing healing'은 Healing 시길에 의한 회복을 뜻합니다.
"M-0175":
  "name": >-
    Protection 시길은 독에 완전 면역
  "quotes":
  - >-
    Protection 시길: 완전 면역
  "readings":
    "A": >-
      sigil = Protection: poisoned는 결코 true가 되지 않음
  "notes": >-
    피해 표의 Poison 행에 Protection이 나열되어 있어 일치합니다.
"M-0176":
  "name": >-
    Anti poison: 지속되는 동안 새 독 없음
  "quotes":
  - >-
    Anti poison: 지속되는 동안 새로운 독이 걸리지 않습니다.
  "readings":
    "A": >-
      Anti poison 활성 동안: 새 독 이벤트는 무시됨; 기존 독은 이 조항의 영향을 받지 않음
  "notes": >-
    치료와 면역: 아이템 페이지에는 Anti poison이 독을 치료하고 10 min의 면역을 준다고 되어 있습니다. 이 페이지는 치료를 따로 나열합니다(M-0174). 지속 시간은 아이템 페이지에 있습니다.
