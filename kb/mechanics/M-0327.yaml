id: M-0327
name: Sleeping Bag ownership
family: items
sigils:
- all
sources:
- url: https://iceposeidon.com/safezone/wiki/merchant#items
  snapshot: '2026-11-11'
  clause: wiki-merchant-020
  quote: 'Sleeping Bag: 30 blood tokens.'
- url: https://iceposeidon.com/safezone/wiki/merchant#items
  snapshot: '2026-11-11'
  clause: wiki-merchant-025
  quote: Only you can pick up your bag.
- url: https://iceposeidon.com/safezone/wiki/merchant#items
  snapshot: '2026-11-11'
  clause: wiki-merchant-026
  quote: You can have only one Sleeping Bag, held or placed.
- url: https://iceposeidon.com/safezone/wiki/merchant#items
  snapshot: '2026-11-11'
  clause: wiki-merchant-027
  quote: It cannot be dropped or stolen, only destroyed by you.
- url: https://iceposeidon.com/safezone/wiki/merchant#items
  snapshot: '2026-11-11'
  clause: wiki-merchant-028
  quote: Greed can still steal your other items while you sleep.
formal:
  readings:
    A: 30 tokens; only the owner can pick up the bag; at most one bag held or placed; it cannot be dropped or stolen, only destroyed by its owner; Greed can still steal other items from a sleeper
  parameters:
    sleeping_bag_cost_tokens: '30'
depends_on: []
interacts_with: []
label: DOCUMENTED
notes: Consistent with the Greed page ('Sleeping Bags cannot be stolen, but you can steal from a sleeping contestant').
