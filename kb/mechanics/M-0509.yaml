id: M-0509
name: Greed steal action
family: sigil
sigils:
- greed
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: 'Steal: take one item of your choice from a contestant within 10m (33ft).'
  clause: wiki-sigils-greed-013
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: Equipped weapons and worn Body Armor can be stolen.
  clause: wiki-sigils-greed-015
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: Sleeping Bags cannot be stolen, but you can steal from a sleeping contestant.
  clause: wiki-sigils-greed-016
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: You cannot steal from Piety players.
  clause: wiki-sigils-greed-017
formal:
  readings:
    A: 'steal(thief, victim, item): requires dist <= 10 m, thief has Greed, victim not Piety, victim not fortress-protected,
      item in victim inventory or equipped weapon or worn Body Armor, item is not a Sleeping Bag; victim may be
      asleep; moves item to thief'
  domain: dist in metres 0..10 inclusive (the text says 'within 10m')
  parameters:
    range_m: '10'
    items_per_use: '1'
depends_on: []
interacts_with:
- M-0510
- M-0511
- M-0507
label: CONDITIONAL
open_unknowns:
- U-0509
notes: Cannot be used from inside a smoke bomb and not while blinded (items page, another family); the merchant
  page confirms Greed can steal other items while the victim sleeps. Inclusive versus exclusive 10 m is not stated;
  the model uses <=.
