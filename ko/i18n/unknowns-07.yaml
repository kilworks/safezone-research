      어떤 부착이든 16 h의 단일 공유 쿨다운
    B: >-
      C4 부착과 landmine 부착에 각각 별도의 16 h 쿨다운
    C: >-
      가시성: 소유자만 함정을 봄
    D: >-
      가시성: 소유자와 모든 Ingenuity 참가자가 봄
