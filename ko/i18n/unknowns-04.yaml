U-0313:
  question: >-
    Wizard staff: 5s 중 일부 시간만 범위 안에 있던 참가자는 10 HP 전체를 받습니까, 일부만 받습니까? 설치 후에 들어온 참가자도 피해를 받습니까?
  why_it_matters: >-
    범위에서 재빨리 벗어나면 피해를 피할 수 있는지, 이동 경로 앞에 설치하는 것이 통하는지를 결정합니다.
  readings:
    A: >-
      설치 시점에 범위 안에 있던 모두가 10 HP 전체를 받음
    B: >-
      범위 안에 있는 동안에만 피해가 누적됨(범위 안에 있던 시간에 비례)
    C: >-
      5s 중 어느 순간이든 범위 안에 있던 모두가 10 HP 전체를 한 번 받음
  resolution_paths:
  - >-
    VOD: 활성 staff 범위를 벗어나거나 들어오는 참가자.
U-0314:
  question: >-
    Wizard staff 'Each use costs 2 blood tokens': Ingenuity의 10% 할증이 여기에 적용됩니까? 토큰이 2개 미만이면 어떻게 됩니까?
  why_it_matters: >-
