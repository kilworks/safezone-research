id: M-0205
name: Effects that count toward the cap
family: items
sigils:
- all
sources:
- url: https://iceposeidon.com/safezone/wiki/items#effects
  snapshot: '2026-11-11'
  clause: wiki-items-006
  quote: 'These count: a Shield, a Guardian angel, a Mirror forcefield, Anti poison immunity, a Flak jacket, a Gas mask, Zombie repellent, and a Hazmat suit while you carry it.'
formal:
  readings:
    A: counted = Shield, Guardian angel, Mirror forcefield, Anti poison immunity, Flak jacket, Gas mask, Zombie repellent, Hazmat suit (while carried); nothing else
    B: same list but each Mirror forcefield counts separately (several can stack)
    C: same list but all Mirror forcefields together count once
  domain: set of effect kinds; multiplicity of mirrors open
  parameters: {}
depends_on:
- M-0203
interacts_with:
- M-0206
label: CONDITIONAL
open_unknowns:
- U-0201
- U-0202
notes: 'Not named in either list: EMP (timed 10min), Thermal goggles (also ''while you carry them''), Body armor, Sleeping Bag, Health potions. See U-0202.'
