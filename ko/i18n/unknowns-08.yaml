U-0539:
  question: >-
    언세이프 서클(unsafe circle) 아이템 손실: 잃은 아이템은 파괴됩니까 떨어집니까, "면역 아님" 조건은 시계를 멈춥니까 손실만 건너뜁니까, 그리고 활성 효과(인벤토리가 아닌 것)도 영향을 받습니까?
  why_it_matters: >-
    떨어진 아이템은 트롤이 루팅할 수 있고, 파괴된 아이템은 사라집니다. Guardian angel, Safety bubble, Reality Shield, Death Ward에 의한 면역은 피해와 손실을 모두 막습니다.
  readings:
    A: >-
      파괴됨, 인벤토리 아이템과 고유 조합 아이템만
    B: >-
      참가자의 발 밑에 떨어짐
    C: >-
      파괴됨, 활성 효과(실행 중인 Shield, 착용 중인 Hazmat suit)도 제거됨
    D: >-
      면역 중에는 시계가 계속 흐르고 손실만 건너뜀, 또는 면역 중에는 시계가 멈춤
  resolution_paths:
  - >-
    VOD: 언세이프 서클에서 아이템을 잃는 참가자.
U-0540:
  question: >-
    Trolling 보급 상자 유인 "Trolling 참가자 옆에 떨어질 확률 3%": 어떤 상자가 굴림 대상이며, Trolling 참가자가 여러 명일 때 참가자는 어떻게 정해지고, 추첨은 상자당 한 번입니까?
  why_it_matters: >-
    Trolling 페이지는 시청자의 크레이트와 보급 상자라고 하고, 공격 페이지는 5 m 이내에 떨어지는 보급 상자(모든 보급 상자)만이라고 합니다. Trolling 참가자가 N명일 때 유인 확률은 전체 3%일 수도, 각각 3%일 수도 있습니다.
  readings:
    A: >-
      모든 보급 상자가 한 번씩 굴림(3%), 성공하면 Trolling 참가자를 균등하게 선택, 크레이트는 영향 없음
    B: >-
      시청자가 구매한 크레이트와 보급 상자가 각각 한 번씩 굴림(3%)
    C: >-
      각 Trolling 참가자가 독립적으로 굴림, 상자마다 각각 3%
  resolution_paths:
  - >-
    VOD: 많은 투하에 걸친 보급 상자 착지 지점 집계.
  - >-
    주최 측 발표.
U-0600:
  question: >-
    Death 묘비 약탈 회복: 최대 HP의 5%인데, 소수 결과는 어떻게 반올림합니까(기본 최대 HP는 100이지만 상인이 최대 HP를 10씩 올려 팔기 때문에 110의 5%는 5.5입니다)?
  why_it_matters: >-
    최대 HP가 20의 배수가 아니면 모든 약탈 회복이 최대 1 HP 달라집니다. Death의 지속력에 영향을 줍니다.
  readings:
    A: >-
      회복 = floor(M*5/100)
    B: >-
      회복 = ceil(M*5/100)
    C: >-
      회복 = M*5/100의 반올림(half up)
    D: >-
      소수 HP를 그대로 유지
  resolution_paths:
  - >-
    VOD: 최대 HP 110인 Death 참가자가 묘비를 약탈하면 +5(A), +6(B 또는 C), +5.5(D)로 표시됩니다.
U-0601:
  question: >-
    Death 회복 "지금까지 탈락한 모든 참가자마다, 본인 포함": 무엇을 셉니까, 그리고 부활한 참가자도 여전히 셉니까?
  why_it_matters: >-
    근처 사망마다의 회복 크기 N을 정합니다. N은 이벤트 중에 커지므로 선택에 따라 Death의 총 회복량이 달라집니다.
  readings:
    A: >-
      N = 이벤트 시작 이후의 사망 횟수, 새 희생자 포함(부활해도 줄지 않음)
    B: >-
      N = 현재 죽어 있는 참가자 수, 새 희생자 포함(부활하면 줄어듦)
    C: >-
      N = 한 번 이상 사망한 서로 다른 참가자 수
  resolution_paths:
  - >-
    VOD: 부활 뒤에 이어진 사망 후 Death 참가자에게 표시되는 회복량.
U-0602:
  question: >-
    Death 상한 "참가자의 20% 이하가 생존했을 때": 20%는 무엇을 기준으로 하며 어떻게 반올림하고, 생존자 수는 회복을 일으키는 사망 이전에 셉니까 이후에 셉니까?
  why_it_matters: >-
    60% 상한이 켜지는 정확한 탈락 시점을 정합니다. 전체 참가자가 N명일 때 임계값이 참가자 한 명만큼 달라집니다.
  readings:
    A: >-
      정확히 alive * 5 <= N (alive <= floor(N/5)와 같음)
    B: >-
      alive <= ceil(N/5)
    C: >-
      생존자를 일으킨 사망 이후에 셈; D: 생존자를 그 이전에 셈 (A 또는 B와 조합)
  resolution_paths:
  - >-
    주최 측의 N 발표(U-0009), 그다음 60%에서 멈추는 첫 Death 회복의 VOD.
U-0603:
  question: >-
    Death 60% 상한: HP가 이미 최대 HP의 60%를 넘는 경우, 회복이 HP를 상한까지 낮춥니까, 아무 일도 없습니까, 아니면 상한이 반올림됩니까?
  why_it_matters: >-
    문자 그대로의 상한은 건강한 Death 참가자의 HP를 깎을 수 있습니다. 또한 M이 5의 배수가 아니면 상한값 0.6*M이 소수입니다.
  readings:
    A: >-
      HP' = min(HP + h, 0.6*M), HP를 낮출 수 있음
    B: >-
      HP' = max(HP, min(HP + h, 0.6*M)), 절대 낮추지 않음
    C: >-
      B와 같고 상한 = floor(0.6*M)
    D: >-
      B와 같고 상한 = ceil(0.6*M)
  resolution_paths:
  - >-
    VOD: 20% 이하가 생존한 상태에서 사망 근처에 있는, HP가 60%를 넘는 Death 참가자.
U-0604:
  question: >-
    Death ward: 2h 쿨다운은 언제 시작됩니까(막힌 타격 시점, 2min 면역이 끝날 때, 또는 시길 선택 시점부터), ward는 선택 시점에 준비되어 있습니까, 그리고 어떤 피해 틱이 "첫 타격"으로 인정됩니까?
  why_it_matters: >-
    이벤트 중 ward가 몇 번 보호할 수 있는지(2h당 2 min 윈도)와 존 틱이 이를 소모하는지가 정해집니다.
  readings:
    A: >-
      쿨다운은 첫 번째로 막은 타격에서 시작, 시길 선택 시점부터 준비됨
    B: >-
      쿨다운은 2min 면역이 끝날 때 시작
    C: >-
      선택 2h 후에야 준비됨
    D: >-
      주기적인 존 틱도 타격으로 인정(U-0002 참조), E: 개별 공격만 인정
  resolution_paths:
  - >-
    VOD: 2h 안에 존을 두 번 벗어나는 Death 참가자.
U-0605:
  question: >-
    Death 시길 "다른 참가자가 죽을 때마다 블러드 토큰 1개": 거리 제한이 있습니까(회복은 50m 사용), 그리고 부활이나 두 번째 사망도 다시 보상을 줍니까?
  why_it_matters: >-
    상인 구매의 재원이 되는 Death의 블러드 토큰 수입을 정합니다.
  readings:
    A: >-
      경기장 어디에서든 발생한 사망
    B: >-
      Death 참가자로부터 50m 이내의 사망만
    C: >-
      A 또는 B, 그리고 부활 후 다시 죽은 참가자는 다시 보상을 줌
  resolution_paths:
  - >-
    VOD: 멀리서 발생한 사망 뒤의 Death 참가자 블러드 토큰 카운터.
U-0606:
  question: >-
    Death "약탈": 아이템이나 블러드 토큰을 처음 루팅하는 것이 "묘비 약탈" 행동과 같은 5% 회복과 10 토큰을 줍니까, 그리고 부활을 위해 잠겨 있는 동안 블러드 토큰을 루팅할 수 있습니까?
  why_it_matters: >-
    소개 페이지는 부활이 가능한 동안 묘 안의 토큰이 잠겨 있다고 하는데, Death 페이지는 토큰을 처음 루팅하면 묘를 약탈한다고 합니다.
  readings:
    A: >-
      아이템이나 토큰의 첫 루팅은 완전한 약탈(회복, 10 토큰, 묘가 부활 불가가 됨), 토큰은 즉시 루팅 가능
    B: >-
      첫 루팅은 약탈이지만 부활 가능 기간이 끝날 때까지 토큰은 루팅할 수 없으므로 아이템 루팅만 일찍 약탈이 됨
    C: >-
      첫 루팅은 묘를 봉인할 뿐이고, 회복과 10 토큰은 명시적인 약탈 행동이 필요함
  resolution_paths:
  - >-
    VOD: 사망 후 10 min이 지나기 전에 묘를 루팅하는 Death 참가자.
U-0607:
  question: >-
    Endurance 보급 상자 "2h 30min마다": 첫 투하는 이벤트 시작 2h30 후입니까, 시길 선택 후입니까, 이전 수령 후입니까, 그리고 어떤 상자가 "자신의 것"입니까?
  why_it_matters: >-
    이벤트 동안 Endurance 참가자가 6 토큰 수령을 몇 번 할 수 있는지와 보급이 언제 도착하는지가 정해집니다.
  readings:
    A: >-
      이벤트 시작부터의 고정 시계
    B: >-
      시길 선택부터의 고정 시계
    C: >-
      이전 상자를 수령하거나 착지할 때 타이머가 재시작
    D: >-
      "자신의 것" = 누가 서 있든 자기 근처에 떨어진 상자; E: 수령자도 본인이어야 함
  resolution_paths:
