U-0503:
  question: >-
    Piety의 "heal you 15% more, rounded down": 무엇이 내림되며, 최대 HP 상한 적용과 비교해 어느 단계에서 내림됩니까?
  why_it_matters: >-
    네 가지 포션 등급은 정확한 산술에서도 binary64에서도 같은 합계(5, 11, 23, 46)를 줍니다. 따라서 미해결인 부분은 HP 상한에서의 연산 순서와 사용되는 기본값입니다.
  readings:
    A: >-
      heal = floor(1.15 * h)이며 h는 등급 값이고, 그다음 부족한 HP로 상한 적용
    B: >-
      heal = h + floor(0.15 * h)이고, 그다음 상한 적용 (모든 정수 h에서 A와 동일)
    C: >-
      heal = floor(1.15 * min(h, missing HP)): 보너스가 실제 회복량에 적용됨
  resolution_paths:
  - >-
    VOD: 최대 HP보다 1에서 10 HP 낮은 Piety 참가자가 중간 포션을 마시는 장면.
  - >-
    VOD: 낮은 HP에서 각 등급을 마신 뒤의 HP 표시 (+5, +11, +23, +46 예상).
U-0504:
  question: >-
    Piety 참가자가 상자나 크레이트에서 얻는 "random health potion"의 크기 분포는 어떠합니까?
  why_it_matters: >-
    상자당 기대 회복량과 변환된 포션의 블러드 토큰 가치(토큰 1, 2, 3 또는 4개)는 등급별 가중치에 달려 있으나, 위키는 이를 제시하지 않습니다.
  readings:
    A: >-
      네 등급에 균등 (각 1/4)
    B: >-
      작은 등급 쪽으로 치우침 (일반적인 체력 포션 드롭 표처럼)
    C: >-
      등급은 대체되는 아이템 또는 상자 종류에 따라 달라짐
  sweep_range: >-
    4개의 가중치 각각이 [0,1] 범위이며 합은 1입니다. 균등 벡터(각 0.25)가 기준선이고, 두 극단(모두 작은 등급, 모두 거대(gigantic) 등급)이 상자의 가치 범위를 정합니다
  resolution_paths:
  - >-
    VOD: 많은 Piety 획득 사례에서 포션 등급을 집계.
  - >-
    주최 측의 발표.
U-0505:
  question: >-
    Piety 상자 변환 범위: "item chests"와 크레이트만 변환됩니까, 아니면 다른 보급 상자(에어드롭, 관리자, 시청자, Endurance)도 포션으로 바뀝니까?
  why_it_matters: >-
    상인 보급 상자만 변하지 않는다고 명시되어 있으며, 루팅의 큰 비중을 차지하는 다른 모든 보급 상자에 대해서는 본문이 아무 말도 하지 않습니다.
  readings:
    A: >-
      item chests와 크레이트만 변환되고, 모든 보급 상자는 변하지 않음 (상인 문장은 부연 설명)
    B: >-
      상인 것을 제외한 item chests, 크레이트, 모든 보급 상자가 변환됨
  resolution_paths:
  - >-
    VOD: 시청자 또는 에어드롭 보급 상자를 획득하는 Piety 참가자.
  - >-
    주최 측의 발표.
U-0506:
  question: >-
    포션 중첩이 이미 6개이거나(또는 인벤토리가 포션을 받을 수 없을 때) Piety가 상자나 크레이트를 획득하면 어떻게 됩니까?
  why_it_matters: >-
    상한에서 상자 획득이 비용 없는 행동인지, 그리고 포션이 사라지는지 떨어지는지를 결정합니다.
  readings:
    A: >-
      획득이 거부되고 상자는 그대로 남음
    B: >-
      상자가 소모되고 포션은 사라짐
    C: >-
      포션이 참가자의 발치에 떨어짐 (공격 페이지의 hunter potion처럼)
  resolution_paths:
  - >-
    VOD: 중첩이 6개로 가득 찬 Piety 참가자가 상자를 획득하는 장면.
U-0507:
  question: >-
    Greed의 "A successful steal earns five blood tokens, once per victim every 24 hours": 24 h 제한은 토큰 지급만 제한합니까, 아니면 훔치기 자체를 제한합니까?
  why_it_matters: >-
    지급만 제한된다면 Greed 참가자는 아이템을 노리고 한 피해자에게서 30 min마다 계속 훔칠 수 있습니다. 그렇지 않다면 각 피해자는 같은 도둑에게 하루에 최대 한 개의 아이템만 잃습니다.
  readings:
    A: >-
      같은 피해자에게서의 훔치기는 쿨다운마다 허용되며, 토큰 5개는 피해자당 24 h에 최대 한 번만 지급됨
    B: >-
      특정 피해자는 해당 도둑에게 24 h에 최대 한 번만 훔치기에 성공당할 수 있음
  resolution_paths:
  - >-
    VOD: Greed 참가자가 24 h 안에 같은 피해자에게서 두 번 훔치는 장면 (쿨다운 30 min).
  - >-
    주최 측의 발표.
U-0508:
  question: >-
    Greed 타이머: 30 min 쿨다운은 모든 훔치기 시도에서 시작됩니까, 아니면 성공한 훔치기에서만 시작됩니까? 그리고 피해자별 24 h 구간은 마지막 지급 시점을 기준(롤링)으로 합니까, 아니면 일일 시계를 기준으로 합니까?
  why_it_matters: >-
    실패한 훔치기(fortress, Piety 피해자, 빈 인벤토리)는 30 min을 소모하거나 아무것도 소모하지 않습니다. 일일 시계에서는 초기화 시점 전후의 짧은 시간 안에 두 번 지급될 수 있습니다.
  readings:
    A: >-
      쿨다운은 Steal을 사용하기만 하면 시작되고, 24 h 구간은 해당 피해자에 대한 마지막 지급부터 롤링됨
    B: >-
      쿨다운은 성공한 훔치기에서만 시작되고, 24 h 구간은 롤링됨
    C: >-
      A 또는 B와 같으나 24 h 구간이 고정된 일일 시각에 초기화됨
  resolution_paths:
  - >-
    VOD: Greed 참가자가 fortress로 보호받는 대상 또는 Piety 대상에게 Steal을 사용한 뒤 다시 시도하는 장면.
U-0509:
  question: >-
    도둑에게 공간이 없을 때의 Greed Steal: 인벤토리가 가득 찼거나, 도둑이 이미 방어구를 가진 상태에서 Body Armor를 훔치면 어떻게 됩니까?
  why_it_matters: >-
    Body Armor는 "at most one, including equipped armor"를 허용하므로, 방어구를 착용한 Greed 참가자에게서 이를 훔치는 것은 불가능하거나 방어구 하나를 버리게 됩니다.
  readings:
    A: >-
      도둑이 아이템을 가질 수 없으면 훔치기가 거부됨
    B: >-
      아이템이 도둑의 발치에 떨어짐
    C: >-
      훔친 아이템이 기존 아이템을 대체하거나 버리게 함
  resolution_paths:
  - >-
    VOD: 인벤토리가 가득 찬 Greed 참가자가 Steal을 사용하는 장면.
U-0510:
  question: >-
    Greed가 두 배로 늘리는("2x as far away") 상자와 크레이트의 기본 획득 범위는 얼마입니까?
  why_it_matters: >-
    자료 어디에도 일반 획득 또는 가져가기 범위가 없어서(상자 페이지가 삭제됨) Greed의 사거리는 아직 숫자가 아닙니다.
  sweep_range: >-
    2에서 20 m: 위키의 다른 접촉 행동은 10 m(훔치기, 상인, 묘비 루팅, 회복 범위)를 사용하므로 10 m이 중심값이고, 2 m / 20 m은 근접 접촉과 넓은 사거리의 경계입니다
  resolution_paths:
  - >-
    VOD: Greed가 아닌 참가자와 Greed 참가자가 상자를 획득할 수 있는 거리.
  - >-
    SCOPE.md P1 (삭제된 상자 페이지).
U-0511:
  question: >-
    Greed 상자 Shield: 참가자가 이미 활성 Shield(아이템 또는 이전 상자 Shield)를 가지고 있으면 어떻게 됩니까?
  why_it_matters: >-
    반복된 상자 획득이 보호를 연장하는지, 그리고 Greed 참가자가 얼마나 오래 면역을 유지할 수 있는지를 결정합니다. 위키는 상자 Shield가 3개 효과 제한에 포함되지 않는다고도 말합니다.
  readings:
    A: >-
      새 Shield가 타이머를 20 min으로 갱신함
    B: >-
      새 Shield가 남은 시간에 20 min을 더함
