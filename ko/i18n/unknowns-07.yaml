U-0512:
  question: >-
    Greed의 "adds a blood token to your money bag": money bag은 일반 블러드 토큰 잔액입니까, 아니면 나중에 지급되는 별도의 저장소입니까?
  why_it_matters: >-
    이 용어는 자료에 한 번만 나옵니다. 별도의 bag이라면 상인에게서 토큰을 쓸 수 있는 시점과 토큰이 묘비에 떨어지는지 여부가 달라집니다.
  readings:
