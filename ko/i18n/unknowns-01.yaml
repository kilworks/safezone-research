U-0009:
  question: >-
    Miami의 참가자 수와 이벤트 기간.
  why_it_matters: >-
    지평 T, Death 시길의 '20% 이하 생존' 임계값, 그리고 모든 최후 생존자 모델을 정합니다.
  resolution_paths:
  - >-
    주최자의 발언 또는 이벤트 중 라이브 개요 페이지(SCOPE.md P2).
U-0010:
  question: >-
    Wizard staff의 '5 s 동안 총 10 HP': 한 번의 타격입니까, 여러 번의 틱입니까?
  why_it_matters: >-
    Kick 보너스, Kick 감소, 최소 1 HP가 한 번만 적용되는지 틱마다 적용되는지를 정합니다.
  readings:
