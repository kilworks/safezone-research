id: U-0423
question: 'Reality Shield: duration is not given, ''Everyone within 30m'' is radius or diameter, and ''immune to all damage, zombies and new poison'' leaves existing poison running?'
why_it_matters: Admin tool, but decides nuke counters and poison cure.
readings:
  A: permanent until removed
  B: timed (undisclosed)
  C: radius 30m
  D: diameter 30m
parameter: reality_shield_duration_s
sweep_range: 60 to 86400 s; no time stated, event scale bound
resolution_paths:
- Admin statement.
priority: low
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. The shield is "Placed by admins." (wiki-attacks-086) and "Everyone within 30m (98ft) is immune to all damage, zombies and new poison." (wiki-attacks-087). Poison steps are damage ("Poison damages you for 1 HP every 1min 30s." (wiki-poison-001)) and the damage page has "Reality Shield block every kind of damage" (wiki-damage-002), so steps do not hurt while you stand inside; the cure list "Poison can be cured by: Anti poison, Healing healing" (wiki-poison-005) does not name it, which is consistent with existing poison being held off but not cured ("no new poison while you stand inside it" (wiki-poison-008)). Still open: the duration and whether 30m is a radius or a diameter (readings A to D), and whether a blocked step is skipped or postponed.'
