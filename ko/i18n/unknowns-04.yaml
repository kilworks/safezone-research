U-0325:
  question: >-
    Sleeping Bag: 'sleep from 18:00 to 06:00 ... for eight hours of sleep in total' 규칙은 무엇입니까?
  why_it_matters: >-
    허용 시간대는 12시간인데 수면은 8시간입니다. 위키는 8h가 연속된 블록인지, 총 예산인지, 하룻밤의 상한인지 밝히지 않습니다.
  readings:
    A: >-
      수면은 18:00과 06:00 사이에만 허용됨. 총 수면 시간은 8h로 제한되며 나누어 잘 수 있음
    B: >-
      허용 시간대 안에 들어가야 하는 연속 8h 블록 하나
    C: >-
      bag은 이벤트 전체에 걸쳐 총 8h의 수면을 담음
  sweep_range: >-
    명시된 대로 8. 예산을 나누어 쓰는 경우를 테스트함
  resolution_paths:
  - >-
    VOD: 허용 시간대 내내 잠을 자는 참가자.
  - >-
    주최 측의 발표.
U-0326:
  question: >-
    'Local solar time'(지역 태양시): 무엇에 대한 지역입니까(참가자의 위치, 이벤트 장소, 기준 도시 하나)?
  why_it_matters: >-
