    VOD: 중독된 참가자의 HP 타임라인.
U-0317:
  question: >-
    지속 피해 아이템에서 'Poison Dart ... +10 damage for two uses'는 무엇을 뜻합니까?
  why_it_matters: >-
    인챈트된 다트의 독은 총 10 HP를 더할 수도, 사용마다 10 HP를 더할 수도, 즉발 타격일 수도 있습니다.
  readings:
    A: >-
      인챈트된 다트 각각은 같은 30min 동안 총 30 HP로 중독시킴
    B: >-
      인챈트된 다트 각각은 30min 동안 20 HP로 중독시키고 즉시 10 HP를 더함
    C: >-
      인챈트된 다트 각각은 간격을 1min 30s로 유지한 채 30 HP로 중독시킴(따라서 45min)
  resolution_paths:
  - >-
    VOD: 참가자에게 사용한 인챈트된 다트.
U-0318:
  question: >-
    둘 다 붙어 있는 Poison Dart와 Zarok's axe에서 Equippable과 Usable 라벨은 무엇을 뜻합니까?
  why_it_matters: >-
    다트와 axe가 무기 슬롯에 들어가는지, 던지거나 인벤토리에서 소모되는지, 두 방식이 모두 존재하는지를 결정합니다.
  readings:
    A: >-
      Equippable = 무기 슬롯에 들고 있음, Usable = 사용 시 소모됨. 두 라벨은 아이템을 어느 쪽으로든 쓸 수 있다는 뜻
    B: >-
      두 라벨은 순차적: 장착해서 들고, 그다음 한 번 사용
  resolution_paths:
  - >-
    VOD: axe 또는 다트를 든 참가자의 인벤토리와 무기 슬롯.
U-0319:
  question: >-
    이벤트 시작 후 첫 무작위 상인은 언제 나타납니까?
  why_it_matters: >-
    상인 주기(15min 체류, 30min에서 1h 부재)에는 명시된 위상이 없습니다. 초반 구매력과 토큰 비축이 이에 달려 있습니다.
  sweep_range: >-
    이벤트 시작 후 0에서 75 min: 75 min은 가장 긴 전체 주기(15 min 체류 + 1h 부재)이므로 한 주기 안의 모든 위상이 포함됩니다
  resolution_paths:
  - >-
    VOD: 이벤트 시작부터 상인이 처음 나타날 때까지.
  - >-
    주최 측의 발표.
U-0320:
  question: >-
    상인 복귀 지연: 'after 30min to 1h'는 떠난 시점부터 측정합니까, 도착한 시점부터 측정합니까? 그 범위 안에서의 분포는 어떻습니까?
  why_it_matters: >-
    방문 사이에 참가자가 블러드 토큰을 얼마나 모아야 하는지(부재 30에서 60 min 대 15에서 45 min)와 상인이 있는 시간의 장기 비율을 정합니다.
  readings:
    A: >-
      떠난 시점부터 [30, 60] min에 걸쳐 균등
    B: >-
      도착한 시점부터 [30, 60] min에 걸쳐 균등(부재 15에서 45 min)
    C: >-
      떠난 시점부터 [30, 60] min 안에서 고정값이거나 비균등 분포
  sweep_range: >-
    명시된 대로 30에서 60 min, 해석 A 또는 B. 분포 형태(균등, 양 끝값만)를 바꿔 가며 탐색함
  resolution_paths:
  - >-
    VOD: 여러 주기에 걸친 상인의 출발과 다음 도착 타임스탬프.
U-0321:
  question: >-
    어떤 상인 구매에 빈 인벤토리 슬롯이 필요합니까('Items need a free inventory slot')?
  why_it_matters: >-
    아이템만 명시되어 있습니다. 미사일, Deep Cut, Dual Wield, 인챈트, 업그레이드는 슬롯이 필요하지 않을 수 있습니다. 인벤토리가 가득 찬 상태의 보급 상자는 다루어지지 않습니다.
  readings:
    A: >-
      보급 상자, anti poison, Vulnerability Dart, Sleeping Bag은 슬롯이 필요하고 미사일과 업그레이드는 필요 없음
    B: >-
      미사일도 슬롯이 필요함
    C: >-
      보급 상자 아이템이 무기라면 무기 슬롯으로 갈 수 있으며 그 경우 슬롯이 필요 없음
  resolution_paths:
  - >-
    VOD: 인벤토리가 가득 찬 상태에서의 구매.
U-0322:
