U-0308:
  question: >-
    사용(무기 사용, 화살, Deep Cut 충전, 인챈트 사용)은 막히거나 반사되거나 사거리 밖이거나 빗나간 공격에서도 소모됩니까?
  why_it_matters: >-
    Shield, Safety Bubble, Mirror, Sleeping Bag이 공격자의 제한된 사용 횟수(knife 2, long sword 3)와 충전을 헛되이 소모시키는지 결정합니다.
  readings:
    A: >-
      시도할 때마다 소모됨
    B: >-
      타격이 적중할 때만 소모됨
    C: >-
      방어 아이템에 막힌 타격을 제외하고 소모됨
  resolution_paths:
  - >-
    VOD: Shield를 가진 참가자를 knife로 찌른 뒤 남은 knife 사용 횟수를 셉니다.
U-0309:
  question: >-
    Poison Dart, Zarok's axe, Huge machete의 '근처(nearby)'의 범위는 얼마입니까?
  why_it_matters: >-
    다른 근접 무기는 10m(knife, long sword)로 명시되어 있지만, 이 세 가지는 수치가 없어 사거리와 위치 선정을 모델링할 수 없습니다.
  sweep_range: >-
    5에서 50 m: knife와 long sword의 사거리는 10m, bow는 20m, staff 설치는 50m이므로 근접 무기의 '근처'는 5와 50 사이로 한정됩니다
  resolution_paths:
  - >-
    주최 측의 발표.
  - >-
    VOD: axe 또는 machete 타격이 성공했을 때의 측정 거리.
U-0310:
  question: >-
    Zarok's axe: 사용자의 체력이 떨어질수록 피해가 최대 체력일 때 5 HP에서 25 HP로 어떻게 올라갑니까(선형인지, 단계적인지, 최대 HP에 대한 비율인지, 25는 어디에서 도달하는지)?
  why_it_matters: >-
    axe의 가치 전체가 이 곡선에 달려 있습니다. 모든 HP 수준에서의 피해와 25 HP에 도달할 수 있는지 여부를 정합니다.
  readings:
    A: >-
      사용자의 최대 HP 대비 손실 비율에 선형: 5 + 20*(1 - h/H), H = 현재 최대 HP, 25는 h = 0에서 도달
    B: >-
      손실 비율에 선형이며 25는 h = 1(생존 상태의 최저 HP)에서 도달
    C: >-
      고정된 100 HP 기준에 대한 절대 HP에 선형: 5 + 20*(100 - h)/100, [5, 25]로 제한
    D: >-
      사용자의 HP 구간별 단계적 변화(구간 경계는 명시되지 않음)
  resolution_paths:
  - >-
    VOD: 사용자의 여러 HP 값(최대, 절반, 낮음)에서의 axe 타격.
  - >-
    REA: 무기 피해 공식이 배포물에 포함되어 있다면 그것.
U-0311:
  question: >-
    Zarok's axe: 정수가 아닌 피해 값은 어떤 방식으로 정수로 처리됩니까?
  why_it_matters: >-
    대부분의 HP 수준에서 피해가 최대 1 HP까지 달라집니다(그 위에 Kick 보너스와 최소 1 HP가 적용됩니다).
  readings:
    A: >-
      floor
    B: >-
      ceil
    C: >-
      반올림(round half up)
  resolution_paths:
  - >-
    VOD: 곡선이 소수를 내는 HP에서의 axe 타격.
