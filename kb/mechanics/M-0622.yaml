id: M-0622
name: Endurance tokens for claiming own care package
family: economy
sigils:
- endurance
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/endurance#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-endurance-006
  quote: Claiming one of your own care packages, which fall every 2h 30min, earns six blood tokens.
formal:
  readings:
    A: tokens += 6 when the claimer is the contestant it fell for
    B: tokens += 6 for any claim of a package the claimer owns, even if first looted by another
  parameters:
    tokens_per_claim: '6'
depends_on:
- M-0621
interacts_with: []
label: CONDITIONAL
open_unknowns:
- U-0607
notes: Anyone can claim, so a rival can take the package first; whether the owner then earns tokens is not stated.
