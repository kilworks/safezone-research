  readings:
    A: >-
      모든 시길에 2 토큰(상인 가격이 아님)
    B: >-
      Ingenuity는 ceil(2*1.1) = 3을 지불
    C: >-
      비용보다 적은 토큰으로는 사용할 수 없음
  resolution_paths:
  - >-
    VOD: staff 사용 전후의 Ingenuity 참가자의 토큰 수.
U-0315:
  question: >-
    Poison Dart: 이미 중독된 참가자가 다시 다트를 맞으면(또는 Fake gravestone에 맞으면) 새 독이 20 HP 전체 일정을 다시 시작합니까, 남은 분량을 대체합니까, 더해집니까?
  why_it_matters: >-
    독 페이지는 재중독이 타이머를 초기화하고 중첩되지 않는다고 하지만, 초기화되는 양(20 HP 전체인지 남은 분량인지)은 명시되어 있지 않습니다.
  readings:
    A: >-
      새 다트로부터 20 HP 일정을 새로 시작함
    B: >-
      이전 독의 남은 HP를 유지하고 간격 타이머만 다시 시작함
    C: >-
      중독된 동안 두 번째 다트는 무시됨
  resolution_paths:
  - >-
    VOD: 다트를 두 번 맞은 참가자의 HP와 타이머.
U-0316:
  question: >-
    Poison Dart: '20 HP over 30min'과 독 페이지의 1min 30s마다 1 HP를 함께 보면, 첫 틱은 1min 30s에 옵니까, 즉시 옵니까?
  why_it_matters: >-
