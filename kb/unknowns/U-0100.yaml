id: U-0100
question: 'Where does ''The damage left is rounded down'' apply in step 4: to the Protection 50% result only, or as one final floor after all reductions, with the Kick 10% computed on the unrounded value?'
why_it_matters: 'Changes odd damages when a Protection contestant who is live on Kick takes a nuke: intermediate floor then Kick, versus Kick on the exact half.'
readings:
  A: x -> floor(x/2), then the Kick reduction (U-0001 reading) applied to that integer
  B: x -> floor(0.9*(x/2)) with one final floor (Kick percentage applied to the exact half)
resolution_paths:
- 'VOD: a live Protection contestant taking a nuke of odd base damage, read the HP drop.'
- 'REA: damage formula in shipped code.'
priority: low
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. The step 4 text is consistent with reading A: "A Protection contestant takes 50% less from a nuke." (wiki-damage-044) is followed by "The damage left is rounded down." (wiki-damage-045), and only then by "Being live on Kick then takes off 10%, rounded down." (wiki-damage-046), so each reduction carries its own floor, in that order. Reading B would need one floor after both reductions, which these three sentences do not describe. Still open: whether wiki-damage-045 belongs to the Protection sentence or is a floor of the whole step, which only a live Protection contestant taking a nuke of odd damage can show.'
