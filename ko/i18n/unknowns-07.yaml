    VOD: Ingenuity 참가자가 16 h 안에 landmine을 부착한 뒤 C4를 부착하는 장면.
  - >-
    VOD: 두 번째 Ingenuity 참가자가 trapped gift를 살펴보는 장면.
U-0517:
  question: >-
    Ingenuity 조합: 명시된 재료 두 개가 모두 소모됩니까, 조합 하나가 5개 조합 칸 중 하나를 차지합니까, 그리고 레시피 6개가 5칸에 어떻게 맞습니까?
  why_it_matters: >-
    레시피는 6개이고 조합 칸은 5개입니다. 같은 종류의 조합이 중첩되는지, 재료가 돌아오는지가 몇 개의 조합을 보유할 수 있는지를 결정합니다.
  readings:
    A: >-
      재료 두 개가 모두 소모되고, 각 조합은 5개 조합 칸 중 하나를 차지하며, 칸이 가득 찰 때까지 같은 레시피를 반복해서 조합할 수 있음
    B: >-
      조합은 한 칸 안에서 종류별로 중첩됨
    C: >-
      재료 하나만 소모됨
  resolution_paths:
  - >-
    VOD: 조합 인벤토리가 가득 찬 Ingenuity 참가자가 조합하는 장면.
  - >-
    주최 측의 발표.
U-0518:
  question: >-
    고유 조합의 "40% chance to be destroyed by Zombie hits": 굴림은 흡수 타격마다, 좀비마다, 아니면 조합마다 이루어지며, 막힌 타격도 굴립니까?
  why_it_matters: >-
    좀비 근처에서 조합의 기대 수명을 정합니다. 좀비는 10 s마다(가드 좀비는 5 s마다) 흡수하므로, 타격마다 굴리면 거의 모든 조합이 빠르게 파괴됩니다.
  readings:
    A: >-
      각 흡수 타격이 보유한 조합마다 한 번씩 굴리며 각각 40%
    B: >-
      각 흡수 타격이 한 번 굴리고 무작위 조합 하나를 파괴함
    C: >-
      좀비와의 조우당 한 번 굴림
    D: >-
      A 또는 B와 같으나 Shield, repellent 또는 bubble에 막힌 타격은 굴리지 않음
  resolution_paths:
  - >-
    VOD: 좀비 근처에서 여러 조합을 가진 Ingenuity 참가자.
U-0519:
  question: >-
    Ingenuity 수입: "craft, hack, chest destroyed by Black Hole, HP your Campfire heals on anyone, or zombie killed"에 무엇이 포함됩니까?
  why_it_matters: >-
    크레이트, 보급 상자, 에어드롭, 가짜 상자도 Black Hole에 파괴되지만 "chest"만 적혀 있습니다. "zombie killed"는 누구의 처치인지 말하지 않으며, Campfire HP는 명목값일 수도 실효값일 수도 있습니다.
  readings:
    A: >-
      zombie killed = 참가자의 Zombie killer가 처치한 좀비. chests = 실제 아이템 상자만. Campfire HP = 실제로 회복된 HP (HP가 가득 찬 주변인은 아무것도 지급하지 않음)
    B: >-
      zombie killed = 참가자가 어떤 수단으로든 처치한 좀비. chests = Black Hole이 파괴하는 모든 상자, 크레이트, 보급 상자, 가짜 상자. Campfire HP = 소모된 풀
    C: >-
      항목마다 혼합
  resolution_paths:
  - >-
    VOD: 여러 보관함 근처에서 Black Hole이 터진 뒤 Ingenuity 참가자의 토큰 카운터.
U-0520:
  question: >-
    Campfire 공유 풀: 여러 사람이 있을 때 풀은 어떻게 소모되며, HP가 가득 찬 주변인도 회복됩니까?
  why_it_matters: >-
    "Heals everyone within 10m 1 HP per second from one shared pool"은 대상 N명에 대해 풀 소모가 N HP/s라는 뜻일 수도, 전체 1 HP/s라는 뜻일 수도 있습니다. 풀은 포션의 회복량(5, 10, 20, 40 HP)과 같지만 10 min 상한도 있으므로 거대(gigantic) 포션은 40 HP만 줍니다.
  readings:
    A: >-
      범위 안에서 HP가 부족한 사람마다 풀에서 초당 1 HP를 가져감 (풀은 N HP/s로 소모됨)
    B: >-
      풀은 범위 안의 사람들에게 나누어 합계 초당 1 HP를 지급함
    C: >-
      범위 안의 모든 사람이 해당되며, HP가 가득 찬 사람도 각각 1 HP/s를 소모함
  resolution_paths:
  - >-
    VOD: 범위 안에 참가자가 1명, 이어서 2명 있는 Campfire.
U-0521:
  question: >-
    Everything potion의 "Cures poison and heals by potion tier": Anti poison의 10 min 독 면역도 부여합니까?
  why_it_matters: >-
    레시피는 Anti poison과 Health potion을 사용하며, Anti poison 아이템은 10 min 면역을 줍니다.
  readings:
    A: >-
      독을 치료하고 등급만큼만 HP를 회복함
    B: >-
      10 min의 독 면역도 부여함
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자가 포션을 사용한 뒤 중독되는 장면.
U-0522:
  question: >-
    Zombie killer의 "Kills the next ten zombies that come within 10m": 사용 시점에 이미 10 m 안에 있는 좀비도 죽입니까, 어떤 좀비 유형이 포함되며, 범위 안에 열 마리를 넘으면 어떻게 처리됩니까?
  why_it_matters: >-
    이 조합이 무리(좀비 50마리)로부터 지켜 주는지, 아니면 도착하는 열 마리에게만 작동하는지를 결정합니다. 가드 좀비와 무리가 포함되는지도 결정합니다.
  readings:
    A: >-
      10 m 안으로 들어오거나 이미 안에 있는 첫 열 마리(유형 무관)를 도착 순간마다 한 마리씩 죽임
    B: >-
      사용 후에 10 m 안으로 들어온 좀비만 해당하며, 이미 안에 있는 좀비는 세지 않음
    C: >-
      가드 좀비와 무리 좀비는 제외됨
  resolution_paths:
  - >-
    VOD: 무리 한가운데에서 이 조합을 사용하는 장면.
U-0523:
  question: >-
    Black hole: 즉시 발동입니까, 지속됩니까, 어디를 중심으로 하며, 누가 이득을 얻습니까?
  why_it_matters: >-
    "Destroys every chest and crate within 200m"는 발동 시점의 일회성으로 읽힙니다. 남아 있는 장이라면 나중에 생성되는 상자도 파괴할 것입니다.
  readings:
    A: >-
      사용한 장소에서 반경 200 m의 일회성
    B: >-
      명시되지 않은 시간 동안 지속되는 장
    C: >-
      사용 시 참가자를 중심으로 함
  sweep_range: >-
    0(기재된 대로 즉시)에서 600 s: 10 min은 다른 조합(Robot, Campfire)의 가장 긴 명시 타이머와 일치합니다
  resolution_paths:
  - >-
    VOD: Black hole 사용 뒤 새 상자가 생성되는 장면.
U-0524:
  question: >-
    Fortress의 "up to 30 HP": 20 m 안의 모두가 공유하는 하나의 풀입니까, 아니면 한 사람당 30 HP입니까?
  why_it_matters: >-
    공유 풀 30 HP는 미사일 2발이면 사라집니다. 인원별이면 집단을 훨씬 오래 보호합니다. 피해 페이지는 "absorbs up to its remaining durability"라고 하는데, 이는 하나의 공유 내구도를 시사합니다.
  readings:
    A: >-
      30 HP의 공유 내구도 하나이며, 안에 있는 누구에게든 타격이 있으면 소모됨
    B: >-
      보호받는 참가자마다 30 HP의 흡수량
  resolution_paths:
  - >-
    VOD: fortress 안의 참가자 두 명이 모두 타격을 받는 장면.
U-0525:
  question: >-
    Fortress와 존 피해: 존 피해는 30 HP 내구도에서 흡수됩니까, 아니면 완전히 무시됩니까?
  why_it_matters: >-
    페이지는 존 피해를 30 HP 흡수 옆에 나열하지만, "from Sigil of Greed stealing, and zone damage"로부터 보호한다고도 하며, 이는 별개 종류의 보호입니다.
  readings:
    A: >-
      fortress 안에서 존 피해는 완전히 면역되며 내구도를 사용하지 않음
    B: >-
      존 피해는 틱당 1 HP씩 30 HP 내구도에서 흡수됨
  resolution_paths:
  - >-
    VOD: 세이프 존 밖의 fortress 안에 서 있는 참가자.
