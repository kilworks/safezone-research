    B: >-
      EMP는 시간제 아이템 효과로 세고, goggles는 Hazmat suit처럼 소지하는 동안 셉니다
    C: >-
      상한에서는 Hazmat suit 줍기가 거부됩니다
  resolution_paths:
  - >-
    VOD: 효과 3개를 가진 참가자가 EMP를 사용하거나 goggles 또는 Hazmat을 줍는 장면.
U-0203:
  question: >-
    체력 포션, bandage 틱, Eddie의 회복은 최대 HP로 제한됩니까?
