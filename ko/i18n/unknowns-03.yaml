U-0204:
  question: >-
    최대 HP가 10의 배수가 아닐 때 Eddie의 포션의 50% 회복과 30% 손실은 어떤 방식으로 어림됩니까?
  why_it_matters: >-
    죽을 수도 있는 도박에서 1 차이(off-by-one)가 발생하며, 어떤 기본 최대 HP가 존재하는지와도 연결됩니다.
  readings:
    A: >-
      둘 다 내림
    B: >-
      둘 다 올림
    C: >-
      둘 다 반올림(half up)
    D: >-
      회복과 손실에 서로 다른 어림 방식 적용
  sweep_range: >-
    내림, 올림, 반올림(half up)을 회복과 손실에 각각 따로 적용 (4에서 9가지 조합). 시길이 알 수 없는 기본값에서 최대 HP를 10씩 바꾸므로 최대 HP는 90..110을 1 단위로 변화
  resolution_paths:
  - >-
    VOD: 최대 HP 95 또는 105인 참가자(있다면)가 이를 마시는 장면.
  - >-
    시드 U-0004는 이것이 죽일 수 있는지를 묻는 것이며, 어림 방식과는 무관합니다.
U-0205:
  question: >-
    Hazmat suit의 '간격당 +2s'는 어떤 피해 원인과 어떤 타이밍(첫 틱, 유예)을 늘립니까?
  why_it_matters: >-
    존 밖에서의 사망까지 걸리는 시간과, 언세이프 서클 및 robot에 대한 이 슈트의 가치가 달라집니다.
  readings:
    A: >-
      존 밖 간격만 해당, 2s -> 4s, 첫 틱은 변하지 않음
    B: >-
      간격 4s이고 첫 틱이 2s 지연됨
    C: >-
      피해 페이지에서 'slows'로 표시된 언세이프 서클 및 robot 간격도 포함
  sweep_range: >-
    0..4 s (페이지에는 2라고 되어 있으며, 상한 4는 두 배가 된다는 해석을 포함)
  resolution_paths:
  - >-
    VOD: Hazmat 보유자가 화면 타이머가 있는 상태로 존을 벗어나는 장면.
  - >-
    robot 간격은 아이템 페이지에 없습니다.
  resolution: >-
    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. 원천은 확정되었습니다. 피해 표는 정확히 세 행, 즉 Outside the circle, Unsafe circle, Robot에 "Hazmat suit (slows)"를 표시하므로(wiki-damage-005, wiki-damage-006, wiki-damage-007), 원천 목록에 관해서는 해석 A(존 밖 피해만)가 반박됩니다. 수치는 존 피해에 대해서만 적혀 있습니다. "While you carry it, each zone damage interval is 2s longer"(wiki-items-013). 언세이프 서클은 존 피해를 주며(wiki-sigils-trolling-017), robot 간격은 어느 페이지에도 없습니다. 아직 미해결: 첫 틱과 5 s 지연(U-0003과 함께), 그리고 robot이 얼마나 느려지는지.
