U-0011:
  question: >-
    부활 제한 시간: 소개 페이지의 'within 10min of their death'와 Healing 페이지의 'within 10min of the death' 중, 누구의 사망이 제한 시간을 시작시킵니까?
  why_it_matters: >-
    문자 그대로 읽으면 'their'는 부활시키는 참가자들을 가리킬 수 있습니다.
  readings:
