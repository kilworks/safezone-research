  section: What it does
  kind: sentence
  quote: Start with 2 inventory slots and five separate slots for unique crafts.
- id: wiki-sigils-ingenuity-007
  anchor: rules
  section: What it does
  kind: sentence
  quote: Merchant prices are 10% higher, rounded up.
- id: wiki-sigils-ingenuity-008
  anchor: rules
  section: What it does
  kind: sentence
  quote: Recognize fake chests and gravestones, see traps, and hack landmines or C4 within 50m (164ft).
- id: wiki-sigils-ingenuity-009
  anchor: rules
  section: What it does
  kind: sentence
  quote: Combine two matching potions into the next size, up to gigantic.
- id: wiki-sigils-ingenuity-010
  anchor: rules
  section: What it does
  kind: sentence
  quote: Attach a landmine or C4 to an item to make a trapped gift, once every 16h.
- id: wiki-sigils-ingenuity-011
  anchor: rules
  section: What it does
  kind: sentence
  quote: Only you can see it is trapped.
- id: wiki-sigils-ingenuity-012
  anchor: rules
  section: What it does
  kind: sentence
  quote: Unique crafts cannot be traded, stolen or looted, and have a 40% chance to be destroyed by Zombie hits.
- id: wiki-sigils-ingenuity-013
  anchor: rules
  section: What it does
  kind: sentence
  quote: Earn one blood token per craft, hack, chest destroyed by Black Hole, HP your Campfire heals on anyone, or zombie killed.
