id: M-0520
name: Ingenuity unique craft restrictions and zombie destruction
family: items
sigils:
- ingenuity
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/ingenuity#rules
  snapshot: '2026-11-11'
  quote: Unique crafts cannot be traded, stolen or looted, and have a 40% chance to be destroyed by Zombie hits.
  clause: wiki-sigils-ingenuity-012
- url: https://iceposeidon.com/safezone/wiki/zombies
  snapshot: '2026-11-11'
  quote: a 40% chance to destroy crafted items
  clause: wiki-zombies-004
formal:
  readings:
    A: 'craft c: not tradable, not stealable, not lootable; each zombie drain hit: for every craft, destroy with
      probability 0.40'
    B: each zombie hit rolls once and destroys one random craft with probability 0.40
    C: one 0.40 roll per zombie encounter
  domain: probability 0.4 per roll; hit rate per zombie is 1 drain per 10 s (guard zombie 2 HP per 5 s)
  parameters:
    p_destroy: '0.4'
    roll_unit: UNKNOWN, see U-0518
depends_on: []
interacts_with:
- M-0522
- M-0527
label: CONDITIONAL
open_unknowns:
- U-0518
notes: Ingenuity page and zombies page agree on 40% ('unique crafts' versus 'crafted items' is the same set). Greed
  cannot steal them; Black hole and Fortress are crafts too. 'looted' implies crafts do not enter the gravestone
  loot; their fate at death is not stated.
