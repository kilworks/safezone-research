id: M-0130
name: Flak jacket blocks the next missile, nuke, airstrike impact or gunship bomb, then is consumed
family: items
sigils:
- all
sources:
- url: https://iceposeidon.com/safezone/wiki/damage#notes
  snapshot: '2026-11-11'
  clause: wiki-damage-063
  quote: A Flak jacket blocks the next missile, nuke, airstrike impact or gunship bomb, then is used up.
- url: https://iceposeidon.com/safezone/wiki/damage#notes
  snapshot: '2026-11-11'
  clause: wiki-damage-064
  quote: It does not block airstrike fire.
- url: https://iceposeidon.com/safezone/wiki/damage#notes
  snapshot: '2026-11-11'
  clause: wiki-damage-065
  quote: A hit already blocked by something else does not use it up.
formal:
  readings:
    A: 'if source in {missile, nuke, airstrike impact, gunship bomb} and jacket held and no other blocker applied: d := 0 and jacket consumed; airstrike fire not blocked'
  parameters: {}
depends_on:
- M-0118
interacts_with: []
label: CONDITIONAL
open_unknowns:
