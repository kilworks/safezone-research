U-0526:
  question: >-
    Fortress의 지속 시간과 위치: 얼마나 유지되며, 설치한 자리에 고정됩니까?
  why_it_matters: >-
    지속 시간이 없으면 30 HP는 영구적인 거점이 될 수 있는데, 페이지에는 지속 시간이 없습니다.
  sweep_range: >-
    600 s(Campfire와 Robot의 상한)부터 이벤트 길이까지: 10 min은 비슷한 조합 아이템이 정하는 하한이고, 이벤트 전체가 상한입니다
  resolution_paths:
  - >-
    VOD: 몇 분이 지난 뒤의 fortress.
  - >-
    주최 측 발표.
U-0527:
  question: >-
    Robot이 "10m 이내의 다른 플레이어에게 2s마다 1 HP 피해"를 줍니다. 2 s 시계는 전역입니까 대상별입니까, 그리고 첫 타격은 즉시 들어갑니까 한 간격 뒤에 들어갑니까?
  why_it_matters: >-
    빠르게 지나가는 사람에게 가는 총 피해량과, 1 s만 머무는 대상이 타격을 받는지 여부가 달라집니다.
  readings:
    A: >-
      전역 2 s 시계: 각 틱이 그 순간 범위 안의 모두를 타격함
    B: >-
      대상별 타이머, 첫 타격은 대상이 범위에 들어온 뒤 한 간격(2 s) 후(언세이프 서클(unsafe circle)과 같음)
    C: >-
      대상별, 첫 타격은 진입 즉시이고 이후 2 s마다
  resolution_paths:
  - >-
    VOD: robot 옆을 지나가는 참가자.
U-0528:
  question: >-
    Trolling의 "다른 플레이어에게 가한 5 HP당 블러드 토큰 1개": 나머지는 이월됩니까, 그리고 "가한"은 명목상의 타격입니까 실제로 통과한 HP(방어구, fortress, Kick 감소 적용 후)입니까?
  why_it_matters: >-
    5 HP짜리 가짜 상자는 5 HP 전체가 인정될 때만 토큰 1개를 줍니다. Kick 라이브 중인 피해자는 U-0001의 해석 A에서 4 HP를 받으며, 방어구나 Shield가 전부 흡수할 수도 있습니다.
  readings:
    A: >-
      피해자가 실제로 잃은 HP에 대한 누적 카운터, floor(total / 5)개의 토큰, 나머지 이월
    B: >-
      감소 적용 후의 타격에 대해 타격마다 floor(d / 5), 나머지 폐기
    C: >-
      누적이든 타격별이든, 방어구, fortress, Kick 감소 이전의 명목상 타격에 대해 계산
    D: >-
      Body Armor나 fortress가 흡수한 피해도 가한 것으로 인정
  resolution_paths:
  - >-
    VOD: 방어구를 입은, Shield를 가진, Kick 라이브 중인 피해자에게 가짜 상자를 열게 한 뒤의 Trolling 참가자 토큰 카운터.
U-0529:
  question: >-
    Trolling 수입 범위: 어떤 피해가 "다른 플레이어에게 가한 HP"로 인정됩니까(무기, 가짜 상자, 언세이프 서클 틱, 가짜 묘비의 독, 반사된 타격), 그리고 어떤 상자가 "누가 소환했든 파괴된 상자"로 인정됩니까?
  why_it_matters: >-
    언세이프 서클 틱은 각각 1 HP이며 주기적인 원천입니다. 이것이 보상을 주는지는 주기적 피해가 타격인지에 달려 있습니다(U-0002). Ingenuity의 Black hole이나 다른 참가자가 파괴한 상자가 Trolling 참가자에게 보상을 줄 수도, 주지 않을 수도 있습니다.
  readings:
    A: >-
      참가자 본인의 무기와 함정이 입힌 피해만, 참가자 본인의 행동으로 파괴된 상자만
    B: >-
      참가자의 함정이 일으킨 언세이프 서클 틱과 독 단계도 포함, 근처에 있는 누구든 파괴한 상자
    C: >-
      피해는 대상의 HP를 실제로 줄일 때만 인정, 시청자가 구매한 상자를 포함해 참가자 본인이 파괴한 상자만
  resolution_paths:
  - >-
    VOD: 피해자가 안에 있는 언세이프 서클 뒤의 Trolling 토큰 카운터.
  - >-
    주최 측 발표.
U-0530:
  question: >-
    가짜 상자 "롤링 1시간당 최대 2개": 설치 시각에 대한 슬라이딩 윈도입니까, 아니면 충전되는 2회분입니까?
  why_it_matters: >-
    가짜 상자의 최대 설치 속도가 달라집니다. 슬라이딩 윈도에서는 60 min 안에 세 번째가 허용되지 않고, 토큰 버킷에서는 2개가 즉시 허용된 뒤 30 min마다 1개입니다.
  readings:
    A: >-
      임의의 60 min 윈도 안에 최대 2번 설치(슬라이딩)
    B: >-
      2회분, 30 min마다 1회분 회복
    C: >-
      시계 기준 1시간당 2개(고정 윈도), 롤링이라는 말과 상반됨
  resolution_paths:
  - >-
    VOD: 0, 10, 40 min에 가짜 상자를 설치하는 Trolling 참가자.
U-0531:
  question: >-
    가짜 상자 잠금 "1h 동안 상자를 열 수 없음": 보급 상자와 크레이트도 막습니까, 두 번째로 열면 연장됩니까, 그리고 Shield 외의 방어 수단(Safety bubble, Sleeping Bag, Body armor)도 잠금을 남기지 않게 합니까?
  why_it_matters: >-
    가짜 상자는 보급 상자처럼 보입니다. 잠금은 피해자가 다음에 열 것까지 포함할 때만 트롤의 아이템을 보호합니다.
  readings:
    A: >-
      잠금은 아이템 상자만 포함, 잠금 중에 가짜 상자를 두 번째로 여는 것은 불가능
    B: >-
      잠금은 상자, 보급 상자, 크레이트를 포함
    C: >-
      5 HP를 막는 모든 방어 수단은 잠금도 남기지 않음(피해와 잠금은 별개의 효과)
    D: >-
      Shield만 잠금을 남기지 않는다고 명시되어 있고, 다른 방어 수단은 명시되지 않음
  resolution_paths:
  - >-
    VOD: 가짜 상자를 연 피해자가 1 h 안에 보급 상자를 여는 경우.
U-0532:
  question: >-
    Trolling 가짜 상자 "5 HP를 회복합니다": 열 때 고정된 5 HP입니까, 실제로 들어간 피해입니까, 그리고 피해자가 보호받거나 상자가 반사된 경우에도 발생합니까?
  why_it_matters: >-
    Shield, Safety bubble, Mirror가 트롤의 회복을 막는지, 그리고 Kick 감소가 적용된 타격이 4를 회복시키는지 5를 회복시키는지가 결정됩니다.
  readings:
    A: >-
      보호 여부와 관계없이 상자를 열 때마다 5 HP 회복
    B: >-
      회복량은 피해자가 잃은 피해와 같음
    C: >-
      피해가 막히지 않았을 때만 회복, 반사된 상자는 아무도 회복시키지 않음
  resolution_paths:
  - >-
    VOD: Shield를 가진 피해자가 연 뒤 전후의 트롤 HP.
U-0533:
  question: >-
    Fake gravestone: 얼마나 지속되며, 2 h 대기는 설치 시점에 시작됩니까 이전 것이 사라질 때 시작됩니까?
  why_it_matters: >-
    페이지에는 fake gravestone의 지속 시간이 없습니다. 2 h 쿨다운 또는 "대기"는 설치 시점이나 제거 시점부터 흐를 수 있습니다.
  readings:
    A: >-
      설치 시점부터 2 h, 루팅될 때까지 지속 시간 무제한
    B: >-
      이전 fake gravestone이 사라진 시점부터 2 h
    C: >-
      설치 시점부터 2 h, 지속 시간은 2 h보다 짧음
  sweep_range: >-
    600 s부터 이벤트 길이까지: 600 s 미만이면 아무도 루팅하기 전에 사라지고, 상한은 영구입니다
  resolution_paths:
  - >-
    VOD: 몇 시간 동안 관찰한 fake gravestone.
U-0534:
