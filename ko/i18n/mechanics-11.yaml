M-0610:
  name: >-
    Death 블러드 토큰 수입
  quotes:
  - >-
    묘비를 약탈할 때마다 블러드 토큰 10개를, 다른 참가자가 죽을 때마다 1개를 얻습니다.
  readings:
    A: >-
      tokens += 묘비 약탈 1회당 10. tokens += 다른 참가자의 죽음 1회당 1(위치 무관)
    B: >-
      동일하되, 토큰 1개를 받으려면 50m 이내에서 죽어야 함
  domain: >-
    정수 토큰 수
  parameters:
    death_token_range_m: >-
      UNKNOWN, U-0605 참조
  notes: >-
    약탈 범위 10m와 회복 범위 50m는 다른 줄에 명시되어 있으며, 토큰 줄에는 범위가 없습니다.
M-0611:
  name: >-
    Death 묘비 약탈: 최대 HP의 5% 회복
  quotes:
  - >-
    10m (33ft) 이내의 묘비를 약탈하면 최대 HP의 5%를 회복합니다.
  - >-
    빈 묘비도 약탈할 수 있습니다.
  - >-
    묘비에서 아이템이나 블러드 토큰을 처음으로 루팅하면 그 묘비를 약탈한 것으로 간주됩니다.
  readings:
    A: >-
      heal = floor(M*5/100)
    B: >-
      heal = ceil(M*5/100)
    C: >-
      heal = M*5/100의 반올림(round half up)
    D: >-
      heal = M*5/100 (정확한 분수)
  domain: >-
    M = 최대 HP(정수, 기본값 100). 묘비까지의 거리 <= 10 m
  notes: >-
    M = 100이면 모든 해석에서 HP 5입니다. 최대 HP를 넘지 않는지는 명시되어 있지 않습니다. 빈 묘비도 약탈할 수 있지만, 빈 묘비를 약탈해도 회복과 토큰을 받는지는 명시되어 있지 않습니다.
M-0612:
  name: >-
    약탈된 묘비: 1회뿐이며 부활 불가
  quotes:
  - >-
    각 묘비는 한 번만 약탈할 수 있으며, 약탈된 묘비는 다시는 부활시킬 수 없습니다.
  - >-
    Sigil of death 플레이어가 당신의 묘비를 약탈하거나 가장 먼저 루팅하면, 당신은 다시는 부활할 수 없습니다.
  readings:
    A: >-
      robbed(g)는 되돌릴 수 없는 플래그. robbed(g)이면 revivable(g)은 영구히 거짓
  domain: >-
    묘비 g
  notes: >-
    개요 페이지와 Death 페이지는 일치합니다. 소개 페이지는 '약탈하거나 ... 가장 먼저 루팅'이라고 하고, Death 페이지는 아이템이나 토큰을 처음 루팅하면 약탈로 친다고 합니다.
M-0613:
  name: >-
    50m 이내 탈락마다 Death 회복
  quotes:
  - >-
    참가자가 당신으로부터 50m (164ft) 이내에서 죽으면, 지금까지 탈락한 참가자 1명당 HP 1씩(그 참가자 포함) 회복합니다.
  readings:
    A: >-
      heal = D_events (이번을 포함해 지금까지의 사망 이벤트 수)
    B: >-
      heal = D_dead_now (현재 죽어 있는 참가자 수, 피해자 포함)
    C: >-
      heal = D_distinct (한 번 이상 죽은 서로 다른 참가자 수)
  domain: >-
    정수 1 <= heal <= N. 피해자는 50 m 이내
  notes: >-
    상한을 알려면 참가자 총수(U-0009)가 필요합니다. Death 참가자 근처에서 죽을 때마다 회복이 반복됩니다. 여기서는 최대 HP 상한이 명시되어 있지 않습니다.
M-0614:
  name: >-
    생존자가 20% 이하일 때 Death 회복은 최대 HP의 60%로 제한
  quotes:
  - >-
    참가자의 20% 이하가 생존해 있으면, 그 회복으로는 최대 HP의 60%를 넘을 수 없습니다.
  readings:
    A: >-
      alive*5 <= N이면 HP' = min(HP + h, 0.6*M), 아니면 HP' = min(HP + h, M)
    B: >-
      A와 같으나 HP' = max(HP, min(HP + h, 0.6*M)) (HP를 낮추지 않음)
    C: >-
      상한을 반올림: floor(0.6*M) 또는 ceil(0.6*M)
  domain: >-
    alive, N은 정수. h는 탈락당 회복에서만 나옴. 약탈 회복은 '그 회복'에 해당하지 않음
  parameters:
    N: >-
      UNKNOWN, U-0009 참조
  notes: >-
    N은 참가자 총수이며 U-0009를 참조하십시오. 상한이 약탈 회복에도 적용되는지는 명시되어 있지 않습니다. '그 회복'은 탈락당 회복을 가리킵니다.
M-0615:
  name: >-
    Death ward: 서클 바깥에서 오는 첫 타격을 막고 2min 동안 면역, 쿨다운 2h
  quotes:
  - >-
    Death ward: 서클 바깥 또는 언세이프 서클에서 오는 첫 타격은 막히며, 2min 동안 두 가지 모두에 면역이 됩니다.
  - >-
    쿨다운은 2h입니다.
  - >-
    Death Ward: Death 참가자가 서클 바깥에서 받는 첫 타격은 막히며, 서클 바깥에서 오는 피해는 2min 동안 막힙니다.
  readings:
    A: >-
      서클 바깥 또는 언세이프 서클에서 오는 첫 타격 시: 이를 막은 뒤 120 s 동안 두 원천 모두에 면역. 이후 능력은 7200 s 동안 사용 불가
    B: >-
      피해 페이지의 표현: '서클 바깥' 원천만 해당, 120 s 구간
  domain: >-
    초 단위
  parameters:
    window_s: >-
      120
    cooldown_s: >-
      7200
  notes: >-
    피해 표는 Death Ward를 서클 바깥 행과 언세이프 서클 행 모두의 차단 수단으로 나열합니다. 피해 페이지 본문에 관한 모순은 C-0600을 참조하십시오.
M-0620:
  name: >-
    Endurance 인벤토리: 3 대신 10슬롯
  quotes:
  - >-
    인벤토리 슬롯이 3개가 아니라 10개입니다.
  readings:
    A: >-
      slots = 10
  parameters:
    inventory_slots: >-
      10
  notes: >-
    Slots 라벨(M-0603)과 같은 값입니다. 상인 페이지는 구매를 통해 Endurance에 최대 20까지 허용합니다.
M-0621:
  name: >-
    Endurance 보급 상자 일정
  quotes:
  - >-
    2h 30min마다 보급 상자가 당신으로부터 10m (33ft) 이내에 떨어집니다.
  - >-
    2h 30min마다 각 Endurance 참가자로부터 10m (33ft) 이내에 보급 상자가 떨어집니다.
  - >-
    30s 뒤에 착지합니다.
  - >-
    누구나 가져갈 수 있습니다.
  - >-
    착지한 뒤에는 일반 보급 상자이며, 어떤 참가자든 가져갈 수 있습니다.
  - >-
    체력 물약이나 드론은 절대 들어 있지 않습니다.
  readings:
    A: >-
      t_k = t0 + k*9000 s의 고정 시계. 착지는 t_k + 30 s. 위치는 참가자로부터 10 m 이내
    B: >-
      이전 상자가 수령될 때 타이머가 다시 시작
  domain: >-
    초 단위
  parameters:
    period_s: >-
      9000
    landing_delay_s: >-
      30
    t0: >-
      UNKNOWN, U-0607 참조
  notes: >-
    낙하 시점과 착지 시점 중 어느 때의 위치인지는 명시되어 있지 않습니다(10m는 상자가 떨어질 때 참가자로부터의 거리입니다). 내용물은 체력 물약과 드론을 제외한 무작위 아이템입니다.
M-0622:
  name: >-
    자신의 보급 상자를 수령할 때의 Endurance 토큰
  quotes:
  - >-
    2h 30min마다 떨어지는 자신의 보급 상자를 수령하면 블러드 토큰 6개를 얻습니다.
  readings:
    A: >-
      수령자가 그 상자가 떨어진 대상인 참가자 본인일 때 tokens += 6
    B: >-
      다른 사람이 먼저 루팅했더라도, 수령자가 소유한 상자를 수령하면 tokens += 6
  parameters:
    tokens_per_claim: >-
      6
  notes: >-
    누구나 수령할 수 있으므로 경쟁자가 먼저 가져갈 수 있습니다. 그 경우 소유자가 토큰을 받는지는 명시되어 있지 않습니다.
M-0623:
  name: >-
    아이템 5회 사용마다 Endurance 보너스 토큰
  quotes:
  - >-
    아이템을 5회 사용할 때마다 1개를 더 얻습니다.
  readings:
    A: >-
      누적 아이템 사용 횟수가 5의 배수에 도달할 때마다 tokens += 1
    B: >-
      수령 보상 = 6 + floor(마지막 수령 이후 사용 횟수 / 5)
    C: >-
      수령 보상 = 5회 사용이 이루어지면 6 + 1
  domain: >-
    정수 카운터
  notes: >-
    아이템 페이지와 비교하십시오. 일부 효과(Safety Bubbles, 연막탄, 붕대, 조합 아이템, 상인 업그레이드)는 '활성 아이템 효과'에서 제외되며, 여기에 그것이 적용되는지는 명시되어 있지 않습니다.
M-0624:
  name: >-
    Endurance 제한: 거래, 묘비 루팅, 버리기, 줍기 불가
  quotes:
  - >-
    거래하거나, 묘비를 루팅하거나, 아이템을 버리거나, 버려진 아이템을 주울 수 없습니다.
  - >-
    아이템 파괴, 상자 수령, 크레이트 획득은 여전히 할 수 있습니다.
  readings:
    A: >-
      행동 {trade, loot_gravestone, drop_item, pickup_dropped_item}은 비활성. {destroy_item, claim_chest, take_crate, claim_care_package}는 활성
    B: >-
      A에 더해, 다른 사람에게서 오는 거래 제안도 거부됨
  notes: >-
    묘비 루팅이 비활성이므로 Endurance 참가자는 무덤을 약탈하거나 거기서 아이템을 얻을 수 없습니다. 보급 상자 수령은 토큰 획득 규칙에 의해 허용됩니다.
M-0630:
  name: >-
    Necromancy 블러드 토큰 수입
  quotes:
  - >-
    가드와 호드 보너스를 포함해 자신의 좀비가 등장할 때마다 블러드 토큰 1개를, 좀비가 빼앗는 HP 1마다 1개를 얻습니다.
  readings:
    A: >-
      소유한 좀비가 등장할 때마다 tokens += 1(소환, 죽음, 호드 보너스, 가드). 소유한 좀비가 빼앗은 HP 1마다 tokens += 1
    B: >-
      A와 같으나, 빼앗은 HP는 피해자가 방어구와 상한을 거친 뒤 실제로 잃은 HP
  notes: >-
    호드 보너스는 좀비 5마리를 주므로 토큰도 5개입니다.
