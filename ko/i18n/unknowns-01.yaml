  - >-
    SCOPE.md P1(검색 색인에 삭제된 텍스트가 남아 있을 수 있습니다).
U-0100:
  question: >-
    4단계의 'The damage left is rounded down'은 어디에 적용됩니까? Protection 50% 결과에만 적용됩니까, 아니면 모든 감소 이후의 최종 내림 한 번으로 적용되며 Kick 10%는 내림하지 않은 값에서 계산됩니까?
  why_it_matters: >-
    Kick 라이브 중인 Protection 참가자가 핵을 맞을 때 홀수 피해가 달라집니다. 중간 내림 후 Kick을 적용하는 경우와, 정확한 절반에 Kick을 적용하는 경우의 차이입니다.
  readings:
    A: >-
      x -> floor(x/2) 후, 그 정수에 Kick 감소(U-0001 해석)를 적용
    B: >-
      x -> floor(0.9*(x/2)), 최종 내림 한 번만 적용(Kick 비율을 정확한 절반에 적용)
  resolution_paths:
  - >-
    VOD: 라이브 Protection 참가자가 기본 피해가 홀수인 핵을 맞고, HP 감소량을 읽습니다.
  - >-
    REA: 배포된 코드의 피해 공식.
  resolution: >-
    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. 4단계의 본문은 해석 A와 일치합니다. "A Protection contestant takes 50% less from a nuke."(wiki-damage-044) 다음에 "The damage left is rounded down."(wiki-damage-045)가 오고, 그 다음에야 "Being live on Kick then takes off 10%, rounded down."(wiki-damage-046)가 오므로, 각 감소는 자체 내림을 가지며 그 순서대로 적용됩니다. 해석 B는 두 감소 이후의 내림 한 번을 요구하는데, 이 세 문장은 그것을 설명하지 않습니다. 아직 미해결: wiki-damage-045가 Protection 문장에 속하는지 단계 전체의 내림인지는 라이브 Protection 참가자가 홀수 피해의 핵을 맞는 장면으로만 확인할 수 있습니다.
U-0101:
  question: >-
    Body armor가 'absorbs what is left, until it breaks'일 때, 남은 내구도보다 큰 타격은 초과분을 통과시킵니까(A), 아니면 타격 전체가 흡수되고 armor만 부서집니까(B)? 내구도는 흡수한 HP 1당 1씩 줄어듭니까?
  why_it_matters: >-
    armor 내구도가 HP 풀(초과분이 통과)인지 타격 횟수인지를 정하며, armor를 가진 모든 참가자의 유효 HP가 달라집니다.
  readings:
    A: >-
      absorbed = min(h, dur); dur -= absorbed; 초과분 h - absorbed가 HP에 도달
    B: >-
      if h > 0 and dur > 0: absorbed = h (타격 전체), dur -= h, 0 아래로는 내려가지 않음, dur이 0에 도달하면 armor가 부서지고 초과분은 소실
    C: >-
      타격의 크기와 무관하게 타격 1회당 내구도 1 감소
  resolution_paths:
  - >-
    VOD: 내구도가 보이는 armor 착용 참가자가 남은 내구도보다 큰 타격을 받는 장면.
  - >-
    REA: 배포된 armor 코드.
U-0102:
  question: >-
    Fortress 단계: 참가자가 여러 fortress 안에 서 있을 때 한 번의 타격을 몇 개의 fortress가 흡수할 수 있으며, 어떤 순서이고, 내구도는 흡수한 HP 1당 1씩 줄어듭니까?
  why_it_matters: >-
    중첩된 fortress가 내구도를 합산하는지, 그리고 fortress 내구도가 HP 풀인지를 정합니다.
  readings:
    A: >-
      fortress 하나(가장 가깝거나 먼저 지어진 것)가 min(h, dur)을 흡수하고 dur -= absorbed
    B: >-
      범위 안의 모든 fortress가 h = 0이 될 때까지 차례로 흡수
    C: >-
      흡수는 HP당이 아니라 타격당
  resolution_paths:
  - >-
    VOD: 겹치는 fortress 두 개 안에 있는 참가자가 타격을 받는 장면.
  - >-
    아이템 페이지의 fortress 규칙을 이 단계와 대조해 읽습니다(교차 계열).
U-0103:
  question: >-
    'A hit that gets through always does at least 1 HP'는 7단계 중 5단계입니다. fortress(6단계)와 armor(7단계)가 최종 HP 손실을 여전히 0으로 줄일 수 있습니까?
  why_it_matters: >-
    6단계와 7단계가 전부 흡수할 수 있다면 'always at least 1 HP'는 5단계까지만 성립합니다. 최소 1 HP가 최종이라면 armor와 fortress는 아주 작은 타격으로부터 참가자를 완전히 보호할 수 없습니다.
  readings:
    A: >-
      명시된 순서: h5 = max(1, h4) 후 fortress와 armor가 차감하며, 최종 HP 손실은 0이 될 수 있음
    B: >-
      최종 HP 손실 = max(1, h7): 최소가 마지막에 적용됨
    C: >-
      최소는 5단계에 0이 아니고 흡수되지 않은 채 도달한 타격에만 적용
  resolution_paths:
  - >-
    VOD: armor 착용 참가자가 1 HP 원천(존 틱, 독 단계, 감소 이후의 활)을 받는 장면.
  - >-
    REA: 배포된 코드의 피해 공식.
U-0104:
  question: >-
    'A final kill pays 25 blood tokens, or 50 if the killer or victim held the blood crown': 누가 지급받으며, 무엇이 처치를 'final'로 만들고, 지급은 언제 이루어집니까?
  why_it_matters: >-
    처치로 얻는 블러드 토큰 수입은 전투의 주된 자원 흐름입니다. 수령인과 시점에 따라 부활이 지급을 취소하는지가 정해집니다.
  readings:
    A: >-
      처치한 사람이 결정타 시점에 25를 지급받음(왕관이 있으면 50)
    B: >-
      처치한 사람이 부활 제한 시간이 부활 없이 끝난 뒤 지급받음(final = 부활되지 않음)
    C: >-
      처치한 사람이 25를 지급받고, 왕관이 관련되면 추가 25가 다른 곳으로 가므로 총 지급액은 50
  resolution_paths:
  - >-
    VOD: 결정타 시점과 10 min 후의 처치자 블러드 토큰 카운터.
  - >-
    주최자의 발언.
U-0105:
  question: >-
    'Blood tokens in the grave stay locked while revival is possible': 누구의 토큰이며, 얼마 동안이고, 잠금이 끝나면 어떻게 됩니까?
  why_it_matters: >-
    루팅하는 사람(Death 시길 포함)이 묘비에서 토큰을 가져갈 수 있는 시점과, 부활한 참가자가 돌려받는 것을 정합니다.
  readings:
    A: >-
      죽은 참가자의 토큰은 10 min 동안 잠기고 그 후 루팅할 수 있으며, 부활하면 돌려받음
    B: >-
      부활이 일어나거나 다른 이유(부활 상한, 강탈)로 부활이 불가능해질 때까지 잠김
    C: >-
      처치한 사람에게 지급된 토큰도 제한 시간이 끝날 때까지 묘비에 잠김
  resolution_paths:
  - >-
    VOD: 10 min 전과 후에 루팅된 묘비.
  - >-
    Death 시길 페이지의 'first to loot items or blood tokens' 규칙과 대조합니다.
U-0106:
  question: >-
    시청자 왕관 처치 보너스 'equal to 20% of the attack's purchase price': 끝수 처리 규칙, 'kills'가 최종 처치를 뜻하는지 여부, 그리고 여러 시청자가 보유자를 공격했을 때 어느 공격이 해당되는지.
  why_it_matters: >-
    이 규칙이 없으면 가격(U-0014)을 알게 되더라도 시청자에게 왕관 처치의 가치를 계산할 수 없습니다.
  readings:
    A: >-
      bonus = floor(0.2*p)
    B: >-
      bonus = ceil(0.2*p)
    C: >-
      bonus = 0.2*p 그대로(소수 Cx-Bucks 허용)
  resolution_paths:
  - >-
    VOD/화면: 가격이 알려진 공격으로 왕관 처치를 한 뒤 시청자의 Cx-Bucks 잔액.
  - >-
    주최자의 발언.
