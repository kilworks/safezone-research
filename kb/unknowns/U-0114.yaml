id: U-0114
question: 'The zone can ''split apart'': with several safe zones, is ''leave a safezone'' damage triggered when outside every zone (A) or when leaving the zone you were last in (B)?'
why_it_matters: Decides whether crossing between two zones is a loss, which is central when the zone splits.
readings:
  A: damage clock runs only when the position is inside no safe zone
  B: damage clock runs when leaving a zone, restarts if re-entering any zone
  C: damage clock is tied to one assigned zone per contestant
resolution_paths:
- 'VOD: a split event and a contestant crossing between the two.'
- Organizer statement.
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. Three clauses are consistent with reading A, without describing the clock: "Only the part inside a safe zone hurts: outside every safe zone you take normal zone damage only" (wiki-sigils-trolling-023), an unsafe circle hurts "Anyone inside it who is also inside a safe zone" (wiki-sigils-trolling-017), and of the giant cyclops, "Outside the safe zones it takes zone damage" (wiki-attacks-071). Against it, the base rule is written in the singular with the verb leave, which reads like B or C: "If you leave a safezone, after 5s you will start taking 1 HP damage every 2s" (wiki-005). The zone can "even split apart" (wiki-004), and no clause gives a rule for a split or assigns a contestant to one zone. Still open: a VOD of a split or an organizer statement.'
related:
