id: M-0510
name: Greed steal reward and cooldown
family: economy
sigils:
- greed
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: A successful steal earns five blood tokens, once per victim every 24 hours.
  clause: wiki-sigils-greed-007
- url: https://iceposeidon.com/safezone/wiki/sigils/greed#rules
  snapshot: '2026-11-11'
  quote: Cooldown 30min.
  clause: wiki-sigils-greed-014
formal:
  readings:
    A: reward 5 blood tokens per successful steal, at most once per victim per rolling 24 h; steals allowed every
      30 min
    B: a given victim can be successfully stolen from by the thief at most once per 24 h
    C: cooldown 30 min starts on any use; or only after a success
  domain: 'time in seconds: cooldown 1800 s, window 86400 s'
  parameters:
    reward_tokens: '5'
    per_victim_window_s: '86400'
    cooldown_s: '1800'
depends_on: []
interacts_with:
- M-0509
label: CONDITIONAL
open_unknowns:
- U-0507
- U-0508
notes: '''Cooldown 30min'' is cited as the steal cooldown because it sits directly after the Steal sentence in the
  same list. Different victims can be stolen from every 30 min.'
