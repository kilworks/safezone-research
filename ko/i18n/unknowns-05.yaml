U-0331:
  question: >-
    '+10 maximum HP'는 현재 HP도 10 올립니까?
  why_it_matters: >-
    이 업그레이드가 최대치 상승일 뿐 아니라 회복이기도 한지를 결정합니다.
  readings:
    A: >-
      최대 HP +10, 현재 HP는 그대로
    B: >-
      최대 HP +10 그리고 현재 HP +10
  resolution_paths:
  - >-
    VOD: 체력이 가득 차지 않은 상태에서 업그레이드 전후의 HP 표시.
U-0332:
  question: >-
    Deep Cut: 첫 출혈 틱은 언제이며, 출혈 중에 새 타격을 받으면 타이머가 초기화되고, 사용하지 않은 충전은 얼마나 오래 유지되며, 출혈 틱은 타격으로 계산됩니까?
  why_it_matters: >-
    출혈은 이 페이지에서 유일하게 상한이 없는 지속 피해이며, 붕대나 Healing 참가자로만 끝납니다.
  readings:
    A: >-
      첫 틱은 타격 5 min 후, 새 출혈 타격은 무시, 충전은 만료되지 않음, 틱은 일반 피해 이벤트
    B: >-
      첫 틱은 즉시, 이후 5 min마다, 새 타격이 5 min 타이머를 재시작, 충전은 만료되지 않음
    C: >-
      충전은 명시되지 않은 기간 후 만료
  resolution_paths:
  - >-
    VOD: Deep Cut 무기에 타격당한 참가자의 출혈 타임라인.
U-0333:
  question: >-
    무기 인챈트 'Twice the uses ... keeps the uses it had before or the uses it has left, whichever is lower': 무엇의 두 배이며, 'the uses it had before'는 무엇입니까?
  why_it_matters: >-
    인챈트 후의 사용 횟수와, 사용 횟수가 적게 남은 무기가 2시간 뒤에 무엇을 유지하는지를 정합니다.
  readings:
    A: >-
      사용 횟수는 2 * (인챈트 시점의 남은 횟수)가 됨, 'before' = 인챈트 시점의 남은 횟수
    B: >-
      사용 횟수는 2 * (무기의 최대 사용 횟수)가 됨, 'before' = 인챈트 시점의 남은 횟수
    C: >-
      사용 횟수는 남은 횟수 + 최대 사용 횟수가 됨, 'before' = 최대 사용 횟수
  resolution_paths:
  - >-
    VOD: 절반 사용한 knife를 인챈트하고 사용 횟수 확인.
U-0334:
  question: >-
    인챈트 시계: 2시간은 구매 시점에 시작합니까, 무기에 적용하는 시점에 시작합니까? 그리고 'For every other weapon, if two hours pass first'는 Zarok's axe, Poison Dart, C4, landmine, drone도 제한합니까?
  why_it_matters: >-
    시간 제한이 없으면 그 아이템들은 무기한 인챈트 상태로 남을 수 있습니다(사용으로만 끝남).
  readings:
    A: >-
      구매 후 2 h, 제한은 knife, machete, long sword('every other weapon' 그룹)와 bow에만 적용
    B: >-
      구매 후 2 h, 제한은 staff를 제외한 모든 인챈트 무기에 적용
    C: >-
      무기에 인챈트를 적용한 시점부터 2 h
  resolution_paths:
  - >-
    VOD: 2 h 넘게 보유한 인챈트 axe 또는 landmine.
U-0335:
  question: >-
    인챈트된 bow의 'five shots or two hours': 먼저 오는 쪽입니까, 나중에 오는 쪽입니까?
  why_it_matters: >-
    보너스가 긴 대기 시간을 견디는지, 다섯 발 뒤에 끝나는지를 결정합니다.
  readings:
    A: >-
      5발 또는 2 h 중 먼저 오는 쪽에서 끝남
    B: >-
      둘 다 도달해야만 끝남
  resolution_paths:
  - >-
    VOD: 2 h 안에 5발을 쏜 후의 인챈트 bow.
U-0336:
  question: >-
    인챈트된 C4 또는 landmine: '+10m radius'는 발동 거리에도 적용됩니까? 그리고 인챈트된 함정으로 만든 trapped gift에 인챈트가 이어집니까?
  why_it_matters: >-
    trapped gift의 +20 피해(기본 23 HP와 11 HP)와 발동 범위가 모두 인챈트된 함정의 효과를 바꿉니다.
  readings:
    A: >-
      발동과 폭발 모두 반경 +10 m, 인챈트된 함정으로 만든 trapped gift는 +20 유지
    B: >-
      폭발에만 반경 +10 m, trapped gift는 기본 23 또는 11 HP 사용
    C: >-
      인챈트된 함정은 부착할 수 없음
  resolution_paths:
  - >-
    VOD: 15 m에서 발동한 인챈트 landmine.
U-0337:
  question: >-
    인챈트 제한 'one enchanted weapon, or two with Dual Wield': 무기 슬롯 아이템이 아닌 C4, landmine, drone, Poison Dart도 포함합니까?
  why_it_matters: >-
    참가자가 인챈트된 C4와 인챈트된 bow를 한 슬롯에서 함께 가질 수 있는지를 결정합니다.
  readings:
    A: >-
      제한은 C4, landmine, drone을 포함한 모든 인챈트 아이템을 셈
    B: >-
      제한은 무기 슬롯 아이템(근접 무기, bow, staff, Poison Dart)만 셈
  resolution_paths:
  - >-
    VOD: 인챈트된 C4를 든 채 두 번째 무기 인챈트 구매.
U-0338:
  question: >-
    방어구 인챈트 '+10 durability, up to 45': 반복 구매할 수 있습니까, 45는 인챈트 후 내구도의 상한입니까, 그리고 어떤 기준값에서 시작합니까?
  why_it_matters: >-
    방어구 기본 내구도는 다른 페이지(Body Armor 15 HP absorb)에 있으며, 반복 구매 경로로 45에 도달할 수 있습니다.
  readings:
    A: >-
      구매마다 10 추가, 총 내구도 45에서 상한
    B: >-
      방어구당 인챈트 한 번, 상한은 시작 내구도만 제약
    C: >-
      인챈트는 내구도를 min(current + 10, 45)로 설정
  resolution_paths:
  - >-
    VOD: 두 번 구매하기 전후의 방어구 내구도 표시.
U-0339:
  question: >-
    인챈트된 방어구 감쇠 'loses one durability every twenty minutes, down to 15': 시계는 언제 시작하고, 피해로 15보다 낮아졌어도 감쇠가 15에서 멈추며, 재인챈트하면 다시 시작합니까?
  why_it_matters: >-
    45 내구도의 수명과 인챈트된 방어구의 하한을 정합니다.
  readings:
    A: >-
      시계는 인챈트 시점에 시작, 첫 감소는 20 min 후, 내구도 <= 15이면 감소 없음
    B: >-
      시계는 첫 인챈트부터 계속 흐르고 재인챈트는 다시 시작하지 않음
    C: >-
      감쇠는 인챈트 여부와 관계없이 15를 넘는 모든 방어구에 적용
  resolution_paths:
  - >-
    VOD: 인챈트 후 한 시간 동안의 방어구 내구도.
U-0340:
  question: >-
    정확한 위치에 30 s 후 떨어진다고 할 때, 상인의 'standard missile'은 피해와 반경이 얼마입니까?
  why_it_matters: >-
    공격 페이지는 3min 무작위 낙하의 시청자 미사일을 설명하지만, 상인 텍스트는 'standard missile'을 언급할 뿐 피해나 반경을 주지 않습니다.
  readings:
    A: >-
      시청자 미사일과 같은 피해와 폭발 반경(공격 페이지에 따르면 25 m 이내 10 HP)
    B: >-
      명시되지 않은 다른 피해
  sweep_range: >-
    10 ~ 20 HP: 공격 페이지에서 시청자 미사일은 10, 핵은 20을 줍니다
  resolution_paths:
  - >-
    VOD: 상인 미사일 착탄 시 HP 손실과 반경.
U-0400:
  question: >-
    미사일 낙하 편차: 'a random spot near that point'이며 폭발 전체가 100m 이내입니다. 낙하 오프셋은 최대 75m(폭발 가장자리가 100m 이내)입니까, 최대 100m입니까, 그리고 분포는 무엇입니까?
  why_it_matters: >-
    조준점에 서 있는 참가자에 대한 명중 확률과, 시청자가 한 참가자를 안정적으로 겨냥할 수 있는지를 결정합니다.
  readings:
    A: >-
      낙하 오프셋 r <= 100 - 25 = 75m, 따라서 25m 폭발이 100m 이내에 머묾
    B: >-
      낙하 오프셋 r <= 100m(폭발 중심), 이 문장은 'near'를 뜻함
    C: >-
      그 반경의 원판 위에서 균등
    D: >-
      거리 r에서 균등, 각도는 무작위(중심 쪽으로 치우침)
  sweep_range: >-
    0 ~ 100 m; 위키는 폭발을 조준점에서 100m 이내로 제한하므로 중심 오프셋은 0과 100 사이에 있습니다
  resolution_paths:
  - >-
    VOD: 여러 미사일의 조준점과 크레이터를 비교 기록.
  - >-
    관리자 또는 주최자의 진술.
U-0401:
  question: >-
    EMP 차단의 범위: 위키는 미사일, 핵, horde, 최루 가스, 공습, 건십, 사이클롭스, 현상금을 나열합니다. 긴급 에어드롭, 회복 서클, 환영, 시청자 상자도 차단됩니까? 차단은 구매 시점을 검사합니까, 착탄 시점을 검사합니까?
  why_it_matters: >-
    EMP 보유자가 막을 수 있는 시청자 행동과, 비행 중인 회복 서클이나 에어드롭이 살아남는지를 결정합니다.
  readings:
    A: >-
      나열된 8개 공격만 거부되며 에어드롭, 회복 서클, 환영, 상자는 항상 통과
    B: >-
      EMP가 활성인 동안 모든 시청자 행동이 거부되며 목록은 예시일 뿐
    C: >-
      차단은 구매 시점만 검사하고, 비행 중 파괴는 미사일, 핵, 공습, 건십에만 적용
  resolution_paths:
  - >-
    아이템 페이지의 EMP 텍스트(10 min)와 EMP 중에 보낸 시청자 에어드롭 또는 회복 서클의 VOD.
U-0402:
  question: >-
    Protection 시길의 핵 피해 감소: 20 HP의 '50% less'는 10 HP이지만, 관리자가 정한 홀수 피해는 어떻게 반올림되며, 감소는 다른 경감 전에 적용됩니까 후에 적용됩니까?
  why_it_matters: >-
    관리자 핵은 임의의 피해를 설정할 수 있고, 홀수 값이면 floor, ceil, 정확한 분수가 서로 달라지며, 순서에 따라 Kick 라이브 중과 방어구가 있을 때의 합계가 바뀝니다.
  readings:
    A: >-
      d -> floor(d/2)
    B: >-
      d -> ceil(d/2)
    C: >-
      d -> d/2 정확값(반올림 없음)
  sweep_range: >-
    1 ~ 100 HP; 위키는 기본값 20 HP만 제시하며 관리자 범위는 없습니다
  resolution_paths:
  - >-
    Protection 참가자에게 홀수 피해의 관리자 핵을 쓴 VOD.
  - >-
    피해 페이지의 연산 순서(U-0001, U-0006).
U-0403:
  question: >-
    좀비 수명: Horde는 20min, 가드 좀비는 1h(Necromancy 페이지)로 유지되지만, Summon, Death, Horde 보너스 좀비의 수명과 방출 시점부터 센 horde 좀비의 수명은 얼마입니까?
  why_it_matters: >-
    시간이 명시되지 않은 'A zombie disappears when its time runs out'은 좀비 압박 총량과 Necromancy 수입이 무제한인지 유한한지를 좌우합니다.
  readings:
    A: >-
      출처와 관계없이 각 좀비는 자신의 생성 시점부터 20min 동안 존재
    B: >-
      horde 좀비만 20min에 사라지고, Summon, Death, 보너스 좀비는 이벤트 끝까지 존재
    C: >-
      출처마다 공개되지 않은 고유의 시간이 있음
  sweep_range: >-
    60 ~ 86400 s; 20min이 명시된 유일한 좀비 타이머이고, 하루 상한은 이벤트 규모입니다
  resolution_paths:
  - >-
    VOD: Summon 좀비가 사라질 때까지 추적.
U-0404:
  question: >-
    최루 가스 기하: '25m cloud'는 반경입니까 지름입니까? 그리고 구름 가장자리는 모든 참가자로부터 최소 20m 떨어져야 합니다. 구매 시점에만 그렇습니까, 설치 시점에도 그렇습니까? 구름 전체가 세이프 존 안에 있어야 합니까?
  why_it_matters: >-
    가장 가까운 참가자까지의 최소 조준 거리(중심에서 45m 또는 32.5m)와, 시청자가 참가자에게 가스를 쓸 수 있는지 자체를 정합니다.
  readings:
    A: >-
      반경 25m, 따라서 중심은 모든 참가자로부터 최소 45m
    B: >-
      지름 25m(반경 12.5m), 따라서 중심은 모든 참가자로부터 최소 32.5m
    C: >-
      20m 규칙은 설치 시점 검사일 뿐이며, 이후 구름으로 이동하는 것은 자유
  sweep_range: >-
    12.5 ~ 25 m; 위키는 '25m'만 크기로 제시합니다
  resolution_paths:
  - >-
    VOD: 참가자 근처에 최루 가스를 설치하고 거부 임계값을 기록.
U-0405:
  question: >-
    최루 가스와 좀비 처치 타이밍: 10s마다 2 HP 틱은 진입 10s 후에 시작합니까, 진입 시에 시작합니까, 구름 전체 공통의 10s 위상입니까? 좀비는 진입 즉시 죽습니까, 틱에 죽습니까? 틱은 '타격'(U-0002)입니까?
  why_it_matters: >-
    짧게 지나갈 때의 피해가 달라지고(9s 통과는 진입 타이머면 0 HP, 전역 위상이면 2 HP), 좀비의 가스 사망도 달라집니다.
  readings:
    A: >-
      참가자별 타이머: 첫 손실은 진입 10s 후, 이후 10s마다
    B: >-
      첫 손실은 진입 시, 이후 10s마다
    C: >-
      구름 전체 공통 위상, 틱 시점에 안에 있는 모든 참가자가 2 HP 손실
  resolution_paths:
  - >-
    VOD: 화면 타이머와 함께 이벤트를 라이브로 관찰.
U-0406:
  question: >-
    공습 띠의 너비(위키는 중심과 방향만 제시합니다).
  why_it_matters: >-
    5 HP 공습과 5min 화재의 명중 확률.
  sweep_range: >-
    5 ~ 100 m; 25m 폭발보다 좁지만 다른 공격의 100m 규모 이내입니다
  resolution_paths:
  - >-
    VOD: 지도에서 불탄 띠를 측정.
U-0407:
  question: >-
    공습 띠의 길이, 그리고 띠가 선택한 지점을 중심으로 하는지와 세이프 존을 벗어날 수 있는지.
  why_it_matters: >-
    너비와 함께 불타는 면적을 정하고, 불이 언세이프 존에 닿을 수 있는지를 정합니다.
  sweep_range: >-
    50 ~ 1000 m; 위키는 크기를 주지 않으며 지도 규모로 제한됩니다
  resolution_paths:
  - >-
    VOD: 지도에서 불탄 띠를 측정.
U-0408:
  question: >-
    공습 타임라인: 20s에 착탄하고 'the strip then burns for 5min'. 화재는 착탄부터 5min 지속됩니까, 첫 1 HP 틱은 착탄 시입니까 2s 후입니까, 화재 중에 띠로 들어가면 HP를 잃습니까? 화재 틱은 타격(U-0002)입니까?
  why_it_matters: >-
