U-0000:
  question: >-
    보고된 $5,000 시청자 상금의 출처와 정확한 조건은 무엇입니까?
  why_it_matters: >-
    시청자 경제 모델(8.10절)에서 시청자의 목표를 정합니다. 이것이 없으면 시청자 전략은 Cx-Buck당 피해를 최대화하는 것으로만 설정할 수 있습니다.
  readings:
    A: >-
      $5,000 상금은 존재하지 않으며, 시청자 상금은 금액이 명시되지 않은 '상위 3명 시청자' 현금 상금입니다.
    B: >-
      $5,000 상금이 존재하며, 아직 찾지 못한 조건이 있습니다.
  resolution_paths:
  - >-
    주최자의 X 게시물을 직접 읽습니다(kil의 로그인된 브라우저 세션이 필요합니다).
  - >-
    방송 중 주최자의 발언(VOD 타임스탬프).
  - >-
    kil이 SCOPE.md에 추가하는 경우 /events 또는 /safezone/recap 페이지.
U-0001:
  question: >-
    방어자의 Kick 라이브 10% 감소는 결과를 내림하는 것입니까(A), 아니면 제거되는 10%를 내림하는 것입니까(B)?
  why_it_matters: >-
    작은 타격마다 최대 1 HP씩 결과가 달라집니다. A에서는 2에서 10까지의 타격이 1 HP씩 줄어들고, B에서는 10 미만의 타격은 변하지 않습니다.
  readings:
    A: >-
      d -> floor(9d/10)
    B: >-
      d -> d - floor(d/10)
  resolution_paths:
  - >-
    VOD: 5 HP 타격(활, 칼, 가짜 상자)을 받는 라이브 참가자에게 -4(A) 또는 -5(B)가 표시됩니다.
  - >-
    REA: 배포된 코드의 피해 공식(클라이언트 코드에는 공식이 없습니다, RE-0001).
U-0002:
  question: >-
    개별 공격이 아닌 피해(존 틱, 언세이프 서클(unsafe circle), robot, 독, 최루 가스, 출혈, 좀비 드레인(drain), Eddie의 손실, Retribution)에 파이프라인의 4b단계(방어자의 Kick 라이브 감소), 5단계(최소 1 HP), 6단계(fortress)가 적용됩니까? 그리고 가드 좀비 드레인과 부활 비용은 애초에 피해의 한 종류입니까(둘 다 피해 표에 행이 없습니다)?
  why_it_matters: >-
    막는 수단과 Body armor는 더 이상 이 질문에 좌우되지 않습니다(아래의 범위 축소를 보십시오). 남은 부분에 따라 달라지는 것은 다음과 같습니다. Kick 라이브 참가자가 Retribution으로 잃는 HP(18 또는 20 HP), Eddie의 물약으로 잃는 HP(최대 HP 100일 때 27 또는 30 HP), 최루 가스와 가드 좀비의 2 HP 틱으로 잃는 HP(1 또는 2 HP, U-0001 해석 A에서만), fortress가 존 틱을 흡수하는지, 부활 비용이 줄어들거나 흡수될 수 있는지입니다. 1 HP 틱은 해석 A와 B 모두에서 1 HP로 유지됩니다(T-0002, T-0004).
  readings:
    A: >-
      피해 표의 모든 행은 타격이므로 4b, 5, 6단계가 모두에 적용됩니다.
    B: >-
      4b, 5, 6단계는 개별 공격에만 적용됩니다. 주기적 피해와 자해 피해에는 1단계와 7단계만 적용되고 그 밖에는 아무것도 적용되지 않습니다.
    C: >-
      원천별로 또는 단계별로 혼합됩니다.
  resolution_paths:
  - >-
    VOD: Protection 참가자가, armor가 없고 fortress 안에 있지 않은 Kick 라이브 참가자로부터 30m 이내에서 사망합니다. 피해자는 U-0001의 두 해석 모두에서 18 HP(4b단계 적용) 또는 20 HP(미적용)를 잃습니다.
  - >-
    VOD: 최대 HP가 100인 Kick 라이브 참가자가 Eddie의 물약 도박에서 집니다: 27 HP 또는 30 HP.
  - >-
    VOD: 참가자가 모든 세이프 존 밖의 fortress 안에 서 있습니다. fortress의 내구도가 줄어들거나(6단계 적용) 참가자의 HP가 줄어듭니다.
  - >-
    VOD: Body armor를 착용한 부활 시전자: armor 내구도가 5 줄어들거나(비용이 피해임) HP가 줄어듭니다.
  - >-
    검증 수단이 아님: armor가 없는 참가자가 받는 1 HP 틱(존, 독, 좀비 드레인)은 해석 A와 B 모두에서 1 HP입니다(T-0002, T-0004).
  resolution: >-
    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. 확정된 내용: (1) 1단계는 원천별로 적용됩니다. 존, 언세이프 서클, robot, 독, 최루 가스, 좀비 드레인, 출혈, Eddie의 역효과, Retribution은 각각 피해 표에 막는 수단의 행이 있습니다(wiki-damage-005부터 wiki-damage-010, wiki-damage-017, wiki-damage-030, wiki-damage-031). (2) 7단계는 이들 모두에 적용됩니다. 각 행은 "Body armor (absorbs)"로 끝나므로, 이전의 해석 B(주기적 드레인은 파이프라인 전체를 우회한다)는 armor에 관해서는 반박됩니다(wiki-damage-071은 "Body Armor works on every kind of damage"라고 말하지만 이 문장은 일반 규칙이 아닙니다. "A trapped gift ignores it", wiki-items-027). (3) 2단계는 적용되지 않습니다. 공격자의 Kick 보너스는 닫힌 무기 목록(wiki-damage-038)이며 이 원천들은 거기에 없습니다. (4) 3단계는 적용되지 않습니다. Mirror forcefield는 닫힌 목록(wiki-damage-070)만 "only reflects" 하며 이 원천들은 거기에 없습니다(Poison Dart는 그 목록에 있고, 피해 표의 독 행에는 Mirror forcefield가 없습니다, wiki-damage-008). (5) 4a단계는 적용되지 않습니다. Protection의 감소는 핵에만 해당합니다(wiki-damage-044). 아직 미해결: 이 원천들에 대한 4b, 5, 6단계, 가드 좀비 드레인이 "Zombie drain"인지 여부, 그리고 본문이 비용이라고 부르는 부활 비용.
U-0003:
  question: >-
    존 피해: 세이프 존을 벗어난 뒤 첫 틱은 5 s입니까, 7 s입니까?
  why_it_matters: >-
    존 밖에서 사망하기까지의 시간이 2 s 달라집니다(T(100) = 203 s 또는 205 s).
  readings:
    A: >-
      첫 틱은 5 s, 이후 2 s마다
    B: >-
      첫 틱은 7 s(5 s 유예 후 2 s 간격 한 번)
  resolution_paths:
  - >-
    존을 벗어나는 참가자를 화면 내 타이머와 함께 담은 VOD.
U-0004:
  question: >-
    Eddie의 포션 30% 손실이 사망을 일으킬 수 있으며, armor, fortress 또는 Kick 상태가 여기에 적용됩니까?
  why_it_matters: >-
    포션이 최후의 수단인지, 낮은 HP에서의 자살인지를 정합니다.
  readings:
    A: >-
      손실로 사망할 수 있으며 어떤 보호도 적용되지 않습니다.
    B: >-
      손실로 사망할 수 있으며 파이프라인이 적용됩니다(armor가 흡수하고 Kick이 감소시킵니다).
    C: >-
      손실로 HP가 1 아래로 내려갈 수 없습니다.
  resolution_paths:
  - >-
    VOD: 최대 HP의 30% 이하인 참가자가 이 포션을 마시는 장면.
  - >-
    피해 표는 'Eddie's Potion backfire'를 Shield, Safety bubble, Sleeping Bag, Body armor로 막을 수 있다고 기재하며, 이는 차단에 관해 B를 뒷받침합니다(공식화 예정).
  resolution: >-
    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. 해석 A(어떤 보호도 적용되지 않음)는 반박됩니다. 피해 표에는 "Eddie's Potion backfire" 행이 있고, Shield, Safety bubble, Sleeping Bag이 막는 수단이며 "Body armor (absorbs)"가 붙어 있습니다(wiki-damage-030). 또한 "Body Armor works on every kind of damage"입니다(wiki-damage-071). 아직 미해결: 손실로 사망할 수 있는지 아니면 1 HP에서 멈추는지(해석 B와 C), 그리고 Kick 라이브 감소와 fortress가 적용되는지 여부이며, 후자는 U-0002에 남아 있는 부분입니다.
U-0005:
  question: >-
    반사된 타격은 공격자 자신의 파이프라인(면역, 감소, armor)을 거칩니까?
  why_it_matters: >-
    armor를 가진 공격자 또는 라이브 공격자를 상대로 한 Mirror forcefield의 가치가 달라집니다.
  readings:
    A: >-
      반사된 타격은 공격자의 전체 파이프라인을 거칩니다.
    B: >-
      반사된 타격은 가공 없이 그대로 적중합니다.
  resolution_paths:
  - >-
    VOD: armor를 가진 공격자에게 반사된 타격.
U-0006:
  question: >-
    서버 연산은 정확합니까, 아니면 IEEE 754 binary64입니까(H-0001: Ingenuity 가격이 기본 50, 90, 100, 110일 때)?
  why_it_matters: >-
    binary64의 ceil(p*1.1)은 해당 기본 가격에서 블러드 토큰 1개를 더 청구합니다.
  readings:
    A: >-
      정확한 정수 연산
    B: >-
      ceil(p * 1.1)을 쓰는 binary64
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자의 상인 화면에서 Dual Wield(기본 50)가 55(A) 또는 56(B)로 표시됩니다.
U-0007:
  question: >-
    Healing 재생: 피해가 30 min 타이머를 초기화합니까?
  why_it_matters: >-
    주기적 피해 상황에서 지속 재생 속도를 정합니다.
  readings:
    A: >-
      30 min 고정 시계이며 피해가 이를 초기화하지 않습니다
    B: >-
      피해가 타이머를 초기화합니다
  resolution_paths:
  - >-
    VOD: 타격을 받는 Healing 참가자의 한 시간 동안의 HP.
U-0008:
  question: >-
    좀비 30 HP 상한: 좀비 수명당입니까, 조우당입니까, 하루당입니까? 좀비가 죽으면 어떻게 됩니까?
  why_it_matters: >-
    좀비 피해 총량의 한계를 정합니다. 조우당이라면 좀비 피해는 무제한이 됩니다.
  readings:
    A: >-
      좀비 수명당, 참가자별
    B: >-
      조우당
    C: >-
      시간 구간당
  resolution_paths:
  - >-
    VOD: 범위를 벗어난 뒤 참가자와 다시 교전하는 좀비 한 마리.
U-0009:
  question: >-
    Miami의 참가자 수와 이벤트 기간.
  why_it_matters: >-
    지평 T, Death 시길의 '20% 이하 생존' 임계값, 그리고 모든 최후 생존자 모델을 정합니다.
  resolution_paths:
  - >-
    주최자의 발언 또는 이벤트 중 라이브 개요 페이지(SCOPE.md P2).
U-0010:
  question: >-
    Wizard staff의 '5 s 동안 총 10 HP': 한 번의 타격입니까, 여러 번의 틱입니까?
  why_it_matters: >-
    Kick 보너스, Kick 감소, 최소 1 HP가 한 번만 적용되는지 틱마다 적용되는지를 정합니다.
  readings:
    A: >-
      10 HP 타격 한 번
    B: >-
      2 HP 틱 다섯 번
    C: >-
      1 HP 틱 열 번
  resolution_paths:
