U-0209:
  question: >-
    Body armor의 15 HP는 줄어드는 풀입니까, 타격당 상한입니까? 일부만 흡수된 타격은 어떻게 처리됩니까?
  why_it_matters: >-
    반복되는 작은 타격(존 틱, 독)에 대한 생존력이 달라집니다.
  readings:
    A: >-
      15 HP의 줄어드는 풀, 마지막 타격은 부분 흡수
    B: >-
      타격당 상한 15 HP, 소모되지 않음
  resolution_paths:
  - >-
    VOD: 반복 타격 후의 armor 내구도.
  - >-
    피해 페이지: 'absorbs what is left, until it breaks'는 A를 뒷받침합니다.
  resolution: >-
    2026-11-11 스냅샷의 본문으로 2026-11-13에 앞부분이 해결되었습니다. armor는 소모되며 해석 B는 반박됩니다. armor는 "absorbs what is left, until it breaks"이고(wiki-damage-055), 그 크기는 변하는 내구도입니다. "+10 durability, up to 45"(wiki-merchant-057), 그 뒤에는 "loses one durability every twenty minutes, down to 15"입니다(wiki-merchant-058). 결코 소모되지 않는 armor(해석 B)는 부서질 수 없습니다. 따라서 "Absorbs up to 15 HP of damage"(wiki-items-026)는 새 풀의 크기입니다. 뒷부분(armor를 부수는 타격이 어떻게 나뉘는지, 흡수한 HP 1당 내구도가 1씩 줄어드는지)은 U-0101이며 여전히 미해결입니다.
