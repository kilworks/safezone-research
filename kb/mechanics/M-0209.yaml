id: M-0209
name: Hazmat suit lengthens zone damage interval
family: items
sigils:
- all
sources:
- url: https://iceposeidon.com/safezone/wiki/items#hazmat_suit
  snapshot: '2026-11-11'
  clause: wiki-items-013
  quote: While you carry it, each zone damage interval is 2s longer.
formal:
  readings:
    A: 'while carried: outside-zone damage interval = 2s + 2s = 4s, grace/first tick unchanged'
    B: 'while carried: every interval 4s and the first tick is also delayed by 2s'
    C: 'while carried: +2s also applies to unsafe circle and robot damage intervals (the damage page lists Hazmat suit (slows) for outside circle, unsafe circle and robot)'
  domain: carry state boolean; interval s in seconds
  parameters:
    added_interval: 2s
    base_interval: '2s (zone page: 1 HP every 2s)'
depends_on: []
interacts_with:
- M-0205
label: CONDITIONAL
open_unknowns:
- U-0205
- U-0003
notes: Damage per tick is unchanged, so the zone drain rate halves (1 HP per 4s) under the plain reading. Hazmat counts toward the 3-effect cap while carried.
