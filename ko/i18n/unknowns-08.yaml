U-0537:
  question: >-
    언세이프 서클(unsafe circle) 피해 시계: 첫 타격은 진입마다 2 s 뒤입니까(나갈 때 타이머 초기화), 아니면 전역 2 s 위상이 계속됩니까? 서클 중 세이프 존 안쪽 부분과 바깥 부분 사이를 이동하면 초기화됩니까?
  why_it_matters: >-
    가장자리를 스치듯 지나가는 참가자의 피해가 달라집니다. 또한 일반 존 피해의 5 s 유예(U-0003)와도 상호작용합니다.
  readings:
    A: >-
      참가자별 타이머: 피해를 주는 부분에 들어간 뒤 2 s 후 첫 타격, 나가면 초기화
    B: >-
      참가자가 서클 안에 있는 동안 타이머 유지, 존 안쪽 부분과 존 바깥 부분을 오가는 경우에도 유지
    C: >-
      안에 있는 동안 전역 2 s 틱
  resolution_paths:
