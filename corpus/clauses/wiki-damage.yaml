- id: wiki-damage-032
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: Every hit goes through these steps in order.
- id: wiki-damage-033
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '1'
- id: wiki-damage-034
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Immunity
- id: wiki-damage-035
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: If anything blocks the hit, you take nothing.
- id: wiki-damage-036
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '2'
- id: wiki-damage-037
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Kick live bonus
- id: wiki-damage-038
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: If the attacker is live on Kick, their own bow, staff, knife, long sword, axe, machete, drone, C4, landmine, fake chest and trapped gift hits deal 10% more, rounded down.
- id: wiki-damage-039
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '3'
- id: wiki-damage-040
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Mirror
- id: wiki-damage-041
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: A Mirror forcefield sends the whole hit back to the attacker instead, before any reduction.
- id: wiki-damage-042
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '4'
- id: wiki-damage-043
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Reductions
- id: wiki-damage-044
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: A Protection contestant takes 50% less from a nuke.
- id: wiki-damage-045
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: The damage left is rounded down.
- id: wiki-damage-046
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: Being live on Kick then takes off 10%, rounded down.
- id: wiki-damage-047
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '5'
- id: wiki-damage-048
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Minimum
- id: wiki-damage-049
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: A hit that gets through always does at least 1 HP.
- id: wiki-damage-050
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '6'
- id: wiki-damage-051
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Fortress
- id: wiki-damage-052
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: A fortress you stand within absorbs up to its remaining durability, whoever built it.
- id: wiki-damage-053
  anchor: order
  section: What happens to a hit
  kind: label
  quote: '7'
- id: wiki-damage-054
  anchor: order
  section: What happens to a hit
  kind: label
  quote: Armor
- id: wiki-damage-055
  anchor: order
  section: What happens to a hit
  kind: sentence
  quote: Body armor absorbs what is left, until it breaks.
- id: wiki-damage-056
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Shield or a Safety Bubble does not stop poison from landing, but blocks each poison step while it lasts.
- id: wiki-damage-057
  anchor: notes
  section: Good to know
  kind: sentence
  quote: See Poison.
- id: wiki-damage-058
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Shield does not block zone, unsafe circle or robot damage.
- id: wiki-damage-059
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Safety bubble and a Reality Shield do.
- id: wiki-damage-060
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A vulnerable contestant gets no protection from a Shield or a Safety Bubble.
- id: wiki-damage-061
  anchor: notes
  section: Good to know
  kind: sentence
  quote: See the Vulnerability Dart.
- id: wiki-damage-062
  anchor: notes
  section: Good to know
  kind: sentence
  quote: The Protection sigil is not immune to nukes, but takes 50% less from them.
- id: wiki-damage-063
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Flak jacket blocks the next missile, nuke, airstrike impact or gunship bomb, then is used up.
- id: wiki-damage-064
  anchor: notes
  section: Good to know
  kind: sentence
  quote: It does not block airstrike fire.
- id: wiki-damage-065
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A hit already blocked by something else does not use it up.
- id: wiki-damage-066
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Gas mask blocks tear gas.
- id: wiki-damage-067
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A sleeping contestant within 15m (49ft) of their own Sleeping Bag is immune to all damage except zone, unsafe circle and robot damage.
- id: wiki-damage-068
  anchor: notes
  section: Good to know
  kind: sentence
  quote: You are hit by your own C4 and landmine if you stand in the blast.
- id: wiki-damage-069
  anchor: notes
  section: Good to know
  kind: sentence
  quote: A Mirror Forcefield is used up by the first attack it reflects.
- id: wiki-damage-070
  anchor: notes
  section: Good to know
  kind: sentence
  quote: It only reflects Poison Darts, fake gravestones, bows, wizard staffs, knives, long swords, Zarok's axes, machetes, drones, C4, landmines, flashbangs and fake chests, and never your own explosives.
- id: wiki-damage-071
  anchor: notes
  section: Good to know
  kind: sentence
  quote: Body Armor works on every kind of damage.
- id: wiki-damage-072
  anchor: notes
  section: Good to know
  kind: sentence
  quote: You can carry only one.
- id: wiki-damage-073
  anchor: notes
  section: Good to know
  kind: sentence
  quote: 'Death Ward: a Death contestant''s first hit from outside the circle is blocked, and damage from outside the circle is blocked for 2min.'
- id: wiki-damage-074
  anchor: notes
  section: Good to know
  kind: sentence
  quote: Cooldown 2h.
