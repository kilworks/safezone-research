U-0304:
  question: >-
    인챈트되지 않았을 때 drone, C4, landmine, Poison Dart는 각각 몇 번 사용할 수 있습니까?
  why_it_matters: >-
    위키는 knife, machete, sword, axe, bow의 사용 횟수는 알려 주지만 이 네 가지는 알려 주지 않으며, 인챈트 설명은 보너스 사용 횟수 후에 '소모된다'고 합니다.
  readings:
