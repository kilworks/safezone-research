formal:
  readings:
    A: the k-th purchase (k = 0, 1, ...) costs 40 + 10*k tokens; at most 10 purchases; slots = base + purchases, so at most 13 (base 3), 20 for Endurance (base 10), 12 for Ingenuity (base 2)
  domain: k integer, 0 <= k <= 9
  parameters:
    slot_ladder_start: '40'
    slot_ladder_step: '10'
    slot_purchase_max: '10'
    slot_cap_default: '13'
    slot_cap_endurance: '20'
    slot_cap_ingenuity: '12'
