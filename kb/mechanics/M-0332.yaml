- endurance
- ingenuity
sources:
- url: https://iceposeidon.com/safezone/wiki/merchant#upgrades
  snapshot: '2026-11-11'
  clause: wiki-merchant-033
  quote: 'Inventory slot: starts at 40 blood tokens and costs 10 more for each one you already bought.'
- url: https://iceposeidon.com/safezone/wiki/merchant#upgrades
  snapshot: '2026-11-11'
  clause: wiki-merchant-034
  quote: Buy up to 10 slots, to at most 13 slots, or 20 for Endurance.
