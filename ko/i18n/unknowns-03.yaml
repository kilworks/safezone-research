  readings:
    A: >-
      공유 타이머 하나, 부착 시점에 시작
    B: >-
      종류별(C4, landmine) 타이머 하나씩, 부착 시점에 시작
    C: >-
      공유 타이머, 함정 선물이 작동하거나 제거될 때 시작
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자가 16h 안에 C4를 붙이고 이어서 landmine을 붙이는 장면.
U-0302:
