U-0116:
  question: >-
    독 'Getting poisoned again resets the timer, it doesn't stack': 초기화는 90 s 카운트다운만 다시 시작합니까, 아니면 아직 가해질 남은 총 피해도 복원합니까? 총량은 얼마입니까?
  why_it_matters: >-
