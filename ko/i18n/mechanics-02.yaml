      blockers(Zombie drain) = {Shield: 막음; Safety bubble: 막음; Sleeping Bag: 막음; Necromancy / Repellent: 막음; Body armor: 흡수함}
  domain: >-
    원천 'Zombie drain'의 타격 1회
  notes: >-
    Zombie drain (주기적). 'Necromancy / Repellent'는 Necromancy 시길 또는 Zombie repellent로 해석합니다.
M-0146:
  name: >-
    피해 원천 'Bow'와 이를 막는 수단
  quotes:
  - >-
    | Bow | Shield, Safety bubble, Sleeping Bag, Mirror forcefield (반사), Body armor (흡수)
  readings:
