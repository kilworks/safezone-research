id: M-0612
name: 'Robbed gravestone: once only, never revivable'
family: revival
sigils:
- death
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/death#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-death-010
  quote: Each gravestone can be robbed once, and a robbed gravestone can never be revived.
- url: https://iceposeidon.com/safezone/wiki#death
  snapshot: '2026-11-11'
  clause: wiki-019
  quote: If a Sigil of death player robs your gravestone, or is the first to loot it, you can never be revived.
formal:
  readings:
    A: robbed(g) is a one-way flag; robbed(g) implies not revivable(g) forever
  domain: gravestone g
  parameters: {}
depends_on: []
interacts_with:
- M-0611
label: DOCUMENTED
notes: The overview page and the Death page agree. The intro page speaks of 'robs ... or is the first to loot'; the Death page says looting an item or tokens first counts as a rob.
