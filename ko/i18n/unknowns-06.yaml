U-0432:
  question: >-
    시청자 공격의 동시성: 미사일, 핵, 무리, 최루 가스, 공습, 건십, 현상금, healing circle에 대해 제한이 명시되어 있지 않습니다(cyclops와 illusion만 하나로 제한). 마음대로 중첩할 수 있습니까?
  why_it_matters: >-
    제한 없는 중첩은 총 피해가 가격으로만 제한되게 만듭니다(U-0014).
  readings:
    A: >-
      제한 없이 중첩 가능, Cx-Bucks로 제한
    B: >-
      유형별 제한이 있으나 비공개
  resolution_paths:
  - >-
    상점 페이지와 VOD.
U-0500:
  question: >-
    Piety 'one blood token per 5 HP healed': 나머지는 회복 사건 사이에 이월됩니까(누적 카운터), 아니면 사건마다 내림됩니까?
  why_it_matters: >-
    작은 회복(campfire 초당 1 HP, bandage 틱, Healing 시길의 1 HP 회복, 5/11/23/46 HP 포션)이 토큰을 전혀 주는지를 결정합니다. 사건마다 내림하면 1 HP씩의 잔회복은 0이 될 수 있습니다.
  readings:
    A: >-
      토큰 = floor(H_total / 5), H_total은 시작 이후 누적된 해당 회복 HP(나머지 이월)
    B: >-
      사건당 토큰 = floor(h / 5), 회복 사건마다 나머지를 버림
    C: >-
      B와 같지만 지속 회복(2min 동안 10 HP의 bandage, Campfire 1 HP/s)은 틱마다 하나의 사건이므로 1 HP 틱은 아무것도 주지 않음
  resolution_paths:
  - >-
    VOD: 여러 번의 회복에 걸쳐 Piety 참가자의 블러드 토큰 카운터를 관찰합니다. 연속된 3 HP 회복 두 번은 합계 토큰 1개(A) 또는 0개(B, C)를 줍니다.
  - >-
    REA: 배포된 서버 로직의 토큰 지급 코드(클라이언트 코드에는 없음, RE-0001).
U-0501:
  question: >-
    Piety 토큰 카운터: 'HP healed'는 포션의 명목상 수치를 뜻합니까, 실제로 회복된 HP를 뜻합니까, 그리고 +15% 보너스가 포함됩니까?
  why_it_matters: >-
    최대 HP에 가까운 Piety 참가자는 거의 HP를 얻지 못한 채 포션을 마실 수 있습니다. 포션당 토큰 수확량이 최대 9개까지 달라집니다(gigantic potion).
  readings:
    A: >-
      실제로 회복된 HP(최대 HP로 제한), +15% 보너스 적용 후
    B: >-
      +15% 보너스 적용 후의 명목 회복량(초과 회복 포함)
    C: >-
      보너스 적용 전의 명목 회복량(원래 등급 값 5/10/20/40, 초과 회복 포함)
    D: >-
      실제로 회복된 HP, 보너스는 포함하지 않음
  resolution_paths:
  - >-
    VOD: 여러 번의 회복에 걸쳐 Piety 참가자의 블러드 토큰 카운터를 관찰합니다. 최대 HP일 때와 최대치보다 1 HP 낮을 때 포션을 마시고 토큰 증가량을 비교합니다.
  - >-
    REA: 회복 처리 코드.
U-0502:
  question: >-
    Piety 'from any source except revives, Campfires and healing circles included': Campfire와 healing circle은 집계됩니까(부활만 제외), 아니면 부활과 함께 제외됩니까?
  why_it_matters: >-
    끝의 'included'라는 구절은 예외 목록에 붙거나 집계되는 출처에 붙습니다. 'healing circle'이라는 용어는 코퍼스의 다른 곳에는 나오지 않습니다. Ingenuity Campfire 옆에 서 있는 것이 Piety 토큰을 주는지 여부가 달라집니다.
  readings:
    A: >-
      부활을 제외한 모든 회복이 집계됨. Campfire 회복과 healing circle은 명시적으로 포함
    B: >-
      부활, Campfire, healing circle이 모두 제외됨. 그 밖의 모든 것은 집계
  resolution_paths:
  - >-
    VOD: Campfire로 회복되는 Piety 참가자, 회복 전후의 토큰 카운터.
  - >-
    주최 측의 발표.
