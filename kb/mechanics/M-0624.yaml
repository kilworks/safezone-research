    A: actions {trade, loot_gravestone, drop_item, pickup_dropped_item} disabled; {destroy_item, claim_chest, take_crate, claim_care_package} enabled
    B: A, and incoming trade offers from others also refused
  parameters: {}
depends_on: []
interacts_with: []
