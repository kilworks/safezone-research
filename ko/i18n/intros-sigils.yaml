"sigil:piety": |
  Piety는 "포션 비축가" 계열이라고 생각하면 됩니다. 모든 참가자는 시길, 곧 일종의 직업을 하나 고르는데, Piety는 체력 포션과 그것을 바꿔 얻을 수 있는 블러드 토큰을 중심으로 만들어져 있습니다. 기본 수치는 기본값보다 조금 좋아서 최대 HP 110과 인벤토리 슬롯 3개이며 (M-0500), Upgrade 사다리로 이 최대치를 200 대신 220까지 올릴 수 있습니다 (M-0333).

  핵심 흐름은 단순합니다. 포션은 15% 더 회복시키며 소수점은 내림 처리되고 (M-0505), 모든 포션이 슬롯 하나를 함께 쓰며 최대 6개까지 쌓입니다 (M-0506). 상자와 보급 상자도 이 방향으로 치우쳐 있습니다. 획득한 아이템 상자마다, 그리고 가져가는 크레이트마다 안에 든 아이템 대신 무작위 체력 포션을 1개 얻습니다 (M-0503). 상인의 보급 상자는 바뀌지 않습니다 (M-0503).

  Piety에게는 돈 버는 면도 있습니다. 부활을 제외한 모든 출처에서 HP를 5 회복할 때마다 블러드 토큰 1개를 얻습니다 (M-0501). 또는 포션을 마시는 대신 토큰으로 바꿀 수 있습니다. 작은, 중간, 큰, 거대한 포션은 각각 토큰 1, 2, 3, 4개이며, 바꾼 포션은 회복으로 계산되지 않습니다 (M-0502).

  특정한 골칫거리 하나로부터도 보호받습니다. Greed 플레이어는 당신에게서 훔칠 수 없습니다 (M-0507). 주의할 점은 가짜 상자의 함정은 여전히 당신에게 작동하며, 그 상자에서는 포션을 얻지 못한다는 것입니다 (M-0504).

  규칙상 가장 강한 점은 6개 중첩 (M-0506), 절도 면역 (M-0507), 그리고 포션과 토큰 중 고를 수 있는 유연성 (M-0502)입니다.

  가장 약하거나 가장 불확실한 점은 상자 관련 규칙이 조건부일 뿐이라는 것인데, 상자 규칙 자체가 빠져 있기 때문입니다 (U-0015). 얻는 포션의 크기가 어떻게 정해지는지 (U-0504), 다른 보급 상자도 전환되는지 (U-0505), 이미 중첩이 가득 찼을 때 어떻게 되는지 (U-0506)는 미해결입니다.

  일부 수치는 아직 확정되지 않은 표현에도 좌우됩니다. 토큰 계산기가 회복 사이에 남은 HP를 이어서 계산하면, 회복마다 따로 내림하는 경우보다 더 많이 얻게 됩니다. 이는 미해결입니다 (U-0500). Campfire와 회복 서클(healing circle)이 토큰에 포함되는지는 미해결입니다 (U-0502). 15% 보너스가 토큰을 계산할 때 반영되는지 (U-0501), 그리고 정확히 무엇이 내림되는지 (U-0503)도 미해결입니다. 마지막으로, Ingenuity 방식의 추가 요금을 고려할 때 Piety 플레이어의 Max HP 업그레이드 가격이 얼마인지 불분명하며 (U-0322), 구매가 HP도 10 회복시키는지는 미해결입니다 (U-0331).

"sigil:greed": |
  Greed는 "도둑이자 수집가" 계열입니다. 튼튼함을 내주고 수입을 얻습니다. 최대 HP는 기본보다 10 낮은 90이고 인벤토리 슬롯은 3개입니다 (M-0508). 남들이 가진 것을 가져가고, 상자에서 보통보다 더 많이 챙기는 사람이 되는 것이 요점입니다.

  대표 기술은 Steal입니다. 10 m (33 ft) 이내의 참가자에게서 원하는 아이템을 1개 가져옵니다. 장착한 무기와 착용한 Body Armor는 가져갈 수 있고 Sleeping Bag은 가져갈 수 없지만, 잠든 사람에게서는 훔칠 수 있습니다 (M-0509). 훔치기에 성공하면 블러드 토큰 5개를 얻으며, 이 보상은 피해자 한 명당 24시간에 한 번이고 쿨다운은 30분입니다 (M-0510). 그러니 사람들 사이를 돌아다니며 서로 다른 사람들에게서 가져가는 플레이가 됩니다.

  나머지 절반은 상자입니다. 상자를 획득하거나 크레이트를 열고 가져가는 것을 2배 먼 거리에서 할 수 있습니다 (M-0512). 진짜 상자를 획득할 때마다, 그리고 크레이트를 가져갈 때마다 돈주머니에 블러드 토큰 1개가 추가됩니다 (M-0514). 또한 진짜 상자를 획득할 때마다 25% 확률로 20분 동안 Shield를 얻으며, 취약한 상태에서는 굴림이 없습니다 (M-0513).

  실제로 해 보면 작지만 꾸준한 급여를 받는 소매치기, 그리고 조금 약한 몸이라는 느낌일 것입니다 (M-0508).

  규칙이 분명히 밝히는 한계는 다음과 같습니다. Piety 플레이어에게서는 훔칠 수 없고 (M-0507), Fortress 보호는 훔치기를 막습니다 (M-0511). 이것들이 Greed가 취약한 부분이며, 90 HP (M-0508)는 분명한 대가입니다.

  불확실한 부분은 다음과 같습니다. 상자와 크레이트 수치는 모두 위키에서 더 이상 찾을 수 없는 상자 규칙에 의존하며 (U-0015), 2배가 되는 기본 사거리도 여기에 포함됩니다 (U-0510). 24시간 제한이 보상만 제한하는지 훔치기 자체를 제한하는지는 미해결입니다 (U-0507). 30분 쿨다운이 언제 시작되는지는 미해결입니다 (U-0508). 인벤토리가 가득 찬 상태에서 훔치거나 이미 방어구를 입은 상태에서 방어구를 가져가면 어떻게 되는지는 미해결입니다 (U-0509). 돈주머니가 일반 잔액인지 별도 저장소인지 (U-0512), 그리고 이미 Shield가 있는데 상자 Shield가 걸리면 어떻게 되는지 (U-0511)도 미해결입니다. Fortress의 경우 지속 시간과 이동 가능 여부가 미해결입니다 (U-0526).

"sigil:ingenuity": |
  Ingenuity는 "발명가" 계열입니다. 시작은 조금 빠듯해서 최대 HP 100, 인벤토리 슬롯 2개, 고유 조합 전용 슬롯 5개를 가지며 (M-0515), 상인에게서 10% 더 지불하고 소수점은 올림 처리됩니다 (M-0516). 그 대신 다른 누구에게도 없는 도구를 얻습니다. 조합, 함정이 든 선물, 그리고 좋은 눈입니다.

  조합은 아이템 2개를 합쳐 새로운 것을 만듭니다. Landmine과 Drone은 Robot이 되고, Guardian angel과 Health potion은 Campfire가 되며, Anti poison과 Health potion은 Everything potion이 되고, Safety bubble과 Zombie repellent는 Zombie killer가 되며, EMP와 Mirror forcefield는 Black hole이 되고, Shield와 Body armor는 Fortress가 됩니다 (M-0522). 재료 2개가 모두 소모되는지는 미해결입니다 (U-0517). 조합품은 거래, 훔치기, 루팅이 불가능하며, 좀비 타격에 40% 확률로 파괴될 수 있습니다 (M-0520). 이 굴림이 어떻게 작동하는지는 미해결입니다 (U-0518).

  얻는 것은 다음과 같습니다. Robot은 10 m 이내의 다른 플레이어를 2초마다 1 HP씩 10분 동안 타격합니다 (M-0523). Campfire는 10 m 이내의 모든 사람을 하나의 공유 풀에서 회복시킵니다 (M-0525). Everything potion은 독을 치료하고 등급에 따라 회복시킵니다 (M-0526). Zombie killer는 근처의 다음 좀비 10마리를 죽이고 그동안 그들의 흡수를 멈춥니다 (M-0527). Black hole은 200 m 이내의 모든 상자와 크레이트를 파괴합니다 (M-0528). Fortress는 20 m 이내의 사람들을 최대 30 HP까지 보호하고 Greed의 훔치기를 막습니다 (M-0529).

  그 밖의 기술이 있습니다. 함정이 든 선물로 아이템에 landmine 또는 C4를 부착할 수 있으며 16시간에 한 번 가능합니다 (M-0519). 가짜 상자와 묘비를 알아보고, 함정을 보고, 50 m 이내의 landmine 또는 C4를 해킹할 수 있습니다 (M-0517). 같은 포션 2개를 합쳐 다음 크기의 포션으로 만들 수 있습니다 (M-0518).

  기록된 바로는 가장 강한 점은 도구의 폭, 그리고 함정과 가짜에 대한 지식입니다 (M-0517). 좀비의 흡수는 Zombie killer를 통해 잘 대처하는 한 가지입니다 (M-0527).

  가장 약한 점은 빠듯한 시작 (M-0515), 추가 요금 (M-0516), 그리고 깨지기 쉬운 조합품 (M-0520)입니다.

  알려지지 않은 것이 많습니다. 추가 요금이 업그레이드 사다리에도 적용되는지는 미해결입니다 (U-0322). 가격 계산에 정확한 산술을 쓰는지 부동소수점을 쓰는지에 따라 일부 가격이 토큰 1개씩 달라지며, 이는 미해결입니다 (U-0006). Shield와 Sleeping Bag이 Robot의 피해를 막는지에 대해서는 위키 안에서도 서로 어긋납니다 (M-0524, C-0500). Fortress의 풀은 공유일 수도 1인당일 수도 있고 (U-0524), 지속 시간은 미해결입니다 (U-0526). Black hole은 즉발일 수도 지속형일 수도 있습니다 (U-0523). 해킹에는 명시된 효과가 없습니다 (U-0514).

"sigil:trolling": |
  Trolling은 "장난꾼" 계열입니다. 최대 HP 100과 인벤토리 슬롯 3개로 수치는 평범하며 (M-0530), 정체성 전체가 다른 사람들의 삶을 성가시게 만들고 그 피해에 대한 대가를 받는 것입니다 (M-0531).

  장난은 세 종류입니다. 가짜 상자는 보급 상자처럼 보이며, 이동하는 1시간 구간(rolling hour)마다 최대 2개를 놓을 수 있고 각각 1시간 뒤에 사라집니다 (M-0532). 그것을 획득한 사람은 5 HP의 피해를 입고 1시간 동안 상자를 획득할 수 없으며, 당신은 5 HP를 회복합니다. Shield는 피해는 막지만 획득 금지는 막지 못합니다 (M-0533). 피해자에게 Mirror가 있으면 반사된 가짜 상자가 대신 당신의 획득을 막습니다 (M-0238). fake gravestone은 탈락한 참가자의 묘비를 복제하며, 이를 루팅하려는 참가자는 각각 한 번씩 중독됩니다. 하나를 설치한 뒤 2시간을 기다려야 합니다 (M-0534). 언세이프 서클(unsafe circle)은 세이프 존 안에 20분 동안 설치할 수 있는 50 m (164 ft)의 원이며 쿨다운은 2시간이고, 설치할 때 당신을 포함해 살아 있는 사람이 안에 있어서는 안 됩니다 (M-0535).

  서클 안에서는 세이프 존 안에 함께 있는 누구든 유예 시간 없이 2초마다 1 HP의 피해를 입습니다 (M-0536). 첫 타격 뒤에는 그 안에 머물며 면역이 없는 동안 5초마다 무작위 방어 아이템 또는 고유 조합품 하나를 잃기도 합니다 (M-0537). Guardian angel, Safety bubble, Reality Shield, Death Ward는 이를 막고 Shield는 막지 못합니다 (M-0538).

  블러드 토큰도 얻습니다. 다른 플레이어에게 준 피해 5 HP마다 1개, 부순 크레이트 하나마다 1개입니다 (M-0531). 그리고 시청자의 보급 상자가 3% 확률로 대신 당신 옆에 떨어집니다 (M-0539).

  기록된 바로는 가장 강한 점은 서클이 세이프 존을 방어가 닳아 없어지는 곳으로 바꾼다는 것 (M-0537), 그리고 가짜 상자가 피해자에게 HP와 상자 접근을 모두 앗아간다는 것입니다 (M-0533). 가장 약한 점은 수치 보너스가 없다는 것 (M-0530), 그리고 알맞은 방어를 가진 피해자는 서클을 그냥 무시한다는 것입니다 (M-0538).

  알려지지 않은 것은 다음과 같습니다. Reality Shield가 서클을 막는지에 대해 위키가 서로 어긋납니다 (M-0538, C-0502). 3% 전환이 모든 보급 상자에 적용되는지 시청자의 것에만 적용되는지에 대해서도 어긋납니다 (M-0432, C-0403). 50 m가 반지름인지 지름인지 (U-0535), 쿨다운이 설치 시점에 시작되는지 (U-0536), 토큰 계산에서 준 피해가 정확히 무엇인지 (U-0529), 가짜 상자 설치 한도가 이동 구간 방식인지 다시 채워지는 방식인지 (U-0530), 획득 금지가 무엇까지 막는지 (U-0531)는 미해결 질문입니다.

"sigil:death": |
  Death는 "무덤 도굴꾼" 계열입니다. 수치는 평범한 편으로 최대 HP 100과 인벤토리 슬롯 3개이며 (M-0602), 다른 사람들이 죽을수록 강해집니다. 이것을 고르는 플레이어는 기본적으로 이 이벤트가 많은 시신을 낳을 것이라는 데 거는 셈입니다.

  중심 행동은 묘비 털기입니다. 10 m (33 ft) 이내에서 묘비를 털어 최대 HP의 5%를 회복할 수 있으며, 빈 묘비도 털 수 있습니다. 그 안의 아이템이나 블러드 토큰을 가장 먼저 루팅하는 것도 털기로 계산됩니다 (M-0611). 묘비 하나는 한 번만 털 수 있고, 털린 묘비는 다시는 부활시킬 수 없습니다 (M-0612). 다른 플레이어가 체감할 부분이 이것입니다. Death 플레이어가 당신의 묘비를 털거나 가장 먼저 루팅하면 당신은 다시는 부활할 수 없습니다 (M-0116).

  Death는 탈락에서도 힘을 얻습니다. 묘비 하나를 털 때마다 블러드 토큰 10개를, 다른 참가자가 죽을 때마다 1개를 얻습니다 (M-0610). 참가자가 당신으로부터 50 m (164 ft) 이내에서 죽으면, 지금까지 탈락한 참가자 수(그 참가자 포함)만큼 1 HP씩 회복합니다 (M-0613). 이벤트 후반에는 상한이 걸립니다. 참가자의 20% 이하가 살아 있을 때는 이 회복으로 최대 HP의 60%를 넘길 수 없습니다 (M-0614).

  방어에는 Death Ward가 있습니다. 서클 바깥에서 오는 첫 타격이 막히고 2분 동안 보호받으며 쿨다운은 2시간입니다 (M-0615). 피해 문서는 같은 능력을 더 좁게 서술합니다 (M-0137, C-0103, C-0600).

  기록된 바로는 가장 강한 점은 피해자의 부활 가능성에 영구적인 해를 입힌다는 것 (M-0116), 그리고 사망자 수에 따라 커지는 회복입니다 (M-0613). 가장 약한 점은 이벤트 후반에 회복에 상한이 걸린다는 것 (M-0614), 그리고 근처에 시신이 필요하다는 것입니다 (M-0613).

  알려지지 않은 것은 다음과 같습니다. 최대 HP가 100이 아닐 때 5% 회복의 끝수 처리 방식 (U-0600)이 있습니다. "지금까지 탈락"이 무엇을 뜻하는지, 부활한 참가자가 여전히 포함되는지 (U-0601), 20% 기준이 어떻게 계산되는지 (U-0602), 이미 60%를 넘은 상태에서 상한이 어떻게 작동하는지 (U-0603)는 미해결입니다. 다른 참가자의 죽음에 따른 토큰에 거리 제한이 있는지는 미해결입니다 (U-0605). Ward의 경우 쿨다운이 언제 시작되는지 (U-0604, U-0119), 그리고 서클 바깥뿐 아니라 언세이프 서클도 막는지 (U-0604)가 미해결입니다.

"sigil:endurance": |
  Endurance는 "일정에 맞춰 움직이는 짐꾼" 계열입니다. 가장 큰 차이는 공간으로, 인벤토리 슬롯이 3개가 아니라 10개이며 (M-0620, M-0603), 최대 HP는 보통의 100입니다 (M-0603). 슬롯 업그레이드 사다리로 Endurance는 20 슬롯에 이를 수 있으며, 일반적인 경우는 13입니다 (M-0332).

  두 번째 특징은 알아서 찾아오는 배달입니다. 2h 30min마다 각 Endurance 참가자로부터 10 m (33 ft) 이내에 보급 상자가 떨어지며, 30초 뒤에 착지합니다 (M-0621). 여기에는 체력 포션이나 drone이 들어 있지 않습니다 (M-0621). 누구든 획득할 수 있지만, 자기 것을 획득하면 블러드 토큰 6개를 얻고 (M-0622), 아이템 사용 5회마다 1개를 더 얻습니다 (M-0623).

  이 모든 것의 대가는 여러 제한입니다. 거래, 묘비 루팅, 아이템 버리기, 떨어진 아이템 줍기를 할 수 없습니다. 아이템 파괴, 상자 획득, 크레이트 가져가기는 여전히 가능합니다 (M-0624). 그래서 Endurance는 플레이어 사이의 아이템 경제에 참여할 수 없고 죽은 자를 루팅할 수도 없습니다.

  플레이어가 느낄 것은 넓은 가방, 정해진 리듬으로 꾸준히 흘러드는 수입, 그리고 게임의 사회적인 부분에서 조금 벗어나 있다는 느낌입니다. 노출되는 순간은 착지 때입니다. 보급 상자는 착지하면 누구에게나 열려 있으므로 (M-0621), 상자는 다른 사람들이 올 수 있는 지점을 알려 줍니다.

  기록된 바로는 가장 강한 점은 슬롯 수 (M-0603)와 예측 가능한 수입 (M-0622)입니다. 가장 약한 점은 거래와 루팅이 없다는 것 (M-0624), 그리고 보급 상자를 다른 사람들이 획득할 수 있다는 것입니다 (M-0621).

  알려지지 않은 것은 다음과 같습니다. 2h 30min의 시계가 언제 시작되는지, 어떤 보급 상자가 자기 것으로 계산되는지 (U-0607)가 있습니다. 고정된 시계인지 획득 뒤에 다시 시작되는지는 미해결입니다 (M-0621, U-0607). 아이템 사용에 대한 추가 토큰이 언제 지급되는지 (U-0608), 무엇이 아이템 사용으로 계산되는지 (U-0609)도 미해결입니다. 거래 금지가 제안이나 선물을 받는 것까지 막는지도 미해결입니다 (U-0610). 슬롯 사다리의 가격과 카운터도 미해결입니다 (U-0329).

"sigil:necromancy": |
  Necromancy는 "좀비 주인" 계열입니다. 수치는 평범한 편으로 최대 HP 100과 인벤토리 슬롯 3개이지만 (M-0604), 좀비를 자신을 위해 일하게 만드는 유일한 시길입니다. 좀비는 보통 모두에게 위협이지만, Necromancer에게는 힘의 원천이며, 이 시길은 좀비에 대해 완전한 면역을 줍니다 (M-0636).

  좀비는 네 가지 방식으로 찾아옵니다. 서 있는 자리에 하나를 소환할 수 있고, 6시간마다 최대 3번입니다 (M-0631). 참가자가 죽으면 당신으로부터 10 m (33 ft) 이내에 당신의 좀비가 나타납니다 (M-0632). 시청자가 호드를 보내면 당신 몫의 좀비 5마리도 얻습니다 (M-0634). 그리고 참가자가 당신으로부터 50 m (164 ft) 이내에서 죽으면, 가드 좀비가 그 묘비로부터 10 m 거리에 1시간 동안 서서, 10 m 이내의 모두에게서 5초마다 2 HP를 흡수하며, 참가자당 최대 30 HP까지입니다 (M-0633).

  당신이 가진 좀비는 5 m (16 ft) 이내의 참가자에게서 10초마다 1 HP를 흡수하며, 좀비 하나당 참가자별로 최대 30 HP까지이고, 그 HP는 당신에게 갑니다 (M-0635). 또한 당신의 좀비가 나타날 때마다 블러드 토큰 1개, 좀비가 흡수한 HP 1마다 1개를 얻습니다 (M-0630).

  플레이에서는 느리게 퍼져 가는 위협처럼 느껴질 것입니다. 사람이 죽을수록 좀비가 늘고, 그 근처를 지나는 누구에게서든 더 많은 HP를 빼앗습니다. 당신의 경호원은 좀비 그 자체입니다. 다른 누구도 면역이 아니기 때문입니다 (M-0636).

  기록된 바로는 가장 강한 점은 면역 (M-0636)과 사망자 수에 따라 커지는 구조입니다 (M-0632, M-0633). 가장 약한 점은 사건, 곧 죽음, 호드, 제한된 소환에 의존한다는 것 (M-0631), 그리고 수치 보너스가 없다는 것입니다 (M-0604).

  알려지지 않은 것은 다음과 같습니다. 소환, 죽음, 호드 보너스로 생긴 좀비가 얼마나 오래 살아 있는지 (U-0612), 소환 제한이 이동 구간인지, 고정 구간인지, 충전식인지 (U-0428, U-0611)가 있습니다. 가드 좀비와 호드 보너스 좀비가 흡수한 HP를 당신에게 보내는지, 토큰으로 계산되는지 (U-0614), 그리고 얻는 HP가 피해자가 실제로 잃은 양인지 (U-0613)는 미해결입니다. 30 HP 상한이 좀비의 수명당인지, 조우당인지, 하루당인지 (U-0008), 그리고 면역이 다른 Necromancer의 좀비에도 적용되는지 (U-0616)도 미해결입니다. 가드 좀비가 쫓아오는지 제자리에 머무는지는 미해결입니다 (U-0429).

"sigil:protection": |
  Protection은 "탱커" 계열입니다. 수치는 평범한 편으로 최대 HP 100과 인벤토리 슬롯 3개이지만 (M-0605), 게임에서 가장 긴 면역 목록을 갖습니다. 독, drone, 미사일, C4, landmine, 함정이 든 선물, 공습과 그 불길, 건십 폭탄, 그리고 Protection 보복입니다 (M-0640). 핵은 막지 못하지만 당신에게는 50% 적게 피해를 줍니다 (M-0643). 소수점은 내림 처리됩니다 (M-0121). 특히 독은 당신에게 닿지 못합니다 (M-0175).

  무적이 되는 것은 아닙니다. 존, 언세이프 서클, robot, 무기, 가짜 상자, 최루 가스, 좀비, 출혈, cyclops, 현상금 피해는 여전히 받습니다 (M-0641). 따라서 이 시길은 시청자가 주도하는 폭발 공격과 독에는 강하지만, 무기를 든 사람이나 줄어드는 존에는 강하지 않습니다.

  대가는 회복에 있습니다. 포션은 50% 적게 회복시키고 (M-0645), 붕대는 1.1x 더 오래 지속됩니다 (M-0646). 그 대신 면역이 보상을 줍니다. drone, 미사일, C4, landmine 타격에는 블러드 토큰 1개, 공습이나 건십 타격에는 1개, 핵 타격에는 20개를 얻지만, 막아 내는 것이 당신 자신의 보호일 때만 그렇습니다 (M-0642).

  능동 기능 두 가지가 당신을 위협으로 만듭니다. 서 있는 자리에 landmine을 2시간에 한 번 설치할 수 있으며, 10 m 이내의 모두에게 15 HP의 피해를 주고 범위 안의 모든 좀비를 죽입니다 (M-0644). 그리고 당신이 죽으면 30 m (98 ft) 이내의 모두가 20 HP의 피해를 입습니다 (M-0647).

  플레이어가 느낄 것은 남들이 폭격당하는 동안의 침착함, 그리고 막히지 않는 것들에서 오는 압박입니다. 기록된 바로는 가장 강한 점은 면역 목록 (M-0640)과 핵 피해 감소 (M-0643)입니다. 가장 약한 점은 포션 불이익 (M-0645), 그리고 존과 무기에 그대로 노출된다는 것입니다 (M-0641).

  알려지지 않은 것은 다음과 같습니다. 50% 포션 감소가 내림인지 올림인지 (U-0618), 어떤 회복이 포션으로 계산되는지 (U-0617)가 있습니다. 붕대가 총량을 더 많이 회복시키는지, 같은 양을 더 긴 시간에 걸쳐 회복시키는지는 미해결입니다 (U-0619). landmine 능력이 선택하는 순간부터 준비되어 있는지는 미해결입니다 (U-0621). 목록에 없는 방어가 토큰을 주는지도 미해결입니다 (U-0620). 끝수 처리가 피해 계산 단계 중 어디에 놓이는지는 미해결이며 (U-0100), 홀수 핵 피해를 어떻게 끝수 처리하는지도 미해결입니다 (U-0402).

"sigil:healing": |
  Healing은 "의무병" 계열입니다. 수치는 평범한 편으로 최대 HP 100과 인벤토리 슬롯 3개이며 (M-0606), 하는 일은 사람들을 살려 두는 것, 되살려 내는 것까지 포함합니다.

  일상적인 도구는 회복 능력입니다. 근처의 참가자를 1 HP 회복시키고 독을 치료하며, Deep Cut 출혈도 멈추고, 쿨다운은 10분입니다 (M-0651). 독은 Anti poison, Healing의 회복, 또는 God's Fruit으로 치료할 수 있으므로, Healing 플레이어는 독에 대한 세 가지 해법 중 하나입니다 (M-0174). 또한 30분마다 1 HP씩 최대 HP까지 자연 회복합니다 (M-0652). 이 느린 자연 회복은 Healing 고유의 것이며 다른 시길의 능력이 아님에 유의하십시오 (M-0652).

  큰 도구는 부활입니다. Healing 참가자는 어떤 시길의 참가자든 부활시킬 수 있으며, 최대 10번까지입니다 (M-0654). 부활은 사망 후 10분 이내에 이루어져야 하고 (M-0655), 부활시키는 쪽이 5 HP를 소모하며, 되살아난 참가자는 5 HP로 돌아옵니다 (M-0656). Healing 플레이어 자신도 더 쉽게 되살아납니다. 당신의 묘비로부터 10 m (33 ft) 이내에 있는 살아 있는 참가자라면 누구든 당신을 최대 2번 부활시킬 수 있습니다 (M-0653).

  수입은 작지만 꾸준합니다. 회복 1번마다 블러드 토큰 1개, 부활 1번마다 20개입니다 (M-0650). 그래서 Healing 플레이어는 수입 대부분을 부활에서 얻습니다 (M-0650).

  플레이어가 느낄 것은 인내심이 필요한 역할이라는 점입니다. 회복은 작고 느리므로 (M-0651), 이 시길의 무게는 부활 (M-0654)과 독 치료 (M-0174)에 놓입니다. 기록된 바로는 가장 강한 점은 어떤 시길이든 부활시킬 수 있다는 것 (M-0654), 그리고 독과 출혈 치료입니다 (M-0651). 가장 약한 점은 회복이 1 HP이고 쿨다운이 10분이라는 것 (M-0651), 그리고 부활에 HP가 든다는 것입니다 (M-0656).

  알려지지 않은 것은 다음과 같습니다. 회복의 사거리 (U-0622), 그리고 자기 자신이나 HP가 가득 찬 대상을 지정할 수 있는지, 그때도 쿨다운이 소모되는지 (U-0623)가 있습니다. 부활 횟수 카운터가 무엇에 붙는지, 곧 이벤트인지, 쌍인지, 대상인지 (U-0107, U-0624), 그리고 Healing이 아닌 참가자를 누가 부활시킬 수 있는지 (U-0108)는 미해결입니다. 누구의 죽음이 10분 창을 시작하는지 (U-0011), 5 HP 비용으로 자신이 죽을 수 있는지 (U-0625)도 미해결입니다. 피해를 입으면 자연 회복 타이머가 초기화되는지도 미해결입니다 (U-0007).
