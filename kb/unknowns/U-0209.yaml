id: U-0209
question: Is the 15 HP of Body armor a depleting pool or a per-hit cap, and how is a partly absorbed hit handled?
why_it_matters: Changes survivability against repeated small hits (zone ticks, poison).
readings:
  A: depleting pool of 15 HP, partial absorption of the last hit
  B: per-hit cap 15 HP, never depleted
resolution_paths:
- 'VOD: armor durability after repeated hits.'
- 'Damage page: ''absorbs what is left, until it breaks'' favors A.'
priority: high
status: resolved
resolution: 'Resolved on 2026-11-13 from the text of the 2026-11-11 snapshot, for its first half: the armor depletes and reading B is refuted. The armor "absorbs what is left, until it breaks" (wiki-damage-055), and its size is a durability that changes: "+10 durability, up to 45" (wiki-merchant-057), then it "loses one durability every twenty minutes, down to 15" (wiki-merchant-058). An armor that is never used up (reading B) cannot break. "Absorbs up to 15 HP of damage" (wiki-items-026) is then the size of a new pool. The second half (how the hit that breaks the armor is split, and whether durability falls by 1 per HP absorbed) is U-0101, which stays open.'
related:
- M-0217
- U-0002
