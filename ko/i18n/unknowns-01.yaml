    시청자 왕관 처치 보너스 'equal to 20% of the attack's purchase price': 반올림 규칙, 'kills'가 최종 처치를 뜻하는지 여부, 그리고 여러 시청자가 보유자를 공격했을 때 어느 공격이 해당되는지.
  why_it_matters: >-
    이 규칙이 없으면 가격(U-0014)을 알게 되더라도 시청자에게 왕관 처치의 가치를 계산할 수 없습니다.
