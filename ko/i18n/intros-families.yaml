family:damage: |
  피해 계열은 한 가지 질문에 답합니다. 무언가가 나를 해칠 때 실제로 얼마나 들어오는가? 위키는 두 가지 도구를 제공합니다. 하나는 피해 출처별로 무엇이 그것을 막는지 나열한 표입니다. 다른 하나는 모든 타격이 순서대로 거치는 7단계 "타격 파이프라인(hit pipeline)"입니다 (M-0117).

  각 단계는 대략 다음과 같습니다. 1단계는 면역입니다. 무엇이든 타격을 막으면 피해를 받지 않습니다 (M-0118). 2단계는 공격자의 Kick 보너스로, 공격자가 Kick 라이브 중이면 목록에 있는 무기의 피해가 10% 늘어나며 내림 처리됩니다 (M-0119). 3단계는 Mirror forcefield로, 타격 전체를 공격자에게 되돌려 보내며 (M-0120) 목록에 있는 출처만 반사합니다 (M-0135). 4단계는 감소 효과를 다룹니다. Protection 참가자는 핵으로부터 받는 피해가 50% 줄고 (M-0121), Kick 라이브 중인 참가자는 10%를 덜 받으며 내림 처리됩니다 (M-0122). 5단계는 통과한 타격이 최소 1 HP의 피해를 준다고 규정합니다 (M-0123). 6단계는 Fortress로, 남은 내구도만큼 흡수합니다 (M-0124). 7단계는 Body armor로, 부서질 때까지 남은 피해를 흡수합니다 (M-0125).

  실제로는 플레이어가 여러 겹으로 보호받습니다. Shield는 존 피해, 언세이프 서클(unsafe circle) 피해, Robot 피해를 막지 못하지만, Safety bubble과 Reality Shield는 막습니다 (M-0128). 취약한 참가자는 Shield나 Safety bubble의 보호를 받지 못합니다 (M-0129). 폭발 범위 안에 서 있으면 자신의 C4와 Landmine에도 맞습니다 (M-0133).

  표에 따르면 각 방어 수단이 효과적인 대상은 다음과 같습니다. Flak jacket은 미사일, 핵, 공습 충격, 건십 폭탄을 막고 (M-0158, M-0159, M-0160, M-0162), Protection은 독, Drone, C4, Landmine 등 여러 가지를 막습니다 (M-0143, M-0153, M-0154, M-0155). Body armor는 거의 모든 행에서 흡수합니다 (M-0125).

  규칙이 불안정한 부분은 다음과 같습니다. 위키는 Robot 피해를 무엇이 막는지에 대해 (M-0524, C-0500), 그리고 Reality Shield가 언세이프 서클을 막는지에 대해 (M-0538, C-0502) 스스로 모순됩니다. 어떤 출처가 파이프라인을 거치는지는 미해결 질문입니다 (U-0002). 끝수 처리 관련 질문도 미해결입니다. Kick 감소 (U-0001)와 "내림"이 적용되는 위치 (U-0100)가 그렇습니다. 방어구가 초과 피해를 통과시키는지 (U-0101), 여러 Fortress가 차례로 흡수하는지 (U-0102), 반사된 타격이 공격자의 파이프라인을 사용하는지 (U-0005), 여러 차단 수단이 적용될 때 어느 것이 사용되는지 (U-0120)도 미해결입니다.

family:economy: |
  경제 계열은 게임의 유일한 화폐인 블러드 토큰에 관한 것입니다. 상인은 아이템, 업그레이드, 인챈트를 블러드 토큰으로 판매하며, 모든 시길이 상인에게서 구매할 수 있고, 각 시길은 저마다 다른 방식으로 토큰을 얻습니다 (M-0320).

  토큰 획득: 최종 처치는 25 블러드 토큰을 주며, 처치자 또는 피해자가 blood crown을 가지고 있었다면 50을 줍니다 (M-0110). 그 외에는 시길마다 고유한 수입이 있습니다. Piety는 회복과 포션 전환으로 얻습니다 (M-0501, M-0502). Greed는 훔치기와 money bag으로 얻습니다 (M-0510, M-0514). Ingenuity는 조합, 해킹, 그 밖의 몇 가지 행동으로 얻습니다 (M-0521). Trolling은 가한 피해와 파괴한 크레이트로 얻습니다 (M-0531). Death는 약탈한 묘비와 다른 죽음으로 얻습니다 (M-0610). Endurance는 자신의 보급 상자와 아이템 사용으로 얻습니다 (M-0622, M-0623). Necromancy는 자신의 좀비와 그들이 흡수한 양으로 얻습니다 (M-0630). Protection은 면역이 타격을 막을 때 얻습니다 (M-0642). Healing은 회복과 부활로 얻습니다 (M-0650).

  지출: 지도에는 최대 한 명의 상인이 있으며, 관리자가 배치하거나 세이프 존에 무작위로 나타나고, 무작위 상인은 15분 동안 머무릅니다 (M-0321). 10 m (33 ft) 이내에서 구매할 수 있으며, 아이템은 빈 인벤토리 칸이 필요합니다 (M-0322). 기본 가격 목록에는 보급 상자 10 블러드 토큰, Anti poison 12, Dual Wield 50이 포함됩니다 (M-0324). 상인의 보급 상자는 무작위 아이템 하나를 인벤토리에 바로 넣어 줍니다 (M-0325). 업그레이드는 단계식입니다. 인벤토리 칸은 40 블러드 토큰에서 시작하며 하나를 살 때마다 10씩 더 비싸지고 (M-0332), 최대 HP +10에도 같은 구조가 적용됩니다 (M-0333). Ingenuity는 10%를 더 내며 올림 처리됩니다 (M-0323).

  플레이어가 느끼는 점: 획득과 구매 사이의 꾸준한 경쟁이며, 시길이 획득 방식을 결정합니다. 기재된 바에 따른 가장 강한 점은 처치 보상 같은 큰 일회성 지급입니다 (M-0110). 가장 약한 점은 많은 수입 규칙이 미해결인 문구에 의존한다는 것입니다.

  알 수 없는 것: 추가 요금이 단계식 가격과 어떻게 맞물리는지 (U-0322), 가격 계산이 정확한 연산인지 부동소수점 연산인지 (U-0006), 칸 카운터와 HP 카운터가 공유되는지 (U-0329)입니다. 누가 crown을 보유한 것으로 치는지 (U-0125)와 "최종" 처치가 무엇인지 (U-0104)는 미해결입니다. 첫 상인이 언제 나타나는지 (U-0319)와 얼마나 오래 자리를 비우는지 (U-0320)도 미해결입니다. 상인의 보급 상자가 무엇을 주는지 (U-0323)와 최대 HP를 더 사면 회복도 되는지 (U-0331)도 미해결입니다.

family:healing: |
  회복 계열은 살아 있는 동안 HP를 되찾는 모든 방법을 다룹니다. (죽음에서 되살리는 것은 대신 부활 계열에 속합니다.) 일반 소모품, 몇 가지 시길 보너스와 페널티, 그리고 Healing 시길 고유의 능력이 있습니다.

  기본은 포션과 붕대입니다. 체력 포션은 등급별로 회복합니다. Small 5 HP, Medium 10 HP, Large 20 HP, Gigantic 40 HP입니다 (M-0207). Eddie의 포션은 도박입니다. 10% 확률로 최대 HP의 50%를 회복하고, 그렇지 않으면 최대 HP의 30%를 잃습니다 (M-0208). 붕대는 2분에 걸쳐 10 HP를 회복하며, 피해를 받아도 중단되지 않습니다 (M-0233). 붕대는 Deep Cut 출혈도 멈춥니다 (M-0234).

  시길은 이 수치를 바꿉니다. Piety의 포션은 15% 더 회복하며 내림 처리됩니다 (M-0505). Protection의 포션은 50% 덜 회복하지만 (M-0645), 붕대는 1.1배의 시간 동안 지속됩니다 (M-0646). Ingenuity는 Campfire를 조합할 수 있는데, 10 m (33 ft) 이내의 모든 사람을 초당 1 HP씩 회복시키며, 회복량은 포션의 회복량과 같은 하나의 공유 풀에서 나옵니다 (M-0525). 또한 독을 치료하고 포션 등급만큼 회복하는 Everything potion도 조합할 수 있습니다 (M-0526). Healing 시길 자체는 근처 참가자를 1 HP 회복시키고, 그 참가자의 독을 치료하고 Deep Cut 출혈을 멈추며, 쿨다운은 10분입니다 (M-0651). 최대 HP까지 30분마다 1 HP를 재생하는 것은 다른 시길이 아니라 Healing 시길입니다 (M-0652).

  플레이어가 느끼는 점: 회복은 대체로 무엇을 들고 다니느냐의 문제입니다. 포션은 빠르고, 붕대는 느리지만 방해받지 않습니다 (M-0233). Eddie의 포션에 담긴 도박은 손실이 크기 때문에 실제 위험입니다 (M-0208).

  효과적인 대상: 붕대와 Healing 시길의 능력은 모두 Deep Cut 출혈을 멈춥니다 (M-0234, M-0651). Healing 능력은 독도 치료합니다 (M-0651).

  기재된 바에 따른 가장 약한 점: 작은 수치입니다. Healing 시길 자체의 회복은 1 HP이고 (M-0651), 재생은 30분마다 1 HP입니다 (M-0652).

  알 수 없는 것: 포션, 붕대 틱, Eddie의 회복이 최대 HP에서 상한이 걸리는지 (U-0203), 붕대 틱 일정 (U-0214), Eddie의 수치가 어떻게 끝수 처리되는지 (U-0204)입니다. Eddie의 손실이 죽음을 일으킬 수 있는지는 미해결입니다 (U-0004). Piety 보너스가 최대 HP 제한 전에 끝수 처리되는지 후에 처리되는지도 미해결입니다 (U-0503). Protection에서 어떤 회복이 포션으로 취급되는지 (U-0617)와 그 끝수 처리 (U-0618)도 미해결입니다. 여러 사람이 있을 때 Campfire 풀이 어떻게 소진되는지 (U-0520)와 피해가 재생 타이머를 초기화하는지 (U-0007)도 미해결입니다.

family:items: |
  아이템 계열은 도구 상자입니다. 무엇을 들 수 있는지, 각 아이템이 무엇을 하는지, 얼마나 오래 지속되는지를 다룹니다. 대부분은 방어이고, 몇 가지 요령이 더해집니다.

  먼저 공간입니다. 아이템은 최대 3개까지 들 수 있고, C4, Landmine, Arrow처럼 중첩되는 것도 있습니다 (M-0200, M-0201). 동시에 활성화할 수 있는 아이템 효과는 최대 3개이며, 한계에 이르면 아이템은 거부되고 그대로 보유합니다 (M-0203, M-0204). Shield, Guardian angel, Mirror forcefield, Anti poison 면역, Flak jacket, Gas mask, Zombie repellent, 소지 중인 Hazmat suit가 이 상한에 포함되고 (M-0205), Safety bubble, 연막탄, 붕대, 조합품, 상인 업그레이드는 포함되지 않습니다 (M-0206).

  방어 수단마다 전문 분야가 있습니다. Shield는 20분 동안 면역을 주지만 취약한 동안에는 사용할 수 없습니다 (M-0215). Safety bubble은 안에 있는 모든 사람을 피해와 좀비에 면역으로 만들며 존 피해도 포함되고 (M-0213), 지속 시간은 10분입니다 (M-0212). Guardian angel은 10분 동안 존 피해에 대한 면역을 줍니다 (M-0210). Mirror forcefield는 다음 공격을 공격자에게 반사하며 (M-0235), 그것으로 소모됩니다 (M-0134). Flak jacket은 다음 미사일, 핵, 공습 충격, 건십 폭탄을 막고 (M-0130), Gas mask는 최루 가스를 막습니다 (M-0131). Body armor는 일정량의 피해를 흡수합니다 (M-0217). Sleeping Bag은 그 주변 15 m 이내에서 자는 사람을 보호합니다 (M-0132).

  요령: 섬광탄은 30 m 이내의 다른 모든 참가자를 30초 동안 눈멀게 하고 (M-0244), 연막탄은 지도를 가리고 50 m 이내의 공격을 20분 동안 막습니다 (M-0226). 열화상 고글은 연기를 투시하고 (M-0231) 환영 복제본을 복제본으로 보여 줍니다 (M-0232).

  효과적인 대상: 폭발물에는 Flak jacket (M-0130), 최루 가스에는 Gas mask (M-0131), 무기 타격에는 Mirror (M-0235)입니다.

  가장 약한 점: Mirror는 목록에 있는 것만 반사하며 시청자나 관리자의 공격, 존, 좀비는 절대 반사하지 않습니다 (M-0241).

  알 수 없는 것과 위키가 모순되는 부분: Shield 제외 대상 (M-0216, C-0202), 함정 선물이 Body armor를 무시하는지 (M-0218, C-0201), Mirror의 목록 (M-0237, C-0200), 자는 동안의 섬광탄 면역 (M-0246, C-0203), 취약한 플레이어에 대한 Safety bubble (M-0214, C-0204), Zombie repellent가 하는 일 (M-0220, C-0205)입니다. 미해결: 여러 Mirror가 어떻게 동작하는지 (U-0215), Body armor 풀이 소진되는지 (U-0209), 두 번째 방어구가 하는 일 (U-0210)입니다. 또한 미해결: Safety bubble의 10 m가 반지름인지 지름인지 (U-0208)와 어떤 다른 아이템이 중첩되는지 (U-0200)입니다.

family:poison: |
  독은 게임에서 서서히 괴롭히는 피해입니다. 큰 한 방이 아니라 무언가가 멈출 때까지 계속 흘러가는 시계입니다. 이 계열은 어떻게 중독되는지, 어떻게 피해를 주는지, 무엇이 그것을 끝내는지를 설명합니다.

  중독되는 방법: Poison dart나 Fake gravestone에 의해 중독될 수 있으며, 그 외에는 없습니다 (M-0173). 중독되면 1분 30초마다 1 HP를 잃습니다 (M-0170). 다시 중독되면 타이머가 초기화되며 중첩되지 않습니다 (M-0171). 독은 모든 피해를 다 주었거나 치료되었을 때만 끝납니다 (M-0172). 따라서 치료하지 않은 독은 천천히 치르는 고정된 총 청구액입니다 (M-0172).

  막는 방법: 독은 Anti poison, Healing의 회복, God's Fruit로 치료할 수 있습니다 (M-0174). Anti poison은 독을 치료하고 10분 동안 독에 면역이 되게 합니다 (M-0221). 다른 보호 수단은 독이 들어오기 전에 작동합니다. Reality Shield는 그 안에 서 있는 동안 새 독을 막고 (M-0177), Protection 시길은 완전히 면역입니다 (M-0175). Mirror forcefield는 Poison Dart나 Fake gravestone을 공격자에게 되돌립니다 (M-0180). Shield나 Safety bubble은 다르게 작동합니다. 독이 들어오는 것은 막지 않지만, 지속되는 동안 각 독 단계를 차단합니다 (M-0136, M-0179).

  플레이어가 느끼는 점: 90초마다 1 HP가 서서히 줄어들며 (M-0170), 총량이 다 치러지거나 치료가 들어올 때까지 이어집니다 (M-0172). 독에 효과적인 수단: 깔끔한 해결에는 Anti poison (M-0221), 영구적인 안전에는 Protection (M-0175), 되돌려 보내는 데에는 Mirror (M-0180)입니다.

  규칙에 적힌 대로 독 자체의 가장 약한 점: 느리고 (M-0170), 중첩되지 않으며 (M-0171), 알려진 대응 수단이 여러 개 있습니다 (M-0174).

  알 수 없는 것: 첫 1 HP가 즉시 들어오는지 첫 간격 이후에 들어오는지 (U-0115)입니다. 두 번째 중독이 카운트다운만 다시 시작하는지 앞으로 남은 피해도 다시 채우는지는 미해결입니다 (U-0116). Shield나 Safety bubble에 막힌 단계가 준 피해로 치는지 독을 지연시킬 뿐인지도 미해결입니다 (U-0117). 자신의 Sleeping Bag에서 자면 새 독을 막는지, 틱을 막는지, 둘 다인지도 미해결입니다 (U-0118). 반사된 독이 공격자 자신의 보호를 통과하는지도 미해결입니다 (U-0005).

family:revival: |
  부활 계열은 참가자가 죽을 때 어떤 일이 일어나는지, 그리고 돌아올 수 있는지를 다룹니다. 여기서 죽음이 항상 끝은 아니지만, 시간은 짧고 몇 가지가 그것을 영구히 닫을 수 있습니다.

  죽으면 마지막으로 확인된 위치에 아이템이 담긴 묘비가 나타납니다 (M-0107). 다른 참가자는 이를 루팅하거나, 죽은 지 10분 이내에 당신을 부활시킬 수 있습니다 (M-0108). 무덤 안의 블러드 토큰은 부활이 가능한 동안 잠겨 있습니다 (M-0109). 부활이 일어나면 부활한 참가자는 묘비에 아직 남은 아이템을 돌려받고 (M-0114), 들어가지 않는 아이템은 묘비에 남습니다 (M-0115).

  누가 부활시킬 수 있는지는 Healing 시길과 연결되어 있습니다. Healing 참가자는 어떤 시길의 참가자든 최대 10회까지 부활시킬 수 있습니다 (M-0113, M-0654). 이는 죽은 지 10분 이내에 이루어져야 하며 (M-0655), 부활시키는 사람은 5 HP를 소모하고 부활한 참가자는 5 HP로 돌아옵니다 (M-0656). 반대로, Healing 참가자의 묘비에서 10 m (33 ft) 이내에 있는 살아 있는 참가자는 누구나 그를 최대 2회까지 부활시킬 수 있습니다 (M-0112, M-0653).

  이를 끝내는 것: Death 시길 플레이어가 당신의 묘비를 약탈하거나 가장 먼저 루팅하면, 당신은 다시는 부활할 수 없습니다 (M-0116). 각 묘비는 한 번만 약탈할 수 있고, 약탈당한 묘비는 영영 부활시킬 수 없습니다 (M-0612). 따라서 플레이어의 관점에서 10분의 시간은 Death 플레이어에 의해 단축될 수 있으며, 그가 도착하기 전에 부활하는 것이 희망입니다 (M-0116).

  기재된 바에 따른 가장 강한 점: Healing 시길의 부활자는 어떤 시길이든 되살릴 수 있습니다 (M-0113). 가장 약한 점: 부활시키는 사람의 비용 (M-0656), 짧은 시간 (M-0655), Death에 의한 영구 차단 (M-0116)입니다.

  알 수 없는 것: 누구의 죽음이 10분의 시간을 시작하는지 (U-0011), 그리고 Healing 참가자가 아닌 사람이 Healing이 아닌 참가자를 부활시킬 수 있는지 (U-0108)입니다. 2회와 10회의 제한이 무엇에 붙어 있는지도 미해결입니다 (U-0107, U-0624). 위키는 Healing 부활 제한도 두 페이지에서 다르게 서술합니다 (C-0105). 잠긴 토큰이 얼마나 오래 잠겨 있는지, 잠금이 끝나면 어떻게 되는지도 미해결입니다 (U-0105). 아이템이 돌아올 때의 용량 규칙이 무엇인지 (U-0109), 무덤이 죽은 장소인지 마지막 GPS 위치인지 (U-0124), 5 HP 비용이 부활시키는 사람을 죽일 수 있는지 (U-0625)도 미해결입니다.

family:sigil: |
  시길은 참가자가 선택하는 클래스이며, 이후 그가 하는 모든 일의 틀을 만듭니다. 이 계열은 시길을 고르는 것에 관한 규칙과 각 시길에 딸린 기본 수치 및 능력을 담고 있습니다. (각 시길의 더 긴 이야기는 해당 페이지에 있습니다.)

  선택 자체: 각 참가자는 이벤트가 시작된 뒤 시길 하나를 고르며 (M-0601), 선택은 최종적입니다 (M-0600). 기한이 있는지, 끝까지 고르지 않은 사람은 어떻게 되는지는 미해결 질문입니다, U-0627.

  기본 수치는 시길이 가장 먼저 바꾸는 것입니다. Piety는 최대 HP 110에 3칸입니다 (M-0500). Greed는 최대 HP 90에 3칸입니다 (M-0508). Ingenuity는 최대 HP 100에 2칸, 그리고 별도의 조합 칸 5개입니다 (M-0515). Trolling, Death, Necromancy, Protection, Healing은 모두 최대 HP 100에 3칸입니다 (M-0530, M-0602, M-0604, M-0605, M-0606). Endurance는 최대 HP 100에 10칸입니다 (M-0603).

  그다음은 능력입니다. Greed는 10 m (33 ft) 이내의 참가자에게서 훔치지만 Piety 플레이어는 예외이며 (M-0509, M-0507), Fortress 보호는 훔치기를 막습니다 (M-0511). Greed는 두 배 먼 거리에서 상자와 크레이트를 확보하기도 합니다 (M-0512). Ingenuity는 가짜 상자와 묘비를 알아보고, 함정을 보며, 50 m 이내의 Landmine이나 C4를 해킹합니다 (M-0517). Death는 묘비 약탈과 근처의 탈락으로 회복하며 (M-0611, M-0613), 후반 상한이 있고 (M-0614) 서클 밖 타격을 막는 Ward(보호막)가 있습니다 (M-0615). Protection은 긴 면역 목록을 가지며 (M-0640), 그럼에도 존, 언세이프 서클, Robot, 무기 피해 등을 받고 (M-0641), 2시간에 한 번 Landmine을 설치할 수 있으며 (M-0644), 죽을 때 30 m 이내의 모든 사람을 응징합니다 (M-0647).

  플레이어가 경험하는 점: 시길을 고르는 것은 이벤트가 어떻게 전개될지에 거는 내기이며, 되돌릴 수 없습니다 (M-0600). 수치 차이는 작으므로 정체성의 대부분은 능력에서 나옵니다 (M-0530, M-0602).

  기재된 바에 따른 시길별 가장 강한 점: Endurance의 칸 수 (M-0603)와 Piety의 최대 HP (M-0500)가 가장 분명한 순수 이점이고, Protection의 면역이 가장 폭넓습니다 (M-0640). 가장 약한 점: Greed의 낮은 HP (M-0508)와 Ingenuity의 더 작은 가방 (M-0515)입니다.

  알 수 없는 것: Greed가 두 배로 늘리는 확보 범위가 얼마나 큰지 (U-0510), 해킹이 무엇을 하는지 (U-0514), Ingenuity의 레시피 6개가 조합 칸 5개에 어떻게 들어가는지 (U-0517), Death의 회복이 어떻게 끝수 처리되고 상한이 걸리는지 (U-0600, U-0602, U-0603), Ward 쿨다운이 언제 시작되는지 (U-0604), Protection의 Landmine이 언제 준비되는지 (U-0621)입니다. 훔치는 쪽에 자리가 없을 때 Greed의 동작도 미해결입니다 (U-0509).

family:viewer: |
  시청자 계열은 관객이 조종하는 게임의 일부입니다. 방송을 보는 시청자는 Cx-Bucks를 써서 세이프 존에 물건을 보냅니다. 참가자를 해치는 무기, 도움이 되는 몇 가지, 그리고 혼란만 일으키는 것들이 있습니다. 가격은 알려져 있지 않습니다 (U-0014).

  공격: 미사일은 세이프 존 안의 한 지점을 겨냥하여 3분 뒤 그 근처의 무작위 지점에 떨어지고, 25 m 이내의 모든 사람이 10 HP의 피해를 받습니다 (M-0403, M-0404). 핵은 1분 뒤 겨냥한 바로 그 지점에 떨어지고, 관리자가 다른 수치를 설정하지 않은 한 100 m 이내의 모든 사람이 20 HP의 피해를 받습니다 (M-0405). 호드(horde)는 20분 동안 세이프 존에 좀비 50마리를 풀어 놓습니다 (M-0408). 최루 가스는 10분 동안 남는 25 m 범위의 구름이며, 안에 있는 사람은 10초마다 2 HP의 피해를 받습니다 (M-0409, M-0410). 공습은 20초 뒤 띠 모양 구역에 5 HP의 피해를 주고, 이후 5분 동안 불탑니다 (M-0412, M-0413). 건십은 5분 동안 지속되며 25 m 이내에 10 HP의 피해를 주는 폭탄을 떨어뜨립니다 (M-0415, M-0416). 현상금은 무작위로 살아 있는 참가자 한 명을 표시하고 (M-0423), 거대 사이클롭스는 200 HP를 가지며 30 m 이내에서 가장 가까운 참가자를 공격합니다 (M-0426).

  대처할 수 있는 것: Protection은 미사일과 건십에 면역입니다 (M-0404, M-0417). Flak jacket은 미사일 하나와 건십 폭탄 하나를 막습니다 (M-0404, M-0417). EMP는 10분 동안 시청자가 미사일, 핵, 호드, 최루 가스, 공습, 건십, 사이클롭스, 현상금을 보내지 못하게 막고 (M-0222), 이미 공중에 있는 것을 파괴합니다 (M-0223). 그러나 EMP에 거부된 시청자 아이템은 환불 없이 사라지며 (M-0224), 이미 지도에 있는 사이클롭스, 현상금, 최루 가스, 좀비는 제거하지 못합니다 (M-0402).

  플레이어가 느끼는 점: 이벤트에는 예측할 수 없는 날씨가 있고, 답은 알맞은 대응 수단을 들고 다니는 것입니다. 기재된 바에 따라 참가자에게 가장 강한 것은 EMP입니다 (M-0222). 가장 약한 것은 EMP가 제거할 수 없는 지속 효과입니다 (M-0402).

  알 수 없는 것: 가격 (U-0014), 공습 띠 구역의 크기 (U-0406, U-0407), 건십 폭탄의 수 (U-0409), 구름과 회복 서클의 크기가 반지름인지 지름인지 (U-0404, U-0413)입니다. EMP 차단이 에어드롭과 회복 서클도 포함하는지는 미해결입니다 (U-0401). 위키는 Trolling의 교란을 두 곳에서 다르게 서술합니다 (M-0432, C-0403, C-0501). 거대 사이클롭스의 보상과 조종은 미해결입니다 (U-0419, U-0421).

family:weapons: |
  무기 계열은 참가자가 다른 참가자를 직접 해치는 데 쓸 수 있는 모든 것입니다. 참가자는 상자, 보급 상자, 크레이트에서 무기를 찾습니다 (M-0300). 근접 무기, 활, 지팡이, Poison Dart는 무기 칸에 들어가며, 무기 칸은 인벤토리 공간을 쓰지 않습니다 (M-0301).

  근접 및 원거리 도구는 저마다 특성이 있습니다. Bow는 20 m 이내에서 5 HP로 타격하고 쿨다운이 5초이며, 발사마다 화살 한 발을 쓰고 부서지지 않습니다 (M-0311). Assassin's knife는 10 m 이내에서 5 HP로 찌르며 2회 사용할 수 있습니다 (M-0316). Long sword는 10 m 이내에서 10 HP로 타격하며 3회 사용할 수 있고 쿨다운은 10초입니다 (M-0319). Zarok's axe는 체력이 가득할 때 5 HP로 타격하고 체력이 떨어질수록 최대 25 HP까지 올라가며 일회용입니다 (M-0317). Huge machete는 10 HP로 타격하고 10회 사용할 수 있으며 관리자만 지급할 수 있습니다 (M-0318). Wizard staff는 자신으로부터 50 m 이내에 5초 동안 지속되는 피해 구역을 만들어 총 10 HP의 피해를 주고 (M-0313), 사용당 블러드 토큰 2개가 들며, 쿨다운은 20분입니다 (M-0314). Poison Dart는 근처 참가자를 30분에 걸쳐 20 HP만큼 중독시킵니다 (M-0315).

  그다음은 폭발물과 Drone입니다. C4는 서 있는 곳에 설치하고 나중에 기폭하며, 자신을 포함해 10 m 이내에 20 HP의 피해를 줍니다 (M-0302). Landmine은 다른 참가자나 좀비가 10 m 이내에 들어오면 작동하여 자신을 포함한 범위 내 모든 사람에게 15 HP의 피해를 줍니다 (M-0307). 둘 다 한 칸에 최대 5개까지 중첩됩니다 (M-0305, M-0310). Drone은 보이는 어떤 참가자든 거리와 관계없이 30초 뒤 10 HP로 공격합니다 (M-0306). Ingenuity는 Robot도 만들 수 있습니다 (M-0523).

  효과적인 대상: Drone은 보이는 누구에게든 닿고 (M-0306), C4와 Landmine은 군중을 응징합니다 (M-0302, M-0307).

  기재된 바에 따른 가장 약한 점: 일회용 및 제한 횟수 무기 (M-0317, M-0316)와 자신의 폭발물에 의한 자해 피해입니다 (M-0302, M-0307).

  알 수 없는 것: Drone, C4, Landmine, Dart의 사용 횟수가 몇 번인지 (U-0304), Dart, axe, machete에서 "근처"가 무엇을 뜻하는지 (U-0309), axe의 피해 곡선이 어떻게 오르는지 (U-0310), 차단되거나 반사된 공격이 사용 횟수를 소모하는지 (U-0308), 쿨다운이 언제 시작되는지 (U-0307)입니다. staff의 10 m가 반지름인지 지름인지는 미해결입니다 (U-0312).

family:zombies: |
  좀비는 지도를 돌아다니며 사람들을 서서히 소모시키는 느리고 끈질긴 해충입니다. 가장 가까운 유효한 참가자를 거리와 관계없이 1.4 m/s로 쫓아가며 (M-0440), 5 m 이내의 모든 참가자에게서 10초마다 1 HP를 흡수합니다 (M-0441). 각 좀비는 참가자 한 명당 최대 30 HP까지만 흡수할 수 있습니다 (M-0442). 또한 10% 확률로 체력 포션 하나를 깨뜨리고 (M-0443), 40% 확률로 조합한 아이템을 파괴합니다 (M-0444). 좀비는 시간이 다 되면 사라집니다 (M-0450).

  출처: 시청자는 세이프 존의 무작위 지점에 좀비 50마리의 호드를 풀어 놓으며, 이 좀비들에게는 주인이 없습니다 (M-0445). Necromancy 참가자는 그 시길에 속하는 자신만의 좀비를 얻습니다. 6시간마다 최대 3회 소환하고 (M-0446), 어느 참가자든 죽으면 좀비 하나가 생기며 (M-0447), 호드가 풀릴 때 5마리가 더 생기고 (M-0448), 묘비에 가드 좀비가 생깁니다 (M-0449). 주인이 있는 좀비는 HP를 흡수하여 Necromancy 주인에게 줍니다 (M-0635).

  대처 방법: 폭발은 그 안의 모든 좀비를 죽입니다. C4, Landmine, 미사일, 핵, 공습, 건십 폭탄, 최루 가스가 그렇습니다 (M-0451). 사정거리 안으로 걸어 들어온 좀비는 Landmine을 터뜨리지만, 좀비는 C4를 터뜨리지 않습니다 (M-0452). Shield, Safety bubble, Reality Shield, 또는 자신의 Sleeping Bag에서 자는 것은 면역을 줍니다 (M-0454). Zombie repellent는 20분 동안 작동합니다 (M-0455). Ingenuity의 Zombie killer는 10 m 이내로 들어오는 다음 좀비 열 마리를 죽이고 그동안 흡수를 멈춥니다 (M-0453, M-0527). Necromancy는 완전히 면역입니다 (M-0636).

  플레이어가 느끼는 점: 좀비는 빠르지도 강하지도 않지만 멈추지 않으며, 그 대가는 조금씩, 조용히 사라지는 포션과 조합품으로 치러집니다 (M-0443, M-0444). 가장 약한 점: 모든 폭발에 죽고 (M-0451), 많은 아이템이 좀비를 막습니다 (M-0454).

  알 수 없는 것: 위키는 repellent가 하는 일이 피해를 무시하는 것인지 멈추는 것인지 (M-0455, C-0402), 그리고 Necromancy가 면역 목록에 있는지 (M-0454, C-0401)에 대해 모순됩니다. 또한 40%가 어떤 조합품에 적용되는지에 대해서도 모순됩니다 (M-0444, C-0404). 미해결: 좀비가 얼마나 오래 사는지 (U-0403), 흡수 타이머가 좀비별인지 참가자별인지 (U-0425), 30 HP 상한이 수명 전체 기준인지 조우당 기준인지 (U-0008), 포션 파손 판정이 어떻게 이루어지는지 (U-0426), 무엇이 참가자를 유효한 대상으로 만드는지 (U-0424)입니다.

family:zone: |
  존 계열은 모두를 움직이게 하고 정직하게 만드는 규칙입니다. 참가자는 세이프 존 안에 머물러야 하며, 이는 휴대폰의 GPS로 추적됩니다. 주최자가 존을 움직일 수 있으므로 크기나 속도가 바뀌거나 심지어 갈라질 수도 있습니다 (M-0100).

  주된 페널티는 단순합니다. 밖에 있으면 5초 뒤부터 2초마다 1 HP의 피해를 받기 시작합니다 (M-0101).

  실제로 밖으로 나가지 않고도 "밖"이 되는 방법이 두 가지 있습니다. 너무 빨리 움직이면 밖에 있는 것으로 칩니다. 1분 평균 20 mph보다 빠르거나 (M-0105), 임의의 15초 구간에서 30 mph보다 빠른 경우입니다 (M-0106). 그리고 마지막으로 알려진 위치가 세이프 존 안이었는데 휴대폰이 GPS 업데이트 전송을 멈추면, 15분 뒤, Kick 라이브 중이면 30분 뒤부터 피해를 받기 시작합니다 (M-0104). Kick 라이브 중인 참가자의 더 긴 오프라인 유예는 같은 규칙을 따로 서술한 것입니다 (M-0103).

  Trolling 시길은 세이프 존의 일부를 위험 구역으로 바꿀 수 있습니다. 언세이프 서클은 세이프 존 안에 20분 동안 놓이며 쿨다운은 2시간입니다 (M-0535).

  어떤 방어 수단이 있을까요? Hazmat suit는 소지하고 있는 동안 존 피해 간격마다 2 s를 늘려 줍니다 (M-0209). Guardian angel은 10분 동안 존 피해에 대한 면역을 줍니다 (M-0210). Safety bubble은 안에 있는 모든 사람을 존 피해를 포함한 피해에 면역으로 만듭니다 (M-0213). Shield는 존 피해를 막지 못합니다 (M-0128).

  기재된 바에 따른 가장 강한 점: 모두에게 똑같이 적용되며 어떤 시길에도 묶여 있지 않습니다 (M-0101). 가장 약한 점: 휴대폰과 GPS에 의존하는데, 이는 플레이어의 잘못 없이 실패할 수 있습니다 (M-0104).

  알 수 없는 것: 첫 틱이 5초에 오는지 7초에 오는지 (U-0003)입니다. 오프라인 유예가 끝난 뒤 어떤 피해가 적용되는지 (U-0110)와 이후 GPS 업데이트가 유예 타이머를 초기화하는지 (U-0111)는 미해결입니다. 속도 평균이 슬라이딩 윈도우, 고정 윈도우, 비율 중 어떤 방식인지 (U-0112)와 속도 규칙이 발동하면 정확히 무슨 일이 일어나는지 (U-0113)도 미해결입니다. 세이프 존이 여러 개일 때 피해가 모든 존의 밖에 있을 때 시작되는지 마지막에 있던 존을 벗어날 때 시작되는지는 미해결입니다 (U-0114). 언세이프 서클의 세부 사항, 즉 반지름인지 지름인지와 쿨다운이 언제 시작되는지도 미해결입니다 (U-0535, U-0536).
