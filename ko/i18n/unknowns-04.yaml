U-0324:
  question: >-
    Vulnerability Dart: 이미 취약한 참가자에게 두 번째 다트를 쓰면 초기화됩니까, 연장됩니까, 아무 일도 없습니까? 10분은 던진 시점부터입니까, 명중한 시점부터입니까?
  why_it_matters: >-
    무방비 구간의 길이를 정합니다. 다트를 반복하면 대상을 영구히 취약한 상태로 둘 수 있습니다.
  readings:
    A: >-
      새 다트가 10 min 타이머를 지금부터 새 10 min으로 초기화함
    B: >-
      새 다트가 10 min을 더함
    C: >-
      이미 취약한 동안에는 효과 없음
  resolution_paths:
  - >-
