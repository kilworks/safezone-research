      세 능력 모두 50 m 이내에서만 작동함
    B: >-
      해킹만 50 m로 제한되고, 가짜 알아보기와 함정 보기에는 명시된 범위가 없음
    C: >-
      알아보기와 보기는 소유자에게 지도 전체에 적용되고, 해킹은 50 m 이내
  sweep_range: >-
    50 m(기재된 대로)에서 지도 전체까지. 하한은 문자 그대로의 50 m입니다
