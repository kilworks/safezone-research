U-0300:
  question: >-
    무기, 함정, 상인, sleeping bag의 범위 경계(10m, 20m, 50m, 15m)는 포함입니까 미포함입니까? 거리는 지면상의 유클리드 거리입니까?
  why_it_matters: >-
    모든 'within Xm'과 'comes within Xm' 문장이 경계에서 달라집니다. 정확히 X 미터에 있는 참가자는 한 해석에서는 타격을 받고 다른 해석에서는 안전합니다.
  readings:
    A: >-
      d <= R일 때, 그리고 그때에만 안쪽 (포함)
    B: >-
      d < R일 때, 그리고 그때에만 안쪽 (미포함)
  resolution_paths:
  - >-
    VOD: C4 또는 landmine으로부터 명시된 반경과 같은 측정 거리에 있는 참가자.
  - >-
    REA: 배포된 거리 비교 코드 (클라이언트 코드에는 서버 로직이 없음, RE-0001).
U-0301:
  question: >-
