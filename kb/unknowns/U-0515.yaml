id: U-0515
question: 'Ingenuity potion combining: what does ''two matching potions'' mean, and are there costs or limits?'
why_it_matters: Heal values add up exactly (5+5=10, 10+10=20, 20+20=40), so combining is lossless for healing but
  saves slots for a 2-slot sigil; the limits are unstated.
readings:
  A: two health potions of the same size give one of the next size (small to medium to large to gigantic); gigantic
    cannot combine
  B: any two potions of the same kind (including Eddie's potion or Anti poison) combine
  C: as A with a cooldown or a cost not stated
resolution_paths:
- 'VOD: an Ingenuity contestant combining potions.'
priority: low
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. The text is "Combine two matching potions into the next size, up to gigantic." (wiki-sigils-ingenuity-009). Sizes are given for health potions ("Heals by tier: Small 5 HP, Medium 10 HP, Large 20 HP, Gigantic 40 HP." (wiki-items-009)), while the clauses on Eddie potion ("A gamble: 10% chance to heal 50% of your max HP." (wiki-items-011)) and Anti poison ("Cures poison and makes you immune to it for 10min." (wiki-items-034)) show no size, so the wording points to reading A rather than reading B. Still open: what counts as matching, and any cost or cooldown (reading C), which no clause states.'
