formal:
  readings:
    A: maxHP = 100; inventory slots = 2; plus 5 separate slots for unique crafts that do not use inventory slots;
      merchant slot upgrades cap at 12 total
    B: the 5 craft slots hold crafts of any recipe, one each (6 recipes exist)
    C: the 5 craft slots hold one craft per recipe type and crafts of one type stack
  domain: integer counts at event start
  parameters:
    max_hp: '100'
    inventory_slots: '2'
    craft_slots: '5'
    slot_cap_with_upgrades: '12'
