    Flak Jackets, Gas Masks, Zombie Repellents, Anti Poisons and Sleeping Bags.
  clause: wiki-sigils-trolling-025
- url: https://iceposeidon.com/safezone/wiki/sigils/trolling#unsafe
  snapshot: '2026-11-11'
  quote: Equipped Body Armor is not safe.
  clause: wiki-sigils-trolling-026
formal:
  readings:
    A: 'from the first hit, every 5 s while inside and not immune: remove one random item from {Shield, Safety Bubble,
      Guardian Angel, Hazmat Suit, Body Armor, Mirror Forcefield, Flak Jacket, Gas Mask, Zombie Repellent, Anti
      Poison, Sleeping Bag} or a unique craft; first loss at t_hit + 5 s'
    B: first loss at the first hit
    C: clock from entry
  domain: 5 s period; random uniform over the held qualifying items (distribution not stated)
  parameters:
    period_s: '5'
    defense_item_types: '11'
    fate: UNKNOWN, see U-0539
    clock_start: UNKNOWN, see U-0538
