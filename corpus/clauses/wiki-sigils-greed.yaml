  anchor: rules
  section: What it does
  kind: sentence
  quote: Fortress protection prevents stealing.
- id: wiki-sigils-greed-009
  anchor: rules
  section: What it does
  kind: sentence
  quote: You can claim chests and open or take crates from 2x as far away.
- id: wiki-sigils-greed-010
  anchor: rules
  section: What it does
  kind: sentence
  quote: Each real chest you claim has a 25% chance to give you a Shield for 20min.
- id: wiki-sigils-greed-011
  anchor: rules
  section: What it does
  kind: sentence
  quote: No roll while you are vulnerable.
- id: wiki-sigils-greed-012
  anchor: rules
  section: What it does
  kind: sentence
  quote: Each real chest you claim and each crate you take adds a blood token to your money bag.
- id: wiki-sigils-greed-013
  anchor: rules
  section: What it does
  kind: sentence
  quote: 'Steal: take one item of your choice from a contestant within 10m (33ft).'
- id: wiki-sigils-greed-014
  anchor: rules
  section: What it does
  kind: sentence
  quote: Cooldown 30min.
- id: wiki-sigils-greed-015
  anchor: rules
  section: What it does
  kind: sentence
  quote: Equipped weapons and worn Body Armor can be stolen.
- id: wiki-sigils-greed-016
  anchor: rules
  section: What it does
  kind: sentence
  quote: Sleeping Bags cannot be stolen, but you can steal from a sleeping contestant.
- id: wiki-sigils-greed-017
