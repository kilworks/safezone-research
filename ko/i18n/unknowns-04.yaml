  readings:
    A: >-
      참가자 자신의 위치에서의 태양시
    B: >-
      이벤트의 기준 위치 한 곳에서의 태양시
    C: >-
      참가자 휴대폰의 현지 시계 시각
  resolution_paths:
  - >-
    주최 측의 발표.
U-0327:
  question: >-
    Sleeping Bag: 65 s의 수면은 연속이어야 합니까? 잠든 사람이 15m 반경을 벗어나거나 깨어나거나 맞으면 어떻게 됩니까? 깨어나면 면역이 즉시 끝납니까?
  why_it_matters: >-
    처음 65 s가 노출 구간입니다. 범위를 벗어나거나 깨어나면 카운터가 초기화되는지가 정해지며, flashbang(섬광탄) 면역과 피해 면역이 여기에 달려 있습니다.
  readings:
    A: >-
      65 s는 연속이어야 함. 15m를 벗어나거나 깨어나면 초기화되고 면역이 끝남
    B: >-
