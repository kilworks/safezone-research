id: M-0632
name: Necromancy death zombie within 10m
family: zombies
sigils:
- necromancy
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/necromancy#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-necromancy-010
  quote: When any contestant dies, a zombie of yours appears within 10m (33ft) of you.
- url: https://iceposeidon.com/safezone/wiki/zombies#sources
  snapshot: '2026-11-11'
  clause: wiki-zombies-008
  quote: when any contestant dies, every living Necromancy contestant gets a zombie within 10m (33ft) of themselves.
formal:
  readings:
    A: for each death of any contestant, each living Necromancy contestant gets one owned zombie within 10 m
  parameters:
    zombie_lifetime_s: UNKNOWN, see U-0612
depends_on: []
interacts_with: []
label: CONDITIONAL
open_unknowns:
