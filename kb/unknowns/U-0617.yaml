id: U-0617
question: 'Protection ''Potions heal you 50% less'': which heals are ''potions'' (health potions, Eddie''s potion, God''s Fruit, bandages, healing circle)?'
why_it_matters: Decides how much healing a Protection contestant can still use.
readings:
  A: health potions of every tier only
  B: health potions and Eddie's potion (a gamble that heals 50% of max HP)
  C: every item heal
resolution_paths:
- 'VOD: Protection contestant using each heal item.'
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. A Campfire is out of the rule: "Piety and Protection potion changes do not apply" (wiki-sigils-ingenuity-021). Bandages have their own line on the Protection page, next to the potion line: "Bandages last 1.1x as long" (wiki-sigils-protection-017); that suggests they are not counted as potions, without saying so. The wording does not choose between readings A and B: Protection says "Potions heal you 50% less" (wiki-sigils-protection-016) where Piety says "Health potions heal you 15% more" (wiki-sigils-piety-013), and two other things are named potions, Eddie''s potion and the Everything potion, which "heals by potion tier" (wiki-sigils-ingenuity-023). Still open: Eddie''s potion, the Everything potion, God''s Fruit and the healing circle.'
