id: U-0205
question: 'Hazmat suit ''+2s per interval'': which damage sources and which timings (first tick, grace) does it lengthen?'
why_it_matters: Changes time to death outside the zone and the value of the suit against unsafe circle and robots.
readings:
  A: only outside-zone interval, 2s -> 4s, first tick unchanged
  B: interval 4s and first tick delayed by 2s
  C: also unsafe circle and robot intervals, which the damage page marks 'slows'
parameter: hazmat_added_interval_s
sweep_range: 0..4 s (page says 2; bound 4 covers a doubling reading)
resolution_paths:
- 'VOD: a Hazmat carrier leaving the zone with an on-screen timer.'
- Robot interval is not on the Items page.
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. Sources settled: the damage table marks "Hazmat suit (slows)" on exactly three rows, Outside the circle, Unsafe circle and Robot (wiki-damage-005, wiki-damage-006, wiki-damage-007), so reading A (outside-zone damage only) is refuted for the list of sources. The amount is written for zone damage only: "While you carry it, each zone damage interval is 2s longer" (wiki-items-013); an unsafe circle deals zone damage (wiki-sigils-trolling-017), the robot interval is on no page. Still open: the first tick and the 5 s delay (with U-0003), and how much a robot is slowed.'
