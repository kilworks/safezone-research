- id: wiki-sigils-protection-008
  anchor: rules
  section: What it does
  kind: sentence
  quote: Immune to poison, drones, missiles, C4, landmines, trapped gifts, airstrikes and their fire, gunship bombs and Protection retribution.
- id: wiki-sigils-protection-009
  anchor: rules
  section: What it does
  kind: sentence
  quote: Still takes zone, unsafe circle, robot, weapon, fake chest, tear gas, zombie, bleeding, cyclops and bounty damage.
- id: wiki-sigils-protection-010
  anchor: rules
  section: What it does
  kind: sentence
  quote: A drone, missile, C4 or landmine hit earns one blood token, and an airstrike or gunship hit earns 1, but only when your own immunity blocks it.
- id: wiki-sigils-protection-011
  anchor: rules
  section: What it does
  kind: sentence
  quote: A nuke hit earns twenty when your damage cut applies.
- id: wiki-sigils-protection-012
  anchor: rules
  section: What it does
  kind: sentence
  quote: A hit already blocked by something else earns nothing.
- id: wiki-sigils-protection-013
  anchor: rules
  section: What it does
  kind: sentence
  quote: Nukes deal 50% less damage to you.
- id: wiki-sigils-protection-014
  anchor: rules
  section: What it does
  kind: sentence
  quote: Place a landmine where you stand once every 2h.
- id: wiki-sigils-protection-015
  anchor: rules
  section: What it does
  kind: sentence
  quote: It deals 15 HP to everyone within 10m (33ft) when another contestant or a zombie steps in, and kills every zombie in range.
- id: wiki-sigils-protection-016
  anchor: rules
  section: What it does
  kind: sentence
  quote: Potions heal you 50% less.
- id: wiki-sigils-protection-017
  anchor: rules
  section: What it does
  kind: sentence
  quote: Bandages last 1.1x as long.
- id: wiki-sigils-protection-018
  anchor: rules
  section: What it does
  kind: sentence
  quote: 'Retribution: when you die, everyone within 30m (98ft) of you takes 20 HP.'
