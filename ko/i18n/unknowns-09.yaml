    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. Campfire는 이 규칙에서 제외됩니다. "Piety and Protection potion changes do not apply"(wiki-sigils-ingenuity-021). 붕대는 Protection 페이지에서 포션 줄 옆에 자체 줄이 있습니다. "Bandages last 1.1x as long"(wiki-sigils-protection-017). 이는 붕대가 포션으로 계산되지 않음을 시사하지만, 그렇다고 명시하지는 않습니다. 문구는 해석 A와 B 중 어느 쪽도 택하지 않습니다. Protection은 "Potions heal you 50% less"라고 하고(wiki-sigils-protection-016) Piety는 "Health potions heal you 15% more"라고 하며(wiki-sigils-piety-013), 포션이라고 불리는 것이 둘 더 있습니다. Eddie의 포션과 "heals by potion tier"인 Everything potion입니다(wiki-sigils-ingenuity-023). 아직 미해결: Eddie의 포션, Everything potion, God's Fruit, 회복 서클.
