U-0626:
  question: >-
    Healing 참가자가 Healing이 아닌 참가자를 부활시키는 범위: Healing 페이지는 Healing 참가자가 부활되는 쪽일 때만 묘비로부터 10m를 제시합니다.
  why_it_matters: >-
    부활 경쟁 모델에 필요합니다.
  sweep_range: >-
    1 ~ 30 m: 1 m는 최소 접촉, 30 m는 명시된 비슷한 범위 중 가장 긴 것(10m)보다 큰 값입니다.
  resolution_paths:
  - >-
    VOD: 측정된 거리에서의 부활.
U-0627:
  question: >-
    시길 선택: 이벤트 시작 이후 마감 시한이 있습니까, 그리고 선택하지 않은 참가자에게는 무엇이 적용됩니까(기본 능력치, 능력 없음)?
  why_it_matters: >-
    지연은 시길의 패시브 타이머와 능력을 잃게 하며, 선택하지 않으면 참가자가 시길 효과 없이 남을 수 있습니다.
  sweep_range: >-
    0 ~ 이벤트 지속 시간(U-0009): 0은 선택이 이벤트 시작 시점에 이미 끝나 있음을 뜻하고, 상한은 가능한 가장 긴 지연입니다.
  resolution_paths:
  - >-
    주최자의 발표, 선택 화면이 담긴 VOD.
