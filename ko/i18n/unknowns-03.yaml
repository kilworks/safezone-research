    1에서 3회 사용. 인챈트 설명은 인챈트된 C4, landmine, drone이 1회, dart가 2회라고 하므로 1이 자연스러운 하한이고 3은 knife/long sword 규모를 포함
  resolution_paths:
  - >-
    VOD: 각 아이템의 사용 장면.
  - >-
    주최 측의 발표.
U-0305:
  question: >-
    Drone: 사용 후 대상은 발사 시점에 고정되어 무슨 일이 있어도 30s 뒤에 타격받습니까, 아니면 drone이 대상이 계속 보이거나 살아 있어야 합니까?
  why_it_matters: >-
    30s 지연 동안 drone을 피할 수 있는지(shield, bubble, 수면, 거리, Greed의 drone 도둑질)가 결정됩니다.
  readings:
    A: >-
      대상은 발사 시점에 고정, 가시성에 무슨 일이 있어도 30s 뒤에 타격 적용
    B: >-
      t+30s에 대상이 여전히 보일 때만 타격 적용
    C: >-
      타격이 대상을 따라가며 방어 여부는 t+30s 시점에만 확인됨
  resolution_paths:
  - >-
    VOD: drone 발사 후, 30s 동안 대상이 숨거나 Shield를 얻는 장면.
U-0306:
  question: >-
    Ingenuity landmine 부착의 '자신에게 사용하는 아이템'에는 어떤 아이템이 해당합니까?
  why_it_matters: >-
    C4 설명은 'another item you hold'라고 하고, landmine 설명은 자신에게 사용하는 아이템으로 제한합니다. 유효한 아이템의 집합이 landmine 함정을 어디에 숨길 수 있는지를 결정합니다.
  readings:
    A: >-
      자기 효과가 있는 소모품 (포션, bandage, shield)
    B: >-
      사용 가능한 모든 아이템
    C: >-
      회복하는 아이템만 해당
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자가 landmine을 여러 종류의 아이템에 붙이는 장면.
U-0307:
  question: >-
    쿨다운 의미(bow 5s, knife 5s, machete 5s, long sword 10s, staff 20min): 시도 시점에 시작됩니까, 타격 시점에 시작됩니까? 그리고 무기 아이템별입니까, 참가자별입니까(Dual Wield)?
  why_it_matters: >-
    Dual Wield와 두 번째 무기가 있을 때 참가자별 쿨다운은 무기별 쿨다운에 비해 처리량을 절반으로 줄이며, 막히거나 빗나간 공격에도 영향을 줍니다.
  readings:
    A: >-
      무기 아이템별, 공격 시점에 시작
    B: >-
      참가자별 (모든 무기가 공유), 공격 시점에 시작
    C: >-
      무기 아이템별, 타격이 확정될 때 시작
  resolution_paths:
  - >-
    VOD: Dual Wield 참가자가 쿨다운 안에 두 무기를 번갈아 쓰는 장면.
