U-0107:
  question: >-
    부활 횟수 제한 '2 times'(Healing 참가자에게)와 '10 times'(Healing 참가자에 의한)는 무엇에 붙는 카운터입니까?
  why_it_matters: >-
    Healing 참가자가 가진 목숨 수와, Healing 부활자가 이벤트 전체에서 수행할 수 있는 부활 횟수를 결정합니다.
  readings:
    A: >-
      2 = 특정 Healing 참가자가 (어떤 부활자에게서든) 평생 받을 수 있는 부활 총횟수. 10 = 특정 Healing 참가자가 평생 수행할 수 있는 부활 총횟수
    B: >-
      2와 10은 (부활자, 대상) 쌍마다 적용됩니다
    C: >-
      2 = 대상의 목숨당. 10 = 부활자당 하루 또는 한 시간당
    D: >-
      Healing 참가자가 다른 Healing 참가자를 부활시키면 두 제한이 모두 적용되고 더 낮은 쪽(2)이 우선하거나, 10만 적용됩니다
  resolution_paths:
  - >-
    VOD: Healing 참가자가 세 번째로 부활한 장면, Healing 부활자가 열한 번째 부활을 수행한 장면.
  - >-
    주최 측 설명.
U-0108:
  question: >-
    비Healing 참가자는 누가 부활시킬 수 있습니까? 두 규칙에서 암시되는 대로 Healing 참가자만입니까, 아니면 다른 규칙에 따라 누구든 가능합니까?
  why_it_matters: >-
    주변에 살아 있는 Healing 참가자가 없을 때 죽은 비Healing 참가자를 부활시킬 수 있는지를 결정합니다.
  readings:
    A: >-
      Healing 참가자만 비Healing 참가자를 부활시킬 수 있고, 다른 참가자는 Healing 참가자만 부활시킬 수 있습니다
    B: >-
      어떤 참가자든 모든 참가자를 부활시킬 수 있고, 2-times 규칙은 Healing 대상에만 해당하는 제한입니다
  resolution_paths:
  - >-
    VOD: 비Healing 참가자가 다른 비Healing 참가자를 부활시키는 장면.
  - >-
    주최 측 설명.
U-0109:
  question: >-
    'Items that do not fit stay in the gravestone': 부활 시 용량 규칙은 무엇이며, 묘비에 남은 아이템은 이후 어떻게 됩니까?
  why_it_matters: >-
    사망 후 인벤토리가 얼마나 남는지, 남은 아이템을 계속 루팅할 수 있는지를 결정합니다.
  readings:
    A: >-
      용량은 범주별 일반 소지 한도이며, 남은 아이템은 누구나 루팅할 수 있는 상태로 남습니다
    B: >-
      남은 아이템은 묘비에 남지만 해당 시간 동안만 블러드 토큰처럼 잠깁니다
  sweep_range: >-
    모든 범주 합산 0 ~ 12 슬롯. 상한은 아이템 페이지에서 확인된 어떤 소지 구성보다 높게 잡은 스윕 선택이며 위키 값이 아닙니다
  resolution_paths:
  - >-
    VOD: 사망과 부활 사이에 새 아이템을 주운 참가자의 부활.
  - >-
    아이템 페이지의 소지 한도를 이 규칙에 대조해 읽기(패밀리 교차).
U-0110:
  question: >-
    오프라인 유예가 끝난 뒤('you start taking damage after 15min') 어떤 피해가 적용됩니까? 서클 밖 규칙(5 s 유예 후 2 s마다 1 HP), 즉시 틱 주기, 또는 다른 것입니까?
  why_it_matters: >-
    휴대폰이 꺼진 참가자가 HP를 얼마나 빨리 잃는지, 유예 이후 사망까지의 시간을 정합니다.
  readings:
    A: >-
      서클 밖과 동일: 5 s 유예 후 2 s마다 1 HP
    B: >-
      유예 종료 시점부터 2 s마다 1 HP, 추가 5 s 없음
    C: >-
      이 페이지에 주어지지 않은 다른 속도
  sweep_range: >-
    0 ~ 5 s: 피해가 유예 종료 시점에 시작하면 0, 서클 밖 유예가 다시 적용되면 5
  resolution_paths:
  - >-
    VOD: 휴대폰이 꺼지고 15 min이 지난 참가자.
  - >-
    REA: 배포된 GPS 감시 로직.
U-0111:
  question: >-
    오프라인 유예 타이머의 의미: 마지막 GPS 갱신으로부터만 측정됩니까, 이후의 GPS 갱신이 타이머를 초기화합니까, 그리고 'live on Kick'은 GPS가 끊긴 순간(A), 만료 시점(B), 또는 부분 누적을 쓰는 연속 평가(C) 중 언제 판정됩니까?
  why_it_matters: >-
    장애 중 방송 끊김이나 재연결에 따라 유예가 15 min과 30 min 사이에서 달라지며, U-0012의 탐지 지연과 연결됩니다.
  readings:
    A: >-
      마지막 GPS 갱신 시점에 Kick 라이브 중이었으면 유예 = 30 min, 아니면 15 min이며 그 시점에 고정됩니다
    B: >-
      라이브 상태는 15 min이 끝날 때 읽습니다. 그때 라이브 중이면 기한이 30 min으로 옮겨집니다
    C: >-
      오프라인 경과 시간은 각 순간의 라이브 상태에 따라 분당 1/15 또는 1/30의 가중치로 누적됩니다
  resolution_paths:
  - >-
    VOD: 라이브 중 휴대폰이 꺼지고 10분째에 방송이 끝난 경우의 피해 시작 시점.
  - >-
    주최 측 설명.
U-0112:
  question: >-
    속도 규칙의 평균: '20mph on average over 1min'은 슬라이딩 윈도, 고정 윈도, 거리 대 시간의 비율 중 무엇입니까? '30mph over any 15s'는 15 s 윈도의 같은 평균입니까, 아니면 최고 속도입니까? 비교는 엄격합니까? 8.94와 13.41 m/s가 정확한 임계값입니까?
  why_it_matters: >-
    차량 탑승이나 GPS 점프에서 누가 너무 빠르게 이동하는 것으로 분류되는지, 그리고 발동 경계를 정확히 결정합니다.
  readings:
    A: >-
      슬라이딩 윈도, 평균 속도 = 변위 경로 길이 / 윈도 길이, 엄격한 >, 임계값은 표기된 대로 8.94와 13.41 m/s
    B: >-
      같지만 임계값이 정확히 8.9408과 13.4112 m/s
    C: >-
      경로 길이가 아니라 윈도 안에서 시작점과 끝점 사이의 직선 변위
    D: >-
      15 s 규칙은 순간 최고 속도를 사용합니다
  resolution_paths:
  - >-
    VOD/GPS 기록: 임계값 부근의 차량 이동.
  - >-
    REA: 배포된 속도 검사.
U-0113:
  question: >-
    'Moving too fast counts as being outside': 속도 규칙이 발동하면 5 s 유예와 2 s당 1 HP가 서클 밖처럼 적용됩니까, 언제부터 시작됩니까, 그리고 속도가 떨어지는 즉시 끝납니까?
  why_it_matters: >-
    빠른 이동의 대가를 정합니다: 즉시 틱인지, 5 s 지연과 히스테리시스인지.
  readings:
    A: >-
      위반 = 서클 밖. 일반 5 s 유예 뒤 틱이 시작되고, 윈도가 다시 정상이 되면 끝납니다
    B: >-
      유예 없이 틱이 즉시 시작됩니다
    C: >-
      윈도가 다시 정상이 될 때까지 서클 밖 상태가 유지되며, 이는 속도 하락보다 최대 윈도 길이만큼 늦습니다
  sweep_range: >-
    0 ~ 5 s: 유예가 없으면 0, 서클 밖 유예와 같으면 5
  resolution_paths:
  - >-
    VOD: 빠른 탑승 중인 참가자의 속도 대비 HP 타임라인.
U-0114:
  question: >-
    존이 'split apart'할 수 있습니다: 세이프 존이 여럿일 때 'leave a safezone' 피해는 모든 존의 밖에 있을 때(A) 발동합니까, 아니면 마지막으로 있던 존을 떠날 때(B) 발동합니까?
  why_it_matters: >-
    두 존 사이를 건너는 것이 손실인지를 결정하며, 존이 갈라질 때 핵심입니다.
  readings:
    A: >-
      위치가 어느 세이프 존 안에도 없을 때만 피해 시계가 흐릅니다
    B: >-
      존을 떠날 때 피해 시계가 흐르고, 어느 존에든 다시 들어가면 재시작됩니다
    C: >-
      피해 시계는 참가자마다 지정된 하나의 존에 묶입니다
  resolution_paths:
  - >-
    VOD: 존이 갈라지는 이벤트와 두 존 사이를 건너는 참가자.
  - >-
    주최 측 설명.
  resolution: >-
    2026-11-11 스냅샷의 본문만으로 2026-11-13에 범위를 좁혔으며, 해결된 것은 아닙니다. 세 조항이 조건을 모든 세이프 존의 밖에 있는 것으로 적고 있으며, 이는 해석 A입니다. "Only the part inside a safe zone hurts: outside every safe zone you take normal zone damage only"(wiki-sigils-trolling-023), 언세이프 서클은 "Anyone inside it who is also inside a safe zone"에게 피해를 주고(wiki-sigils-trolling-017), 거대 사이클롭스에 대해서는 "Outside the safe zones it takes zone damage"라고 합니다(wiki-attacks-071). 참가자를 하나의 존에 지정하는 조항(해석 C)은 없으며, 존이 갈라지는 경우를 설명하는 조항도 없습니다. 아직 미해결: 갈라짐을 담은 VOD 또는 주최 측 설명이 이를 확인해 줄 것입니다.
U-0115:
