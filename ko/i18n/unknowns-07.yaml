U-0513:
  question: >-
    Ingenuity의 "Recognize fake chests and gravestones, see traps, and hack landmines or C4 within 50m (164ft)": 50 m 제한은 세 능력 모두에 적용됩니까, 아니면 해킹에만 적용됩니까?
  why_it_matters: >-
    가짜 탐지의 범위는 Ingenuity 참가자가 지도의 어느 범위까지 Trolling 함정을 간파하는지를 결정합니다.
  readings:
