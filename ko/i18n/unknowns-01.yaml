U-0000:
  question: >-
    보고된 $5,000 시청자 상금의 출처와 정확한 조건은 무엇입니까?
  why_it_matters: >-
    시청자 경제 모델(8.10절)에서 시청자의 목표를 정합니다. 이것이 없으면 시청자 전략은 Cx-Buck당 피해를 최대화하는 것으로만 설정할 수 있습니다.
  readings:
    A: >-
      $5,000 상금은 존재하지 않으며, 시청자 상금은 금액이 정해지지 않은 '상위 3명 시청자' 현금 상금입니다.
    B: >-
      $5,000 상금이 존재하며, 아직 찾지 못한 조건이 있습니다.
  resolution_paths:
  - >-
    주최자의 X 게시물을 직접 읽습니다(kil의 로그인된 브라우저 세션이 필요합니다).
  - >-
    방송 중 주최자의 발언(VOD 타임스탬프).
  - >-
    kil이 SCOPE.md에 추가하는 경우 /events 또는 /safezone/recap 페이지.
U-0001:
  question: >-
    방어자의 Kick 라이브 10% 감소는 결과를 내림하는 것입니까(A), 아니면 제거되는 10%를 내림하는 것입니까(B)?
  why_it_matters: >-
    작은 타격마다 최대 1 HP씩 결과가 달라집니다. A에서는 2에서 10까지의 타격이 1 HP를 잃고, B에서는 10 미만의 타격은 변하지 않습니다.
  readings:
    A: >-
      d -> floor(9d/10)
    B: >-
      d -> d - floor(d/10)
  resolution_paths:
  - >-
    VOD: 5 HP 타격(활, 칼, 가짜 상자)을 받는 라이브 참가자에게 -4(A) 또는 -5(B)가 표시됩니다.
  - >-
    REA: 배포된 코드의 피해 공식(클라이언트 코드에는 공식이 없습니다, RE-0001).
U-0002:
  question: >-
    어떤 피해 원천이 7단계 타격 파이프라인을 거칩니까(존 틱, 독, 출혈, 좀비 드레인(drain), 가드 좀비, 로봇, 언세이프 서클(unsafe circle), Eddie의 손실, 부활 비용, Retribution)?
  why_it_matters: >-
    Kick 라이브 감소, 최소 1 HP, fortress와 armor가 주기적 피해와 자해 피해에도 적용되는지를 정합니다.
  readings:
    A: >-
      모든 HP 손실은 타격이며 7단계를 모두 거칩니다.
    B: >-
      개별 공격만 타격이며, 주기적 드레인과 비용은 파이프라인을 우회합니다.
    C: >-
      원천에 따라 혼합됩니다.
  resolution_paths:
  - >-
    VOD: 존 밖에 있는 라이브 참가자의 2 s 틱당 HP 손실(U-0001의 두 해석 모두에서 1이므로 대신 armor 내구도를 관찰합니다).
  - >-
    VOD: 좀비 드레인 또는 독 이후의 armor 내구도.
U-0003:
  question: >-
    존 피해: 세이프 존을 벗어난 뒤 첫 틱은 5 s입니까, 7 s입니까?
  why_it_matters: >-
    존 밖에서 사망하기까지의 시간이 2 s 달라집니다(T(100) = 203 s 또는 205 s).
  readings:
    A: >-
      첫 틱은 5 s, 이후 2 s마다
    B: >-
      첫 틱은 7 s(5 s 유예 후 2 s 간격 한 번)
  resolution_paths:
  - >-
    존을 벗어나는 참가자를 화면 내 타이머와 함께 담은 VOD.
U-0004:
  question: >-
    Eddie의 물약 30% 손실이 사망을 일으킬 수 있으며, armor, fortress 또는 Kick 상태가 여기에 적용됩니까?
  why_it_matters: >-
    물약이 최후의 수단인지, 낮은 HP에서의 자살인지를 정합니다.
  readings:
    A: >-
      손실로 사망할 수 있으며 어떤 보호도 적용되지 않습니다.
    B: >-
      손실로 사망할 수 있으며 파이프라인이 적용됩니다(armor가 흡수하고 Kick이 감소시킵니다).
    C: >-
      손실로 HP가 1 아래로 내려갈 수 없습니다.
  resolution_paths:
  - >-
    VOD: 최대 HP의 30% 이하인 참가자가 이 물약을 마시는 장면.
  - >-
    피해 표는 'Eddie's Potion backfire'를 Shield, Safety bubble, Sleeping Bag, Body armor로 막을 수 있다고 기재하며, 이는 차단에 관해 B를 뒷받침합니다(공식화 예정).
U-0005:
  question: >-
    반사된 타격은 공격자 자신의 파이프라인(면역, 감소, armor)을 거칩니까?
  why_it_matters: >-
    armor를 가진 공격자 또는 라이브 공격자를 상대로 한 Mirror forcefield의 가치가 달라집니다.
  readings:
    A: >-
      반사된 타격은 공격자의 전체 파이프라인을 거칩니다.
    B: >-
      반사된 타격은 가공 없이 그대로 적중합니다.
  resolution_paths:
  - >-
    VOD: armor를 가진 공격자에게 반사된 타격.
U-0006:
  question: >-
    서버 연산은 정확합니까, 아니면 IEEE 754 binary64입니까(H-0001: Ingenuity 가격이 기본 50, 90, 100, 110일 때)?
  why_it_matters: >-
    binary64의 ceil(p*1.1)은 해당 기본 가격에서 블러드 토큰 1개를 더 청구합니다.
  readings:
    A: >-
      정확한 정수 연산
    B: >-
      ceil(p * 1.1)을 쓰는 binary64
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자의 상인 화면에서 Dual Wield(기본 50)가 55(A) 또는 56(B)로 표시됩니다.
U-0007:
  question: >-
    Healing 재생: 피해가 30 min 타이머를 초기화합니까?
  why_it_matters: >-
    주기적 피해 상황에서 지속 재생 속도를 정합니다.
  readings:
    A: >-
      30 min 고정 시계이며 피해가 이를 초기화하지 않습니다
    B: >-
      피해가 타이머를 초기화합니다
  resolution_paths:
  - >-
    VOD: 타격을 받는 Healing 참가자의 한 시간 동안의 HP.
U-0008:
  question: >-
    좀비 30 HP 상한: 좀비 수명당입니까, 조우당입니까, 하루당입니까? 좀비가 죽으면 어떻게 됩니까?
  why_it_matters: >-
    좀비 피해 총량의 한계를 정합니다. 조우당이라면 좀비 피해는 무제한이 됩니다.
  readings:
    A: >-
      좀비 수명당, 참가자별
