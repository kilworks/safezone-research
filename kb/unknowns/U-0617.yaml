id: U-0617
question: 'Protection ''Potions heal you 50% less'': which heals are ''potions'' (health potions, Eddie''s potion, God''s Fruit, bandages, healing circle)?'
why_it_matters: Decides how much healing a Protection contestant can still use.
readings:
  A: health potions of every tier only
  B: health potions and Eddie's potion (a gamble that heals 50% of max HP)
  C: every item heal
resolution_paths:
- 'VOD: Protection contestant using each heal item.'
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. A Campfire is out of the rule: "Piety and Protection potion changes do not apply" (wiki-sigils-ingenuity-021). Bandages have their own line on the Protection page, next to the potion line: "Bandages last 1.1x as long" (wiki-sigils-protection-017); that suggests they are not counted as potions, without saying so. The Campfire clause puts the Protection change next to the Piety one, which is written for "Health potions" (wiki-sigils-piety-013); that favors reading A without settling it. Still open: Eddie''s potion, God''s Fruit, the healing circle and the craft made from Anti poison and a Health potion.'
