id: U-0114
question: 'The zone can ''split apart'': with several safe zones, is ''leave a safezone'' damage triggered when outside every zone (A) or when leaving the zone you were last in (B)?'
why_it_matters: Decides whether crossing between two zones is a loss, which is central when the zone splits.
readings:
  A: damage clock runs only when the position is inside no safe zone
  B: damage clock runs when leaving a zone, restarts if re-entering any zone
  C: damage clock is tied to one assigned zone per contestant
resolution_paths:
- 'VOD: a split event and a contestant crossing between the two.'
- Organizer statement.
priority: high
status: open
resolution: 'Narrowed on 2026-11-13 from the text of the 2026-11-11 snapshot, not resolved. Three clauses word the condition as being outside all the safe zones, which is reading A: "Only the part inside a safe zone hurts: outside every safe zone you take normal zone damage only" (wiki-sigils-trolling-023), an unsafe circle hurts "Anyone inside it who is also inside a safe zone" (wiki-sigils-trolling-017), and of the giant cyclops, "Outside the safe zones it takes zone damage" (wiki-attacks-071). No clause assigns a contestant to one zone (reading C) and none describes a split. Still open: a VOD of a split or an organizer statement would confirm it.'
related:
