U-0303:
  question: >-
    '각각 최대 5개가 한 슬롯을 공유한다 / 각각 최대 5개를 소지한다'라는 상한은 'An enchanted one uses its own slot'과 어떻게 맞물립니까?
  why_it_matters: >-
