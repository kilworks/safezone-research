    VOD: 가짜 상자로부터 여러 거리에 있을 때 Ingenuity 참가자의 지도.
U-0514:
  question: >-
    landmine 또는 C4에 대한 "hack"은 무엇을 하며, 제한이 있습니까?
  why_it_matters: >-
    Ingenuity는 해킹마다 블러드 토큰 하나를 얻습니다. 그 효과(해제, 탈취, 훔치기)가 적의 폭발물에 대한 대응이 되는지, 아니면 그것을 역이용하는지를 결정합니다.
  readings:
    A: >-
      해킹이 폭발물을 해제하거나 파괴함
    B: >-
      해킹이 Ingenuity 참가자에게 통제권을 넘김 (시길 문구에 "take control of traps"라고 되어 있음)
    C: >-
      해킹이 폭발물을 드러내고 Ingenuity 참가자가 집어 들 수 있게 함
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자가 적의 landmine을 해킹하는 장면.
U-0515:
  question: >-
    Ingenuity 포션 합치기: "two matching potions"는 무슨 뜻이며, 비용이나 제한이 있습니까?
  why_it_matters: >-
    회복 값은 정확히 더해지므로(5+5=10, 10+10=20, 20+20=40) 합치기는 회복에서 손실이 없지만 2칸 시길에서는 칸을 절약합니다. 제한은 명시되어 있지 않습니다.
  readings:
    A: >-
      같은 크기의 체력 포션 두 개가 다음 크기 하나가 됨 (작은 것에서 중간, 큰 것, 거대(gigantic)로). 거대 포션은 합칠 수 없음
    B: >-
      같은 종류의 포션 두 개(Eddie's potion이나 Anti poison 포함)는 모두 합칠 수 있음
    C: >-
      A와 같으나 명시되지 않은 쿨다운 또는 비용이 있음
  resolution_paths:
  - >-
    VOD: Ingenuity 참가자가 포션을 합치는 장면.
U-0516:
  question: >-
    Trapped gift: 16 h 제한은 landmine과 C4 부착이 공유합니까, 그리고 누가 함정을 볼 수 있습니까(소유자만, 아니면 다른 Ingenuity 참가자도)?
  why_it_matters: >-
    Ingenuity 페이지는 이 둘에 대해 "once every 16h"라고 하며, C4와 Landmine 페이지는 각각에 대해 이를 반복하고, 한 줄은 "Only you and Sigil of Ingenuity contestants can see it"라고 합니다.
  readings:
