id: M-0642
name: Protection blood tokens from immunity blocks
family: economy
sigils:
- protection
sources:
- url: https://iceposeidon.com/safezone/wiki/sigils/protection#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-protection-010
  quote: A drone, missile, C4 or landmine hit earns one blood token, and an airstrike or gunship hit earns 1, but only when your own immunity blocks it.
- url: https://iceposeidon.com/safezone/wiki/sigils/protection#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-protection-011
  quote: A nuke hit earns twenty when your damage cut applies.
- url: https://iceposeidon.com/safezone/wiki/sigils/protection#rules
  snapshot: '2026-11-11'
  clause: wiki-sigils-protection-012
  quote: A hit already blocked by something else earns nothing.
formal:
  readings:
    A: tokens += 1 per blocked hit of {drone, missile, C4, landmine, airstrike, gunship}; += 20 per nuke hit that reaches the 50% reduction; += 0 if another blocker already stopped the hit
    B: A plus airstrike fire ticks pay
  parameters:
    tokens_per_block: '1'
    tokens_per_nuke: '20'
depends_on:
- M-0640
- M-0643
interacts_with: []
label: CONDITIONAL
open_unknowns:
- U-0620
- U-0002
notes: Poison, trapped gift and Protection retribution are in the immunity list but not in the token list. The nuke bonus is 20 tokens. Whether a sigil landmine of its own pays is not stated.
