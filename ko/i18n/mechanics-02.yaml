      blockers(Bow) = {Shield: 막음; Safety bubble: 막음; Sleeping Bag: 막음; Mirror forcefield: 반사함; Body armor: 흡수함}
  domain: >-
    원천 'Bow'의 타격 1회
  notes: >-
    공격자의 Kick 보너스가 이 원천에 적용됩니다 (2단계 목록).
M-0147:
