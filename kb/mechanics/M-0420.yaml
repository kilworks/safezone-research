id: M-0420
name: Illusion copies
family: viewer
sigils:
- all
sources:
- url: https://iceposeidon.com/safezone/wiki/attacks#illusion
  snapshot: '2026-11-11'
  quote: For 10min, a copy of every living contestant walks around the safe zones at 1.4m/s (3.13mph).
  clause: wiki-attacks-048
- url: https://iceposeidon.com/safezone/wiki/attacks#illusion
  snapshot: '2026-11-11'
  quote: With fewer than 10 contestants alive, each one gets several copies, up to 30 in total.
  clause: wiki-attacks-049
- url: https://iceposeidon.com/safezone/wiki/attacks#illusion
  snapshot: '2026-11-11'
  quote: You never see copies of yourself.
  clause: wiki-attacks-051
formal:
  readings:
    A: for 600 s each living contestant has a copy; if n < 10, floor(30/n) copies each
    B: ceil(30/n), capped at 30
    C: n >= 10 uncapped
  domain: n living contestants, copies walk at 1.4 m/s; viewers never see their own copies
  parameters:
    duration: 600 s
    speed: 1.4 m/s
    max_total: '30'
    price_cx_bucks: UNKNOWN, see U-0014
depends_on: []
interacts_with: []
label: CONDITIONAL
open_unknowns:
- U-0414
- U-0014
notes: '''Copies look like real contestants'' is cosmetic but links to Thermal goggles.'
